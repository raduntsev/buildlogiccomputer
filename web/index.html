<style>/* Logic Lab — "lab console".
   Stone canvas with a faint grid, floating rounded cards, pill controls, graphite for structure and emphasis,
   one lime accent for logic 1 and anything switched on, coral only for faults. Big numerals with small units.
   Typeface: Onest (Cyrillic-first neo-grotesque). */
:root{
  --bg:#E6E6E1;        /* stone canvas */
  --grid:#D7D7D0; --grid2:#CBCBC3;
  --paper:#FAFAF7;     /* cards */
  --card2:#F1F1EC;     /* inset areas */
  --ink:#1A1B1D;       /* graphite */
  --ink2:#4B4D50;
  --mute:#8B8D87;
  --line:#D2D2CB;
  --acc:#DCEB3A;       /* lime: logic 1, lamps, on */
  --acc-soft:#EEF5A6;
  --acc-ink:#1A1B1D;   /* text on lime is graphite */
  --w0:#BDBEB6; --w1:#1A1B1D;
  --ok:#ECF3C2; --ok-ink:#3E4A00;
  --bad:#F7D8D0; --bad-ink:#C2412A; --coral:#E8553D;
  --r:22px; --r-s:14px;
  --shadow:0 1px 0 rgba(26,27,29,.04),0 12px 32px -16px rgba(26,27,29,.28);
  --ui:1; --ww:4;
  --font:"Onest","Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#board{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
#board.panning{cursor:grabbing}
#frame{display:none}
.zz{zoom:var(--ui)}

/* ---------- top bar: floating pills ---------- */
#top{position:fixed;left:16px;right:16px;top:14px;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
.tb{display:flex;gap:6px;align-items:center}
.tb.r{justify-content:flex-end}
.tbtn{height:40px;padding:0 16px;font-size:15px;font-weight:500;color:var(--ink);background:var(--paper);border-radius:999px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn:hover{background:#fff}
.tbtn:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.tbtn.primary{color:#fff;background:var(--ink);padding:0 22px}
.tbtn.primary:hover{background:#000}
/* icon buttons: the label (and hotkey) slides in on hover / keyboard focus */
.tbtn.ico{padding:0 12px;overflow:hidden}
.tbtn.ico svg{width:18px;height:18px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tl{display:inline-flex;align-items:center;gap:6px;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .25s ease,opacity .2s ease,margin-left .25s ease}
.tbtn.ico:hover .tl,.tbtn.ico:focus-visible .tl,.ib:hover .tl,.ib:focus-visible .tl{max-width:240px;opacity:1;margin-left:8px}
.ib{width:auto;min-width:36px;overflow:hidden}
.ib .tl{margin-left:0}
.tk{font:inherit;font-size:11px;font-weight:600;line-height:1.4;color:var(--mute);border:1.5px solid var(--line);border-radius:6px;padding:0 5px}
.tbtn.primary .tk{color:#D5D7D0;border-color:rgba(255,255,255,.4)}
@media (hover:none){.tbtn.ico .tl,.ib .tl{display:none}}
#formula{height:44px;display:flex;align-items:center;padding:0 22px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-size:21px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;pointer-events:none}
#formula:empty{display:none}
.ov{text-decoration:overline;text-decoration-thickness:1.5px;text-underline-offset:0}
#formula sub,#sheet sub,#chatText sub{font-size:.62em}
.sep{display:inline-block;width:1.3em}
.op{font-size:.82em;vertical-align:.04em;margin:0 .04em}
.lim{font-size:13px;font-weight:600;margin-left:12px;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px}
#hud{gap:10px}
#hud .hr{color:var(--ink2);font-weight:500}
#hud .hp{font-variant-numeric:tabular-nums;font-weight:600;background:var(--acc);border-radius:999px;padding:3px 10px;margin-right:-8px}
/* gates / record pill next to the Test button */
#gmet{display:inline-flex;align-items:center;gap:9px;height:32px;padding:0 13px;border-radius:999px;background:var(--card2);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;cursor:default}
#gmet:empty{display:none}
#gmet i{font-style:normal;font-size:11.5px;color:var(--mute);font-weight:500}
#gmet .p{font-size:13px;font-weight:500;color:var(--ink2)}
#gmet .over{color:var(--coral)}

/* ---------- element toolbar ---------- */
#palette{position:fixed;left:16px;top:76px;display:flex;flex-direction:column;gap:2px;background:var(--paper);border-radius:var(--r);padding:6px;box-shadow:var(--shadow);z-index:3;max-height:calc(100vh - 100px);overflow:auto;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#palette::-webkit-scrollbar{width:5px;height:5px}
#palette::-webkit-scrollbar-thumb{background:var(--line);border-radius:5px}
#palette::-webkit-scrollbar-track{background:transparent}
#palette::-webkit-scrollbar-button{display:none;width:0;height:0}
#palette:empty{display:none}
/* long names wrap to a second line instead of colliding with the next item */
.pi{display:flex;flex-direction:column;align-items:center;width:72px;padding:9px 0 7px;cursor:grab;color:var(--ink2);touch-action:none;border-radius:16px;transition:transform .12s,background .12s}
.pi:hover{background:var(--card2);color:var(--ink)}
.pi:active{background:var(--acc);transform:scale(.94)}
.pi svg{width:48px;height:30px;overflow:visible}
.pi span{font-size:11.5px;margin-top:4px;font-weight:500;text-align:center;line-height:1.15;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pk{display:inline-block;margin-left:4px;font-size:9px;font-weight:600;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 3px;vertical-align:1px}
@media (hover:none){.pk{display:none}}
@media (min-width:761px){#palette.psc{-webkit-mask-image:linear-gradient(#000 0 88%,transparent 99%);mask-image:linear-gradient(#000 0 88%,transparent 99%)}}

/* ---------- zoom ---------- */
#zoom{position:fixed;right:16px;z-index:4;display:flex;gap:4px;transition:bottom .15s}
#zoom{gap:0;padding:3px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
#zoom .tbtn{height:34px;padding:0 14px;font-size:14px;box-shadow:none;background:transparent}
#zoom .tbtn:hover{background:var(--card2)}
#zoom #zOut,#zoom #zIn{width:34px;padding:0;justify-content:center}

/* ---------- bottom dock ---------- */
#sheet{position:fixed;left:16px;right:16px;bottom:14px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:3;overflow:hidden}
#grip{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;cursor:ns-resize;touch-action:none;position:relative}
/* the handle bar is also the collapse toggle: a tap (<4 px move) toggles, a drag resizes */
#grip::before{content:"";position:absolute;left:50%;top:7px;width:44px;height:5px;margin-left:-22px;border-radius:5px;background:var(--line);transition:background .15s,transform .15s}
#grip:hover::before{background:var(--mute);transform:scaleX(1.15)}
#lvNum{font-size:30px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
#lvHead{display:inline-flex;align-items:baseline;gap:12px;min-width:0}
#lvTitle{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvStars{font-size:15px;letter-spacing:2px}
.st{color:var(--line)}.st.on{color:var(--ink)}
#saved{font-size:12px;color:var(--mute);opacity:0;transition:opacity .3s;display:inline-flex;align-items:center;gap:6px}
#saved::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--ink)}
#saved.on{opacity:1}
#hintBtn{margin-left:auto;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;background:var(--card2)}
#hintBtn:hover{background:var(--acc)}
#sheetBody{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:10px;padding:0 10px 10px;align-items:stretch}
#task{padding:6px 8px 8px;font-size:16px;line-height:1.45;color:var(--ink2);min-width:0}
#hint{margin-top:10px;font-size:15px;color:var(--ink);background:var(--acc-soft);border-radius:var(--r-s);padding:10px 14px;display:none}
#hint.on{display:block}
#ttWrap{overflow:auto;background:var(--card2);border-radius:18px;padding:6px 10px 10px}
#ttWrap:empty{display:none}
table.tt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:15px}
.tt th{font-weight:500;color:var(--mute);padding:6px 12px;text-align:center;font-size:13px}
.tt td{padding:4px 12px;text-align:center;cursor:pointer;font-weight:500}
.tt tr td:first-child{border-radius:10px 0 0 10px}.tt tr td:last-child{border-radius:0 10px 10px 0}
.tt th.gap,.tt td.gap{box-shadow:inset 1px 0 0 var(--line)}
.tt th.n,.tt td.n{color:var(--mute);font-size:12px;padding:4px 8px}
.tt tr.live td{background:var(--paper)}
.tt tr.cur td{background:var(--ink);color:#fff}
.tt tr.ok td{background:var(--ok);color:var(--ok-ink)}
.tt tr.bad td{background:var(--bad);color:var(--bad-ink)}
.tt .act{display:inline-block;font-size:11px;line-height:16px;min-width:16px;margin-right:5px;background:var(--coral);color:#fff;border-radius:8px;font-weight:600;vertical-align:1px}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:8}
#toast.on{opacity:1}

/* ---------- result card ---------- */
#result{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(230,230,225,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#result.on{display:flex}
#resCard{background:var(--ink);color:#fff;border-radius:30px;padding:28px 28px 22px;width:min(440px,92vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:translateY(16px) scale(.96);opacity:0}}
#resTitle{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.02em}
#resTitle::before{content:"✓";flex:0 0 52px;height:52px;border-radius:50%;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
#resTitle.bad::before{content:"!";background:var(--coral);color:#fff}
#resTitle small{display:block;font-size:13px;font-weight:400;color:#A4A6A0;letter-spacing:0;margin-top:2px}
#resSub{margin-top:20px}
#resBtns{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
#resBtns .tbtn{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #4A4C50}
#resBtns .tbtn:hover{box-shadow:inset 0 0 0 1.5px #fff}
#resBtns .tbtn.primary{background:var(--acc);color:var(--ink);box-shadow:none;margin-left:auto}
.rstars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rs{display:flex;flex-direction:column;gap:6px;background:#26282B;border-radius:16px;padding:12px}
.rs b{width:26px;height:26px;border-radius:50%;background:#3A3C40;color:#3A3C40;display:flex;align-items:center;justify-content:center;font-size:14px}
.rs.on b{background:var(--acc);color:var(--ink)}
.rs span{font-size:12.5px;color:#A4A6A0;line-height:1.25}
.rs.on span{color:#fff}
.rmet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.rmet div{background:#26282B;border-radius:16px;padding:12px}
.rmet b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rmet b.hl{color:var(--acc)}
.rmet span{font-size:12px;color:#A4A6A0}
.rsub{color:#C9CBC4;font-size:15px;line-height:1.45}

/* ---------- full-screen screens ---------- */
#ov{position:fixed;inset:0;z-index:5;background-color:var(--bg);display:none;overflow:auto}
/* the dot grid is its own layer so the parallax only moves pixels, it never repaints the screen */
#ovBg{position:fixed;inset:-24px;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--grid2) 1px,transparent 1.2px);background-size:22px 22px;will-change:translate}
#ov.on{display:block}
.scr{display:none;min-height:100%;padding:56px 6vw 64px}
.scr.on{display:block}
#scrMain.on{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:4vw;align-items:center;min-height:100vh}
.brand{font-size:clamp(56px,7.5vw,104px);font-weight:600;letter-spacing:-.045em;line-height:.9}
.brand-sub{color:var(--ink2);margin:14px 0 34px;font-size:17px;max-width:30ch}
.mlist{background:var(--paper);border-radius:28px;padding:8px;box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:22px;font-weight:500;letter-spacing:-.01em;padding:14px 18px;border-radius:20px;color:var(--ink);text-align:left}
.mi .mm{font-size:13px;font-weight:500;color:var(--mute);background:var(--card2);border-radius:999px;padding:4px 10px}
.mi:hover,.mi:focus-visible{background:var(--ink);color:#fff;outline:none}
.mi:hover .mm,.mi:focus-visible .mm{background:#33353A;color:#D5D7D0}
.mi[data-go="continue"]{background:var(--acc)}
.mi[data-go="continue"]:hover{background:var(--ink)}
.mi.small{display:inline-flex;width:auto;font-size:15px;margin-top:24px;padding:0 18px;height:40px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
.mi .v{color:var(--mute)}
.scr h2{font-size:clamp(40px,5vw,64px);font-weight:600;letter-spacing:-.04em;margin-bottom:26px;line-height:1}
.about{max-width:620px;color:var(--ink2);font-size:18px;line-height:1.55;background:var(--paper);border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow)}
#machine{width:100%;max-width:700px;height:auto;overflow:visible}
#machineCap{color:var(--ink2);font-size:15px;margin-top:4px;padding-left:6px}
#tree{display:block;overflow:visible;max-width:100%}
#tree .node{cursor:pointer}
#tree .node.lock{cursor:default}
#treeTip{min-height:44px;font-size:16px;color:var(--ink);margin-top:14px;background:var(--paper);border-radius:999px;padding:12px 20px;display:inline-block;box-shadow:var(--shadow)}
#treeTip:empty{display:none}
.tm{color:var(--mute)}

/* ---------- board svg ---------- */
.w{fill:none;pointer-events:none;stroke-width:calc(var(--ww) * 1px);stroke-linejoin:round;stroke-linecap:round}
/* canvas-coloured halo under every wire: where wires cross, the upper one visibly passes over the lower */
.wgap{fill:none;pointer-events:none;stroke:var(--bg);stroke-width:calc(var(--ww) * 1px + 6px);stroke-linejoin:round}
.w0{stroke:var(--w0)}
.w1{stroke:var(--w1)}
.wf{fill:none;pointer-events:none;stroke:var(--acc);stroke-width:max(1.5px,calc(var(--ww) * 1px - 2.5px));stroke-dasharray:5 23;stroke-linecap:round;animation:flow2 1.6s linear infinite}
@keyframes flow2{to{stroke-dashoffset:-28}}
@keyframes flow{to{stroke-dashoffset:-22}}
.whit{fill:none;stroke:transparent;stroke-width:calc(var(--ww) * 1px + 12px);cursor:pointer}
.whit.on{cursor:move}
.whit:hover+.wsel,.wsel.on{stroke:rgba(220,235,58,.75)}
.wsel{fill:none;stroke:transparent;stroke-width:calc(var(--ww) * 1px + 8px);pointer-events:none;stroke-linejoin:round;stroke-linecap:round}
.gb{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.gst{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
.gl{font:600 15px var(--font);fill:var(--ink);text-anchor:middle}
.gl.s{font-size:11px;font-weight:500}
.gate{cursor:move}
.gate.sel .gb{fill:var(--acc-soft)}
.gate.src .gb{fill:rgba(220,235,58,.28)}
.msel{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5;pointer-events:none;opacity:.55}
.mbox{fill:rgba(220,235,58,.18);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;pointer-events:none;vector-effect:non-scaling-stroke}
.pin-in{fill:var(--ink)}
.pin-out{fill:var(--ink)}
.pin-hit{fill:transparent;cursor:crosshair}
.pin-hit:hover{fill:rgba(220,235,58,.6)}
.short{fill:none;pointer-events:none;stroke:var(--coral);stroke-width:3;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.flag{cursor:pointer}
.lbl{font:600 15px var(--font);text-anchor:middle;dominant-baseline:central}
.jn{fill:var(--ink);pointer-events:none}
.cut{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round}
.ghost{opacity:.55;pointer-events:none}
.tmp{opacity:.8}
.onb{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:1 9;stroke-linecap:round;animation:flow 2.2s linear infinite;opacity:.5;pointer-events:none}

body.hc{--w0:#8E9089;--mute:#62645E;--ink2:#2C2E31;--line:#AFAFA7;--grid:#C4C4BC;--grid2:#B1B1A9}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
.scr.on>*{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.scr.on>*:nth-child(2){animation-delay:.05s}.scr.on>*:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- settings ---------- */
#setList{max-width:720px}
.sgrp{font-size:13px;font-weight:600;color:var(--mute);margin:26px 0 8px 6px}
.sgrp:first-child{margin-top:0}
.sgrp+.srow{border-radius:20px 20px 0 0}
.srow{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 20px;background:var(--paper);font-size:17px;font-weight:500;box-shadow:inset 0 -1px 0 var(--line)}
.srow:has(+ .sgrp),.srow:last-child{border-radius:0 0 20px 20px;box-shadow:none}
.srow .k{flex:1;color:var(--ink);cursor:pointer}
.srow .ar{width:36px;height:36px;border-radius:50%;background:var(--card2);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center}
.srow .ar:hover{background:var(--acc)}
.srow .val{min-width:190px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.sbar{display:inline-block;width:100px;height:6px;border-radius:6px;background:var(--line);vertical-align:middle;margin-right:10px;position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:6px}

/* ---------- Bit and the comm link ---------- */
#mascot{position:fixed;right:18px;display:flex;align-items:flex-end;gap:10px;pointer-events:none;z-index:6}
#mascot.off{display:none}
#bit{width:78px;height:98px;pointer-events:auto;cursor:pointer;flex:0 0 auto;overflow:visible;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
#bit.jump,#menuBit.jump #mbSvg{animation:jump .9s cubic-bezier(.3,1.3,.5,1) 1}
@keyframes jump{40%{transform:translateY(-8px)}75%{transform:translateY(0) scaleY(.97)}}
#bit.shake{animation:shake .6s 2}
@keyframes shake{25%{transform:translateX(-2px) rotate(-2deg)}75%{transform:translateX(2px) rotate(2deg)}}
#bit .eye,.bitsvg .eye{transform-origin:40px 42px;transform-box:view-box;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#bit .arm-r{transform-origin:66px 50px;transform-box:view-box}
#bit.wave .arm-r{animation:wave .8s ease-in-out 2}
@keyframes wave{50%{transform:rotate(-30deg)}}
#bit .m-open{animation:talk .36s steps(1) infinite}
@keyframes talk{50%{opacity:0}}
#bit .spark{animation:spark 2.6s ease-in-out infinite}
@keyframes spark{50%{opacity:.35}}
#chat{pointer-events:auto;width:min(380px,calc(100vw - 120px));background:var(--paper);border-radius:24px;box-shadow:var(--shadow),0 0 0 1px rgba(26,27,29,.04);position:relative;margin-bottom:46px;opacity:0;transform:translateY(8px) scale(.98);transform-origin:100% 100%;transition:opacity .16s,transform .16s;visibility:hidden;overflow:hidden}
#chat.on{opacity:1;transform:none;visibility:visible}
.chd{display:flex;align-items:center;gap:8px;padding:12px 10px 0 16px;font-size:13px}
.chd .cn{font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chd .cn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--ink)}
.chd .cs{color:var(--mute);flex:1}
.chd button{font-size:12.5px;font-weight:500;color:var(--ink2);padding:5px 11px;border-radius:999px;background:var(--card2)}
.chd button:hover{background:var(--acc);color:var(--ink)}
#chatX{width:28px;height:28px;padding:0!important;font-size:16px!important;line-height:1}
#chatBody{padding:10px 16px 14px;font-size:16px;line-height:1.45;cursor:pointer}
#chatCh{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#chatCh:empty{display:none}
.cbtn{text-align:left;font-size:14px;font-weight:500;color:var(--ink);padding:8px 14px;border-radius:999px;background:var(--card2)}
.cbtn:first-child{background:var(--ink);color:#fff}
.cbtn:hover,.cbtn:focus-visible{background:var(--acc);color:var(--ink);outline:none}
#chatMore{font-size:12px;color:var(--mute);text-align:right;min-height:4px}
#chatLog{display:none;max-height:min(46vh,380px);overflow:auto;padding:8px 16px 14px;font-size:14.5px;line-height:1.45;color:var(--ink2)}
#chatLog p{margin:8px 0;background:var(--card2);border-radius:14px 14px 14px 4px;padding:8px 12px}
#chatLog p.me{background:var(--ink);color:#fff;border-radius:14px 14px 4px 14px;margin-left:20%}
#chat.logon #chatLog{display:block}
#chat.logon #chatBody{display:none}

/* ---------- fx ---------- */
.fx-ring{fill:none;stroke:var(--ink);stroke-width:2;animation:ring .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
.fx-ring.g{stroke:var(--mute)}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(2.2);opacity:0}}
.fx-bit{font:700 16px var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--acc);stroke-width:6px;stroke-linejoin:round;animation:floatup 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes floatup{to{transform:translate(var(--dx),-60px);opacity:0}}

/* ---------- checkpoint test ---------- */
#quizBox{max-width:760px;padding-bottom:48px}
.qh{display:inline-flex;font-size:15px;font-weight:600;background:var(--paper);border-radius:999px;padding:8px 16px;box-shadow:var(--shadow)}
/* sticky header: title, answered count, countdown, submit, thin progress */
#qhead{position:sticky;top:-1px;z-index:5;background:var(--bg);padding:12px 0 10px;margin-bottom:14px}
.qhl{display:flex;align-items:center;gap:14px}
.qhl>b:first-child{font-size:22px;font-weight:600;letter-spacing:-.01em;flex:1;min-width:0;line-height:1.15}
#qcnt{font-size:13px;color:var(--mute);white-space:nowrap;font-variant-numeric:tabular-nums}
#qtm{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
#qhead .tbtn{height:38px;padding:0 20px}
.qtwrap{height:5px;background:var(--line);border-radius:3px;margin-top:10px;overflow:hidden}
#qbar{display:block;height:100%;width:100%;background:var(--acc);border-radius:3px;transition:width .25s linear}
#qhead.hot #qbar{background:var(--coral)}
#qhead.hot #qtm{color:var(--coral)}
/* item cards: one scale — question 17/500, options 15, meta 13 */
.qcard{position:relative;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);padding:18px 20px 18px 58px;margin-bottom:14px}
.qnum{position:absolute;left:18px;top:18px;width:28px;height:28px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;font-variant-numeric:tabular-nums}
.qnum.done{background:var(--acc)}
.qq{font-size:17px;font-weight:500;line-height:1.45;margin-bottom:14px}
.qq sub,.qb sub{font-size:.62em}
.qfig{width:min(360px,100%);height:auto;display:block;margin:0 0 14px;overflow:visible;background:var(--card2);border-radius:18px;padding:14px}
.qv{font:600 14px var(--font);fill:var(--ink)}
.qa{display:grid;gap:8px}
.qb{text-align:left;font-size:15px;font-weight:500;padding:12px 16px;border-radius:14px;background:var(--card2);color:var(--ink)}
.qb:hover{background:var(--line)}
.qb.sel{background:var(--acc);box-shadow:inset 0 0 0 2px var(--ink)}
.qb.ok{background:var(--acc);box-shadow:inset 0 0 0 2px var(--ok-ink)}
.qb.bad{background:var(--coral);color:#fff}
/* board-task card */
.qbt{display:flex;align-items:baseline;justify-content:space-between;gap:12px;font-size:13px;color:var(--mute);margin-bottom:10px}
.qbt b{font-size:15px;font-weight:600;color:var(--ink)}
.qf{font-size:17px;margin-bottom:12px}
.qg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0 14px;font-size:12.5px}
.qg span{background:var(--card2);border-radius:999px;padding:4px 10px;font-weight:500}
.qg em{font-style:normal;color:var(--mute);margin-left:auto}
/* results: breakdown + effort */
.qres{font-size:clamp(44px,6vw,72px);font-weight:600;letter-spacing:-.04em;margin:16px 0 4px;line-height:1}
.qres.ok{color:var(--ink)}.qres.bad{color:var(--coral)}
.qscore{font-size:20px;color:var(--ink2);margin-bottom:18px}
.qrep{list-style:none;margin:0 0 16px;padding:0}
.qrep li{display:flex;align-items:flex-start;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
.qrep li>b{min-width:22px;font-weight:600}
.qrep .qrt{flex:1;min-width:0}
.qrep .qmath{display:block;font-weight:500}

/* ---------- workshop ---------- */

.dq{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin-bottom:14px;text-wrap:balance}

.dqa{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}

.dfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px;color:var(--ink2);min-height:40px}

.er{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.er:last-child{border-bottom:0}
.er b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.er.got b{color:var(--ok-ink)}
.wr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wr{background:var(--card2);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}

#ov.on~#mascot #bitTab{opacity:0;transform:scale(.6);pointer-events:none;transition:transform .2s,opacity .15s}

/* ================= v3.5 ================= */
/* task card level with the top buttons; drops below them only when it does not fit */
#taskCard{top:14px}
#taskCard.low{top:72px}
/* points pill centred in its button */
#hud{padding:0 6px 0 16px}
#hud .hp{margin:0}
/* truth table: the output separator is its own row, it never covers the cells */
.tt tr.ttsep th,.tt tr.ttsep td{height:9px;min-width:0;padding:0;border-radius:0;cursor:default;background:linear-gradient(var(--ink),var(--ink)) center/100% 2px no-repeat}
.tt tr.ttsep th{background:linear-gradient(var(--ink),var(--ink)) center/100% 2px no-repeat,var(--paper)}
.tt tr.ttsep td:hover{outline:none}
/* Bit: arms hang down now, poses offset by the new rest angle */
@keyframes wave{50%{transform:rotate(-110deg)}}
@keyframes gesture{50%{transform:rotate(-35deg)}}
.a-solder .arm-r{animation:solderArm 2.4s ease-in-out infinite!important}
.a-solder .p-iron{animation:solder 2.4s ease-in-out infinite!important}
@keyframes solderArm{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(-6deg)}}
.a-read .arm-l,.a-carry .arm-l{transform:rotate(-65deg)}
.a-read .arm-r,.a-carry .arm-r{transform:rotate(65deg)}
.a-scope .arm-r{animation:scopeArm 4s ease-in-out infinite!important}
.a-scope .p-mag{animation:scope 4s ease-in-out infinite!important}
@keyframes scopeArm{0%,100%{transform:rotate(-74deg)}50%{transform:rotate(-48deg)}}
/* dragging the comm link: see-through, legs dangle */
body.bitDragging #chat.on{opacity:.72}
body.bitDragging:not(.bitOn) #bitTab{opacity:.75}
body.bitDragging #bit .legs{transform-origin:40px 72px;transform-box:view-box;animation:dangle .7s ease-in-out infinite}
@keyframes dangle{25%{transform:rotate(7deg)}75%{transform:rotate(-7deg)}}
/* lamp: breathing halo + turn-on flare (SVG transform-box keeps positions intact) */
.lglow{fill:var(--acc);opacity:.42;transform-box:fill-box;transform-origin:center;animation:lampBre 2.6s ease-in-out infinite}
.lring{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:.5;transform-box:fill-box;transform-origin:center;animation:lampRing 2.6s ease-in-out infinite}
.lflare{fill:none;stroke:var(--acc);stroke-width:3;transform-box:fill-box;transform-origin:center;animation:lampFlare .55s ease-out forwards}
@keyframes lampBre{50%{transform:scale(1.16);opacity:.16}}
@keyframes lampRing{50%{transform:scale(1.07);opacity:.22}}
@keyframes lampFlare{from{transform:scale(.5);opacity:.95}to{transform:scale(1.9);opacity:0}}
/* press feedback: board parts and chrome both dip under the pointer */
.gin,.flag,.ogrp{transform-box:fill-box;transform-origin:center;transition:transform .13s ease}
.gate:active .gin,.flag:active,.ogrp:active{transform:scale(.94)}
.tbtn,.ib,.cbtn,.pi{transition:transform .1s}
.tbtn:active,.ib:active,.cbtn:active{transform:scale(.95)}
/* delete button next to the selection */
#selPop{position:fixed;left:0;top:0;z-index:4;height:36px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);display:none;align-items:center;white-space:nowrap;margin-top:-8px}
#selPop.on{display:inline-flex;animation:popIn .18s ease-out}
#selPop::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
#selPop:hover{background:var(--coral)}
@keyframes popIn{from{opacity:0;scale:.9}}
/* loupe while wiring with a finger */
#loupe{position:fixed;left:0;top:0;width:132px;height:132px;border-radius:50%;overflow:hidden;z-index:7;pointer-events:none;opacity:0;
  box-shadow:0 0 0 3px var(--ink),0 16px 32px -10px rgba(26,27,29,.45);transition:opacity .12s}
#loupe.on{opacity:1}
#loupe svg{display:block}
/* knife */
#knifeBtn.on{background:var(--coral);color:#fff}
body.knife #board{cursor:crosshair}
/* dock: hide / show */
#sheet{transition:height .22s cubic-bezier(.3,.9,.4,1)}
body.sheetDrag #sheet{transition:none}
.pnote{font-size:11px;line-height:1.25;color:var(--mute);text-align:center;padding:6px 4px 4px;max-width:72px}
/* hotkeys */
.keys{display:flex;gap:6px;flex-wrap:wrap}
.kc{min-width:44px;height:36px;padding:0 12px;border-radius:10px;background:var(--card2);box-shadow:inset 0 -2px 0 var(--line);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.kc:hover{background:var(--line)}
.kc.wait{background:var(--acc);box-shadow:none;font-weight:500}
.srow.kfoot{justify-content:flex-end}
.kfoot .tbtn{box-shadow:none;background:var(--card2)}
.srow.mhelp{flex-direction:column;align-items:flex-start;gap:8px;padding:16px 20px;font-size:14.5px;font-weight:400;color:var(--ink2);line-height:1.4}
/* level list for phones */
#treeList{display:none}
body.treeMob #tree,body.treeMob #treeTip{display:none}
body.treeMob #treeList{display:block}
.tl-ch{background:var(--paper);border-radius:22px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.tl-h{display:grid;grid-template-columns:40px minmax(0,1fr) 54px 14px;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.tl-h b{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1}
.tl-h em{display:block;font-style:normal;font-size:17px;font-weight:600;letter-spacing:-.01em}
.tl-h small{display:block;font-size:13px;color:var(--mute);font-weight:500;margin-top:2px}
.tl-bar{display:block;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.tl-bar i{display:block;height:100%;background:var(--ink);border-radius:6px}
.tl-h svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tl-ch.open .tl-h svg{transform:rotate(180deg)}
.tl-ch.lock .tl-h{opacity:.55}
.tl-body{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.tl-ch.open .tl-body{display:grid}
.tl-l{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:16px;background:var(--card2);text-align:left;min-height:96px;color:var(--ink)}
.tl-l b{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.tl-l span{font-size:14px;font-weight:500;line-height:1.25;flex:1}
.tl-st{font-style:normal;font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center}
.tl-st u{width:8px;height:8px;border-radius:50%;background:#55585C;display:inline-block}
.tl-st u.on{background:var(--acc)}
.tl-l.av{background:var(--acc)}
.tl-l.done{background:var(--ink);color:#fff}
.tl-l.done .tl-st{color:#A4A6A0}
.tl-l.lock{opacity:.5}
.tl-q{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:var(--card2);font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.tl-q b{font-weight:500;font-size:13px}
.tl-q.av{background:var(--ink);color:#fff}
.tl-q.pass{background:var(--acc)}
.tl-q.lock{opacity:.5}

@media (max-width:760px){
  #taskCard,#taskCard.low{top:56px}

  #palette{flex-direction:row;max-width:calc(100vw - 96px);overflow-x:auto;overflow-y:hidden;bottom:calc(var(--dock,180px) + 16px);max-height:none}
  .pi{width:64px;flex:0 0 auto;padding:8px 0 6px}

  #mascot.mob #chat{position:fixed;left:8px;right:8px;width:auto;bottom:auto;grid-template-columns:84px 1fr;transform-origin:calc(100% - 30px) 100%}

  #chatX{width:44px;height:44px;font-size:22px!important}

  #sheetTog{width:40px;height:40px}

}

/* ================= v3.6 ================= */
/* undo, redo and scissors: one icon group next to Menu */
.tgrp{display:flex;align-items:center;gap:2px;height:40px;padding:0 4px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}

  #palette{scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent)}
  #palette::-webkit-scrollbar{display:none}
  .pi{min-height:0}
}
/* gate card: only the name is interactive (hover cross-fades it to the other language); the card stays below the top bar */
#gtip.on .gt-h{pointer-events:auto}
.gt-n{display:grid}
.gt-n>span{grid-area:1/1;font:inherit;color:inherit;transition:opacity .2s,transform .2s}
.gt-n .alt{opacity:0;transform:translateY(3px)}
.gt-h:hover .gt-n>span:first-child{opacity:0;transform:translateY(-3px)}
.gt-h:hover .gt-n .alt{opacity:1;transform:none}

.odhit{fill:transparent;cursor:grab}
#odTip{position:fixed;z-index:7;pointer-events:none;background:var(--paper);border-radius:999px;box-shadow:var(--shadow);padding:7px 14px;font-size:13px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .12s}
#odTip.on{opacity:1}
#odTip b{font-weight:700}

/* indices sit below the baseline like in a textbook */
sub{vertical-align:baseline;position:relative;top:.34em;line-height:0}
sup{vertical-align:baseline;position:relative;top:-.5em;line-height:0}

/* ========== bench: manual ticks, tick log, sandbox analysis ========== */
#bench{position:fixed;left:50%;bottom:calc(var(--dock,180px) + 10px);transform:translateX(-50%) translateY(12px);z-index:5;width:min(680px,calc(100vw - 24px));background:var(--paper);border-radius:var(--r,18px);box-shadow:var(--shadow);padding:10px 14px 12px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s}
#bench.on{opacity:1;pointer-events:auto;transform:translateX(-50%)}
#bHead{display:flex;align-items:baseline;gap:10px;padding:2px 0 8px}
#bTitle{font-size:15px}
#bNote{flex:1;color:var(--mute);font-size:12px}
#bX{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute);align-self:center}
#bX:hover{background:var(--card2);color:var(--ink)}
#bX svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round}
#bBody{max-height:min(38vh,330px);overflow:auto}
#bFoot{display:flex;gap:8px;justify-content:center;padding-top:10px}
.bempty{color:var(--mute);text-align:center;padding:18px 0;font-size:14px}
table.bj{border-collapse:separate;border-spacing:3px 2px;font-size:14px;margin:0 auto}
.bj th{font-weight:400;color:var(--ink);padding:0 8px;text-align:center;font-size:14px}
.bj th.o{border-left:2px solid var(--line)}
.bj td{min-width:26px;height:26px;padding:0 4px;text-align:center;border-radius:7px;background:var(--card2);font-weight:500;color:var(--ink2)}
.bj td.o{border-radius:7px}
.bj td.one{background:var(--acc);color:var(--paper)}
.bj td#x{min-width:0}
.bj tr td:first-child{background:none;color:var(--mute);font-size:11px;min-width:14px}
.bj td.st{font-family:inherit;letter-spacing:2px}
.bforms{padding:4px 2px 10px;display:flex;flex-direction:column;gap:4px;align-items:center}
.bforms .bf{font-size:19px;line-height:1.35}
#benchBtn.on{background:var(--acc);color:var(--paper)}
text.ffq{font-size:12px;font-weight:700;fill:var(--mute)}
text.ffq.on{fill:var(--acc)}
@media (max-width:760px){
  #bench{bottom:calc(var(--dock,180px) + 64px);width:calc(100vw - 16px);padding:8px 8px 10px}
  table.bj{font-size:12px}.bj td{min-width:20px;height:22px}
}

/* hint tiers */
.ht{margin:6px 0}
.ht b{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
.htb{margin-top:3px;font-size:13px;line-height:1.45}
.ht+.ht{border-top:1px solid var(--line);padding-top:6px}

/* wardrobe lock */
.wr.locked .wr-bit{opacity:.35;filter:grayscale(.6)}
.wr-lock{font-size:11px;color:var(--dim);text-align:center;line-height:1.3}

/* circuit library */
.lib-save{display:flex;gap:8px;align-items:center;margin-bottom:14px;padding:10px 12px}
.lib-save input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;font:inherit;background:var(--bg);color:var(--ink)}
.lib-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.lib-card{background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:6px}
.lt{width:100%;height:86px;background:var(--bg);border-radius:9px}
.lib-nm{font-size:14px}
.lib-io{font-size:11px;color:var(--dim)}
.lib-acts{display:flex;gap:6px;flex-wrap:wrap}
.lib-acts .tbtn{font-size:12px;padding:5px 9px}
.lib-empty{color:var(--dim);max-width:420px;line-height:1.5}
.tbtn.danger{color:var(--coral)}

/* historical note */
#hist{display:none;margin-top:8px}
#hist.on{display:block}
.histin{border-left:2px solid var(--acc);padding:6px 10px;background:var(--card2);border-radius:0 9px 9px 0;font-size:12.5px;line-height:1.45;color:var(--ink2)}
.histin b{display:block;font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--dim);margin-bottom:2px}

/* quiz: countdown chip that rides in the top bar while a board task is open */
#qchip{position:relative;overflow:hidden;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums;padding:0 14px}
#qchip i{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width .25s linear}
#qchip.hot{color:var(--coral)}
#qchip.hot i{background:var(--coral)}
/* quiz: generated tables */
table.qt{border-collapse:collapse;margin:8px 0 12px}
table.qt th,table.qt td{border:1.5px solid var(--line);padding:5px 14px;text-align:center;font-size:14px}
table.qt th{background:var(--card2);font-weight:600}

/* ========== library wiki overlay ========== */
#wikiOv{position:fixed;inset:0;z-index:7;display:none}
#wikiOv.on{display:block}
.wkBack{position:absolute;inset:0;background:rgba(216,215,208,.55);-webkit-backdrop-filter:blur(5px);backdrop-filter:blur(5px);animation:wkFade .18s ease both}
.wkPanel{position:absolute;inset:4.5vh 4vw;background:var(--bg);border-radius:var(--r);box-shadow:var(--shadow),0 24px 70px rgba(30,32,35,.25);display:flex;flex-direction:column;overflow:hidden;animation:wkUp .22s cubic-bezier(.2,.9,.3,1) both}
@keyframes wkFade{from{opacity:0}}
@keyframes wkUp{from{opacity:0;transform:translateY(16px) scale(.985)}}
.wkHead{display:flex;align-items:center;gap:14px;padding:12px 16px;border-bottom:1.5px solid var(--line);flex:none}
.wkTabs{display:flex;gap:4px}
.wkt{border:none;background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--mute);padding:8px 16px;border-radius:999px;cursor:pointer}
.wkt:hover{color:var(--ink)}
.wkt.on{background:var(--ink);color:var(--bg)}
#wkX{margin-left:auto}
.wkBody{flex:1;min-height:0;display:flex}
#wkArtV{flex:1;min-height:0;display:flex}
.wkSide{width:250px;flex:none;border-right:1.5px solid var(--line);display:flex;flex-direction:column;min-height:0}
#wkQ{margin:12px 12px 6px;border:1.5px solid var(--line);border-radius:10px;padding:8px 11px;font:inherit;font-size:14px;background:var(--paper);color:var(--ink)}
#wkList{flex:1;overflow:auto;padding:4px 8px 16px;scrollbar-width:thin}
.wcat{padding:10px 4px 2px}
.wcat>b{display:block;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);padding:4px 6px}
.wnav{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:8px;font-size:14px;color:var(--ink);cursor:pointer;line-height:1.25}
.wnav:hover{background:var(--card2)}
.wnav.on{background:var(--card2);font-weight:600}
.wnav.off{color:var(--dim)}
.wnav .wd{margin-left:auto;width:7px;height:7px;border-radius:50%;background:var(--acc);flex:none}
.wkDocWrap{flex:1;min-width:0;overflow:auto;padding:22px 30px 48px}
#wkDoc{max-width:65ch;margin:0 auto}
.wkArrows{display:flex;align-items:center;gap:6px;margin-bottom:8px}
.wkCat{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--dim)}
#wkDoc .wt{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin:0 0 6px}
#wkDoc .wlead{font-size:17px;font-weight:500;line-height:1.45;color:var(--ink2);margin:0 0 14px}
#wkDoc h3{font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.6px;color:var(--dim);margin:20px 0 6px}
#wkDoc p{font-size:15px;line-height:1.55;margin:0 0 10px}
#wkDoc .wcond{font-size:15px;color:var(--mute)}
.wgate{display:flex;align-items:center;gap:14px;background:var(--paper);border:1.5px solid var(--line);border-radius:14px;padding:10px 14px;margin:4px 0 12px}
.wgate svg{width:56px;flex:none}
.wgn b{display:block;font-size:15px}
.wgn span{font-size:13px;color:var(--mute)}
.wf{font-size:19px;background:var(--paper);border:1.5px solid var(--line);border-radius:12px;padding:10px 16px;margin:2px 0 12px;white-space:nowrap;overflow-x:auto}
.wtt{margin:0 0 14px;overflow-x:auto}
.wsee{display:flex;flex-wrap:wrap;gap:8px}
.wlk{color:var(--acc);text-decoration:none;border-bottom:1.5px solid transparent;cursor:pointer;font-weight:500}
.wlk:hover{border-bottom-color:var(--acc)}
.wlk-off{color:var(--dim);border-bottom-style:dashed;border-bottom-color:var(--dim)}
.wlvs{display:flex;flex-wrap:wrap;gap:8px}
.wlv{border:1.5px solid var(--line);background:var(--paper);border-radius:999px;font:inherit;font-size:13.5px;padding:7px 14px;cursor:pointer;color:var(--ink)}
.wlv:hover:not(:disabled){border-color:var(--ink)}
.wlv:disabled{opacity:.45;cursor:default}
#wkMyV{flex:1;min-height:0;overflow:auto;padding:20px 30px 40px}
#btnLib{position:relative}
.wdot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;border-radius:999px;background:var(--coral);color:#fff;font-size:10.5px;font-weight:700;line-height:16px;text-align:center;padding:0 4px;font-style:normal;pointer-events:none}
@media (max-width:760px){
  .wkPanel{inset:0;border-radius:0}
  .wkSide{width:190px}
  .wkDocWrap{padding:16px 14px 40px}
  #wkDoc .wt{font-size:22px}
}
@media (max-width:560px){
  #wkArtV{flex-direction:column}
  .wkSide{width:auto;border-right:none;border-bottom:1.5px solid var(--line);max-height:42%}
  #wkList{padding-bottom:8px}
}
</style>

/* ========== formula typesetting ==========
   Variables: italic serif (STIX Two). Operators: upright, with air around them; ⊕ ∨ ⊙ → ← drawn as vector glyphs
   so they match the stroke of the letters on every system. Conjunction is shown as &, as in Russian textbooks. */
const OPSVG={'⊕':'<circle cx="8" cy="8" r="6"/><path d="M8 3.4V12.6M3.4 8H12.6"/>','⊙':'<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/>',
  '∨':'<path d="M3.2 3.6L8 12.8L12.8 3.6"/>','→':'<path d="M2 8H14M10 4.2L14 8L10 11.8"/>','←':'<path d="M14 8H2M6 4.2L2 8L6 11.8"/>'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mo(c){return `<span class="mo">${OPSVG[c]?`<svg class="mos" viewBox="0 0 16 16">${OPSVG[c]}</svg>`:c}</span>`}
function mathHTML(h){
  const s=String(h).replace(/∧/g,'&amp;').split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(
    /&amp;|&gt;|&lt;|[⊕⊙∨→←=+−]| [?:] |(?<![A-Za-z])(?:Co|Bo|[A-Z]{1,2}|n|k)(?![A-Za-z])/g,
    m=>m==='&amp;'?mo('&amp;'):m==='&gt;'||m==='&lt;'?mo(m):/^ [?:] $/.test(m)?' '+mo(m.trim())+' ':(OPSVG[m]||'=+−'.includes(m))?mo(m):/^[A-Z]{2}$/.test(m)?m.split('').map(c=>`<i class="mv">${c}</i>`).join(''):`<i class="mv">${m}</i>`)).join('');
  // formulas must not wrap mid-expression: glue a text-node space when both neighbours are
  // math-ish units (variable/operator/overline tags, digits, math punctuation). Tag internals
  // are never touched, so attributes stay intact.
  const mtag=p=>p[0]==='<'&&(/class="(?:mo|mv|ov)"|<sub|<sup/.test(p)||/^<\/(?:i|span|sub|sup)>/.test(p));
  const mword=w=>/^[A-Z]{2}$/.test(w)||/^(?:[0-9₂]+|Co|Bo)[0-9₂.,:;)\]]*$|^[−+.,:;()\[\]¬=]+$/.test(w);
  const u=[];
  s.split(/(<[^>]+>)/).forEach(p=>{
    if(p[0]==='<'){u.push({x:p,m:mtag(p)});return}
    p.split(' ').forEach((w,i)=>{if(i)u.push({x:' ',sp:1});if(w)u.push({x:w,m:mword(w)})});
  });
  return u.reduce((out,a,i)=>out+(a.sp&&i&&u[i-1].m&&u[i+1]&&u[i+1].m?'\u00A0':a.x),'');
}

  hint:['Тяните от точки на флажке к нужной лампе. Провода могут пересекаться — это нормально.','Drag from the dot on a flag to the right lamp. Wires may cross — that is fine.']});
lv({ch:1,pos:[1,0],req:[1],par:2,outs:['X','Y'],t:['Инверсия','Inversion'],f:'X = '+ov('A')+SEP+'Y = '+ov('B'),ins:['A','B'],gates:['NOT'],vec:comb(['A','B'],i=>({X:1-i.A,Y:1-i.B})),

  hint:['Элемент НЕ переворачивает сигнал: 0 → 1, 1 → 0. Одного типа элемента может быть несколько на схеме.','A NOT gate flips the signal: 0 → 1, 1 → 0. A circuit can hold several gates of the same type.']});
lv({ch:1,pos:[2,0],req:[2],par:2,t:['Запрет','Inhibit'],f:'Y = A ∧ '+ov('B'),ins:['A','B'],gates:['AND','NOT'],vec:comb(['A','B'],i=>({Y:i.A&(1-i.B)})),
  task:['Сигнал A должен проходить к лампе, но только когда блокировка B отпущена. Горячий вход B запрещает всё.','Signal A must reach the lamp, but only while the inhibit line B is released. A hot B forbids everything.'],
  hint:['Элемент И даёт 1, только если на всех входах 1. Один из входов придётся перевернуть.','AND outputs 1 only when every input is 1. One of the inputs will have to be flipped.']});
lv({ch:1,pos:[2,1],req:[2],par:2,t:['Импликация','Implication'],f:'Y = '+ov('A')+' ∨ B',ins:['A','B'],gates:['OR','NOT'],vec:comb(['A','B'],i=>({Y:(1-i.A)|i.B})),

  hint:['Элемент ИЛИ даёт 1, если хоть на одном входе 1. Здесь один вход поступает напрямую, а второй — через инвертор.','OR outputs 1 if any input is 1. Here one input goes straight, the other through an inverter.']});
lv({ch:1,pos:[3,0],req:[3],par:2,t:['Штрих Шеффера','Sheffer stroke'],f:'Y = '+ov('A ∧ B'),ins:['A','B'],gates:['AND','NOT'],vec:comb(['A','B'],i=>({Y:1-(i.A&i.B)})),

LV[0].h1=['Проводов три, и каждый идёт не к своей лампе. Начните с любого флажка и найдите его лампу по таблице.','There are three wires, each going to the wrong lamp. Start with any flag and find its lamp in the table.'];

LV[3].h1=['Лампа гаснет только в одной строке таблицы. Посмотрите, какой вход в этой строке единственный горит.','The lamp is dark in exactly one row. Look at which input is the only lit one in that row.'];

/* historical notes, shown after the level is solved (item 19) */
LV[0].hist=['В первых компьютерах — Z3 (1941) и ENIAC (1945) — программу задавали буквально проводами: переставил шнур на панели — получил другую машину.','In the first computers — the Z3 (1941) and ENIAC (1945) — programs were literally wired: move a cable on the panel and you get a different machine.'];
LV[1].hist=['Инвертор — самый простой вентиль: на одном транзисторе. Релейные инверторы работали в машине Конрада Цузе Z3 ещё в 1941 году.','The inverter is the simplest gate: a single transistor. Relay inverters were already clicking inside Konrad Zuse’s Z3 in 1941.'];
LV[2].hist=['Связку «A и не B» называют запретом (inhibit): в микросхемах она встречается так часто, что выпускали готовые элементы с инверсией одного входа.','The “A and not B” pattern is called inhibit: it is so common in hardware that chips with one pre-inverted input were sold as standard parts.'];
LV[3].hist=['«Если A, то B» в схемах — это ¬A ∨ B. Материальную импликацию формализовали ещё в «Principia Mathematica» Уайтхеда и Рассела (1910).','“If A then B” in circuits is ¬A ∨ B. Material implication was formalized back in Whitehead and Russell’s Principia Mathematica (1910).'];
LV[4].hist=['Генри Шеффер в 1913 году показал, что всю булеву алгебру можно построить на одной-единственной операции. Флеш-память типа NAND в ваших флешках названа именно в честь этого элемента.','In 1913 Henry Sheffer showed that all of Boolean algebra can be built on a single operation. The NAND flash in your USB sticks is named after this very gate.'];
LV[5].hist=['Чарльз Пирс нашёл эту операцию ещё в 1880 году, но не опубликовал — она заново открылась только после Шеффера. ИЛИ-НЕ так же универсально, как И-НЕ.','Charles Peirce found this operation back in 1880 but never published it; it was rediscovered after Sheffer. NOR is every bit as universal as NAND.'];
LV[6].hist=['Исключающее ИЛИ — сердце сложения и шифрования: одноразовый блокнот Вернама (1917), самый стойкий шифр в истории, это просто XOR сообщения с ключом.','XOR is the heart of addition and of encryption: Vernam’s one-time pad (1917), the strongest cipher in history, is just the message XORed with a key.'];
LV[7].hist=['Проверка равенства — первый шаг любого сравнения чисел в процессоре: совпадение битов поразрядно, а затем общее «и».','Equality checking is the first step of every number comparison in a CPU: bitwise match, then one big “and”.'];
LV[8].hist=['Соединив входы И-НЕ, получают НЕ — первый трюк универсального базиса. На нём строят целые компьютеры из одного типа вентилей.','Tie the inputs of a NAND and you get a NOT — the first trick of the universal basis. Whole computers are built from this one gate type.'];
LV[9].hist=['И-НЕ с инвертором на выходе снова становится И. В серии 7400 такой двойной элемент встречается постоянно.','NAND followed by an inverter is AND again. This pairing is everywhere in the 7400 series chips.'];
LV[10].hist=['Замена И на ИЛИ в базисе И-НЕ — это закон де Моргана: инвертируй входы, инвертируй операцию. Августус де Морган сформулировал его в 1847 году, друг и оппонент Буля.','Building OR from NAND is De Morgan’s law: invert the inputs, invert the operation. Augustus De Morgan, Boole’s friend and rival, stated it in 1847.'];
LV[11].hist=['Четыре И-НЕ для исключающего ИЛИ — классическая схема из учебников; именно так XOR делали до появления готовых элементов.','Four NANDs for an XOR is the textbook classic — this is exactly how XOR was built before dedicated gates existed.'];
LV[12].hist=['Конъюнкция ассоциативна: A ∧ B ∧ C можно собирать в любом порядке. На этом стоит вся каскадная логика многоразрядных схем.','Conjunction is associative: A ∧ B ∧ C can be chained in any order. All cascaded multi-bit logic relies on it.'];
LV[13].hist=['Голосование большинством — основа отказоустойчивости: три компьютера считают одно и то же, и двое «перевешивают» сбойного. Джон фон Нейман описал это в 1956-м, а сейчас так летают ракеты.','Majority voting is the basis of fault tolerance: three computers compute the same thing and two outvote the faulty one. John von Neumann described it in 1956 — rockets fly like this today.'];
LV[14].hist=['Бит чётности добавляли к памяти и каналам связи с 1950-х: один лишний бит ловит одиночную ошибку. И сейчас ECC-память работает на этой идее.','A parity bit has guarded memory and transmission lines since the 1950s: one extra bit catches a single error. ECC memory still runs on this idea.'];
LV[15].hist=['Клод Шеннон в дипломе 1937 года показал, что реле считают булеву алгебру — и сложение начинается с полусумматора.','In his 1937 master’s thesis Claude Shannon showed relays compute Boolean algebra — and addition begins with the half adder.'];
LV[16].hist=['Полный сумматор с переносом — кирпич арифметики. Цепочка таких по разрядам называется сумматором со сквозным переносом (ripple-carry).','The full adder with carry is the brick of arithmetic. A chain of them across digits is called a ripple-carry adder.'];
LV[17].hist=['Мультиплексор выбирает один из каналов адресом — по сути это реализация разложения Шеннона, того самого, из диплома 1937 года.','A multiplexer selects one channel by address — it is Shannon’s expansion in hardware, from the same 1937 thesis.'];
LV[18].hist=['Демультиплексор — зеркальный брат мультиплексора: один вход раздаётся по адресу. Пара таких — уже коммутатор.','A demultiplexer is the multiplexer’s mirror twin: one input routed by address. A pair of them makes a switch.'];
LV[19].hist=['Дешифратор превращает номер в один активный выход — так устроена адресация любой памяти: адресная шина в дешифратор, строки на выход.','A decoder turns a number into a single active output — this is how all memory is addressed: the address bus into a decoder, rows on its outputs.'];
LV[20].hist=['Двухбитный сумматор — двойной полный сумматор: перенос младшего разряда питает старший. Восьмиразрядные машины 1970-х складывали именно так.','A 2-bit adder is two full adders: the lower digit’s carry feeds the upper one. The 8-bit machines of the 1970s added exactly like this.'];
LV[21].hist=['Компаратор сравнивает поразрядно, начиная со старшего бита — как сравнение чисел в столбик в школе.','A comparator compares bitwise starting from the most significant bit — like comparing long numbers in school.'];
LV[22].hist=['Первый триггер построили Экклс и Джордан в 1918 году на лампах — для счётчиков радиоактивных частиц. Это была первая электронная ячейка памяти.','Eccles and Jordan built the first flip-flop in 1918 from vacuum tubes — for counting radioactive particles. It was the first electronic memory cell.'];
LV[23].hist=['D-триггер запоминает бит по фронту такта. Тысячи таких под общим тактом — это регистры процессора.','A D flip-flop captures a bit on the clock edge. Thousands of them sharing a clock are the CPU’s registers.'];
LV[24].hist=['Триггер со встречным включением делит частоту пополам — так часы делят высокую частоту кварца до одного герца.','A toggling flip-flop halves the frequency — this is how clocks divide a quartz crystal down to one hertz.'];
LV[25].hist=['Цепочка делителей — это двоичный счётчик: каждый триггер — один разряд. Видно, как числа растут сами.','A chain of dividers is a binary counter: each flip-flop one digit. You can watch the numbers grow by themselves.'];
LV[26].hist=['Сдвиговый регистр двигает биты по одному в такт. Раньше на них делали последовательную память; сейчас — преобразователи «последовательный-параллельный» в каждом интерфейсе.','A shift register moves bits one step per clock. They used to be serial memory; now they are the serial-parallel converters inside every interface.'];
LV[27].hist=['Фронт сигнала короче самого сигнала — выделять его умеют все тактовые входы. Так короткие команды получают из длинных нажатий.','An edge is shorter than the signal itself — clock inputs know how to catch it. Short commands are made of long presses this way.'];
LV[28].hist=['Вычитание — это сложение с заёмом вместо переноса. Двоичный вычитатель симметричен сумматору.','Subtraction is addition with borrow instead of carry. The binary subtractor mirrors the adder.'];
LV[29].hist=['Полный вычитатель учитывает заём из прошлого разряда. На практике вычитают редко — чаще складывают с дополнительным кодом.','The full subtractor honors the borrow from the lower digit. In practice subtraction is rare — addition in two’s complement is preferred.'];
LV[30].hist=['Сравнение многоразрядных чисел на равенство — это XNOR каждой пары битов и общее И. В процессоре так рождается флаг нуля.','Multi-bit equality is XNOR per bit pair and one big AND. In a CPU this is how the zero flag is born.'];
LV[31].hist=['Мультиплексор 4:1 выбирает один канал двухбитным адресом. Внутри почти любого процессорного узла стоят десятки таких выборов.','A 4:1 mux selects a channel with a two-bit address. Nearly every CPU block hides dozens of such selectors.'];
LV[32].hist=['Приоритетный шифратор выбирает самый важный активный вход — так работают контроллеры прерываний: устройство постарше обслуживается первым.','A priority encoder picks the most important active input — this is how interrupt controllers work: the most senior device is served first.'];
LV[33].hist=['T-триггер щёлкает между двумя состояниями. Каскад из T-триггеров — это уже счётчик.','A T flip-flop clicks between two states. A cascade of T flip-flops is already a counter.'];
LV[34].hist=['JK-триггер — универсальный триггер: J ставит, K сбрасывает, оба вместе переключают. Назван, вероятно, в честь Джека Килби, изобретателя микросхемы.','The JK flip-flop is universal: J sets, K resets, both together toggle. It is probably named after Jack Kilby, inventor of the integrated circuit.'];
LV[35].hist=['Счётчик по модулю N сбрасывается сам — первый настоящий автомат: устройство, помнящее, где оно в последовательности.','A mod-N counter resets itself — a true state machine: a device that remembers where it is in the sequence.'];
LV[36].hist=['«Бегущие огни» — конечный автомат из трёх состояний. Такие же автоматы управляют поворотниками автомобилей и гирляндами.','Running lights are a three-state machine. The same kind of machines run car indicators and holiday lights.'];
LV[37].hist=['Счёт в обратную сторону — зеркало прямого: инверсия переноса меняет направление.','Counting down mirrors counting up: inverting the carry reverses the direction.'];
LV[38].hist=['Регистр с входом загрузки умеет и помнить, и обновляться — основа памяти процессора. Один бит, но уже с поведением.','A register with a load input can both remember and update — the basis of CPU memory. One bit, but already with behavior.'];
LV[39].hist=['Двухбитный регистр — два бита под общей загрузкой и тактом. Процессорные регистры — те же, только по 32 и 64 бита.','A 2-bit register is two bits sharing load and clock. CPU registers are the same, just 32 or 64 bits wide.'];
LV[40].hist=['Сброс асинхронен: не ждёт такта. Любой реальный счётчик умеет начинаться с нуля — иначе что он насчитает.','Reset is asynchronous: it does not wait for the clock. Every real counter can start from zero — otherwise who knows what it has counted.'];
LV[41].hist=['Разрешение счёта пропускает такты. Со стороны это выглядит как остановка времени для счётчика.','Count enable skips clocks. From the outside it looks like time stops for the counter.'];
LV[42].hist=['Три разряда счётчика — уже восемь состояний. Число состояний растёт как степень двойки — это экспоненциальная сила памяти.','Three counter digits make eight states. State count grows as a power of two — memory is exponential.'];
LV[43].hist=['XOR с управляющим входом — вентиль, который по команде инвертирует сигнал или пропускает его. Главный трюк в устройстве АЛУ.','XOR with a control input is a gate that inverts or passes the signal on command. The key trick inside the ALU.'];
LV[44].hist=['В 1970 году вышла микросхема 74181 — первое АЛУ на одном кристалле: 32 функции над 4-битными словами. Вы собираете её предка.','In 1970 the 74181 chip appeared — the first ALU on one die: 32 functions on 4-bit words. You are building its ancestor.'];
LV[45].hist=['Складывая с дополнительным кодом, получаем вычитание бесплатно. Фон Нейман описал это в отчёте по EDVAC в 1945 году.','Adding in two’s complement gives subtraction for free. Von Neumann wrote this up in the 1945 EDVAC report.'];
LV[46].hist=['Инкремент — самая частая операция процессора: каждый шаг программы увеличивает счётчик команд на единицу.','Increment is the CPU’s most frequent operation: every program step bumps the program counter by one.'];
LV[47].hist=['Флаг нуля — один бит, говорящий «результат был нулевым». По нему работают все условные переходы в машинном коде.','The zero flag is one bit saying “the result was zero”. Every conditional jump in machine code depends on it.'];
LV[48].hist=['Сравнение «больше» начинается со старшего разряда: первое же различие решает всё.','“Greater than” starts at the most significant digit: the first difference decides everything.'];
LV[49].hist=['XOR на одних ИЛИ-НЕ — упражнение в универсальности: пять вентилей, ни одного лишнего.','XOR from nothing but NOR gates is an exercise in universality: five gates, none wasted.'];
LV[50].hist=['Мультиплексор на И-НЕ — классика экзаменов по цифровой схемотехнике.','A NAND-only multiplexer is a digital design exam classic.'];
LV[51].hist=['Голосование из И-НЕ ещё раз показывает: любую схему можно переписать в универсальном базисе.','NAND majority proves again: any circuit can be rewritten in a universal basis.'];
LV[52].hist=['Полусумматор на ИЛИ-НЕ сложнее, чем на И-НЕ, — но и это возможно. Базисы И-НЕ и ИЛИ-НЕ равноправны.','A NOR half adder is trickier than a NAND one — but still possible. The NAND and NOR bases are equals.'];
LV[53].hist=['Равенство тремя элементами — пример того, как оптимизируют схемы: правильная алгебра короче прямого пути.','Equality in three gates shows circuit optimization: the right algebra beats the direct route.'];
LV[54].hist=['Чётность четырёх битов — двоичное дерево XOR: попарно, потом результат. Так же считают контрольные суммы.','The parity of four bits is a binary tree of XORs: pairwise, then the result. Checksums are computed the same way.'];
LV[55].hist=['Семь сегментов рисуют цифры с начала XX века: патент 1903 года, а массово — с первых калькуляторов 1970-х.','Seven segments have drawn digits since the early 1900s: patented in 1903, mass-produced in the first calculators of the 1970s.'];
LV[56].hist=['Светофор — конечный автомат, знакомый каждому: состояния и переходы по таймеру. Первые электрические светофоры появились в 1910-х.','A traffic light is a state machine everyone knows: states and timer transitions. The first electric ones appeared in the 1910s.'];
LV[57].hist=['Кодовый замок распознаёт последовательность — автомат с памятью о прогрессе ввода. Неверная цифра возвращает в начало.','A combination lock recognizes a sequence — a machine remembering input progress. A wrong digit returns to the start.'];
LV[58].hist=['Реверсивный счётчик меняет направление по сигналу — так считают энкодеры в мышках и станках.','An up/down counter reverses on a signal — this is how encoders count in mice and machine tools.'];
LV[59].hist=['Счётчик команд — сердце архитектуры фон Неймана: он хранит адрес следующей инструкции и умеет загружать новый при переходах. На этом всё.','The program counter is the heart of the von Neumann architecture: it holds the next instruction’s address and accepts a new one on jumps. That is all of it.'];
