<style>/* Logic Lab — "lab console".
   Stone canvas with a faint grid, floating rounded cards, pill controls, graphite for structure and emphasis,
   one lime accent for logic 1 and anything switched on, coral only for faults. Big numerals with small units.
   Typeface: Onest (Cyrillic-first neo-grotesque). */
:root{
  --bg:#E6E6E1;        /* stone canvas */
  --grid:#D7D7D0; --grid2:#CBCBC3;
  --paper:#FAFAF7;     /* cards */
  --card2:#F1F1EC;     /* inset areas */
  --ink:#1A1B1D;       /* graphite */
  --ink2:#4B4D50;
  --mute:#8B8D87;
  --line:#D2D2CB;
  --acc:#DCEB3A;       /* lime: logic 1, lamps, on */
  --acc-soft:#EEF5A6;
  --acc-ink:#1A1B1D;   /* text on lime is graphite */
  --w0:#BDBEB6; --w1:#1A1B1D;
  --ok:#ECF3C2; --ok-ink:#3E4A00;
  --bad:#F7D8D0; --bad-ink:#C2412A; --coral:#E8553D;
  --r:22px; --r-s:14px;
  --shadow:0 1px 0 rgba(26,27,29,.04),0 12px 32px -16px rgba(26,27,29,.28);
  --ui:1; --ww:4;
  --font:"Onest","Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#board{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
#board.panning{cursor:grabbing}
#frame{display:none}
.zz{zoom:var(--ui)}

/* ---------- top bar: floating pills ---------- */
#top{position:fixed;left:16px;right:16px;top:14px;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
.tb{display:flex;gap:6px;align-items:center}
.tb.r{justify-content:flex-end}
.tbtn{height:40px;padding:0 16px;font-size:15px;font-weight:500;color:var(--ink);background:var(--paper);border-radius:999px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn:hover{background:#fff}
.tbtn:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.tbtn.primary{color:#fff;background:var(--ink);padding:0 22px}
.tbtn.primary:hover{background:#000}
#formula{height:44px;display:flex;align-items:center;padding:0 22px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-size:21px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;pointer-events:none}
#formula:empty{display:none}
.ov{text-decoration:overline;text-decoration-thickness:1.5px;text-underline-offset:0}
#formula sub,#sheet sub,#chatText sub{font-size:.62em}
.sep{display:inline-block;width:1.3em}
.op{font-size:.82em;vertical-align:.04em;margin:0 .04em}
.lim{font-size:13px;font-weight:600;margin-left:12px;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px}
#hud{gap:10px}
#hud .hr{color:var(--ink2);font-weight:500}
#hud .hp{font-variant-numeric:tabular-nums;font-weight:600;background:var(--acc);border-radius:999px;padding:3px 10px;margin-right:-8px}

/* ---------- element toolbar ---------- */
#palette{position:fixed;left:16px;top:76px;display:flex;flex-direction:column;gap:2px;background:var(--paper);border-radius:var(--r);padding:6px;box-shadow:var(--shadow);z-index:3;max-height:calc(100vh - 100px);overflow:auto}
#palette:empty{display:none}
.pi{display:flex;flex-direction:column;align-items:center;width:72px;padding:9px 0 7px;cursor:grab;color:var(--ink2);touch-action:none;border-radius:16px}
.pi:hover{background:var(--card2);color:var(--ink)}
.pi:active{background:var(--acc)}
.pi svg{width:48px;height:30px;overflow:visible}
.pi span{font-size:11.5px;margin-top:4px;font-weight:500;text-align:center;line-height:1.15}
.pcount{margin-top:4px;font-size:13px;text-align:center;font-weight:600;padding:6px 0;border-radius:12px;background:var(--card2);font-variant-numeric:tabular-nums}
.pcount.full{background:var(--coral);color:#fff}

/* ---------- zoom ---------- */
#zoom{position:fixed;right:16px;z-index:4;display:flex;gap:4px;transition:bottom .15s}
#zoom{gap:0;padding:3px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
#zoom .tbtn{height:34px;padding:0 14px;font-size:14px;box-shadow:none;background:transparent}
#zoom .tbtn:hover{background:var(--card2)}
#zoom #zOut,#zoom #zIn{width:34px;padding:0;justify-content:center}

/* ---------- bottom dock ---------- */
#sheet{position:fixed;left:16px;right:16px;bottom:14px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:3;overflow:hidden}
#grip{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;cursor:ns-resize;touch-action:none;position:relative}
#grip::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:var(--line)}
#lvNum{font-size:30px;font-weight:600;letter-spacing:-.01em;font-variant-numeric:tabular-nums;line-height:1}
#lvHead{display:inline-flex;align-items:baseline;gap:12px;min-width:0}
#lvTitle{font-size:19px;font-weight:600;letter-spacing:-.01em;line-height:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#lvStars{font-size:15px;letter-spacing:2px}
.st{color:var(--line)}.st.on{color:var(--ink)}
#saved{font-size:12px;color:var(--mute);opacity:0;transition:opacity .3s;display:inline-flex;align-items:center;gap:6px}
#saved::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--ink)}
#saved.on{opacity:1}
#hintBtn{margin-left:auto;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;background:var(--card2)}
#hintBtn:hover{background:var(--acc)}
#sheetBody{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:10px;padding:0 10px 10px;align-items:stretch}
#task{padding:6px 8px 8px;font-size:16px;line-height:1.45;color:var(--ink2);min-width:0}
#hint{margin-top:10px;font-size:15px;color:var(--ink);background:var(--acc-soft);border-radius:var(--r-s);padding:10px 14px;display:none}
#hint.on{display:block}
#ttWrap{overflow:auto;background:var(--card2);border-radius:18px;padding:6px 10px 10px}
#ttWrap:empty{display:none}
table.tt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:15px}
.tt th{font-weight:500;color:var(--mute);padding:6px 12px;text-align:center;font-size:13px}
.tt td{padding:4px 12px;text-align:center;cursor:pointer;font-weight:500}
.tt tr td:first-child{border-radius:10px 0 0 10px}.tt tr td:last-child{border-radius:0 10px 10px 0}
.tt th.gap,.tt td.gap{box-shadow:inset 1px 0 0 var(--line)}
.tt th.n,.tt td.n{color:var(--mute);font-size:12px;padding:4px 8px}
.tt tr.live td{background:var(--paper)}
.tt tr.cur td{background:var(--ink);color:#fff}
.tt tr.ok td{background:var(--ok);color:var(--ok-ink)}
.tt tr.bad td{background:var(--bad);color:var(--bad-ink)}
.tt .act{display:inline-block;font-size:11px;line-height:16px;min-width:16px;margin-right:5px;background:var(--coral);color:#fff;border-radius:8px;font-weight:600;vertical-align:1px}
#stampTbl{display:flex;flex-direction:column;gap:8px;min-width:150px}
.met{background:var(--card2);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;flex:1}
.met b{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.met b small{font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;margin-left:3px}
.met span{font-size:12px;color:var(--mute);margin-top:4px}
.met.over{background:var(--bad)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:8}
#toast.on{opacity:1}

/* ---------- result card ---------- */
#result{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(230,230,225,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#result.on{display:flex}
#resCard{background:var(--ink);color:#fff;border-radius:30px;padding:28px 28px 22px;width:min(440px,92vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:translateY(16px) scale(.96);opacity:0}}
#resTitle{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.02em}
#resTitle::before{content:"✓";flex:0 0 52px;height:52px;border-radius:50%;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
#resTitle.bad::before{content:"!";background:var(--coral);color:#fff}
#resTitle small{display:block;font-size:13px;font-weight:400;color:#A4A6A0;letter-spacing:0;margin-top:2px}
#resSub{margin-top:20px}
#resBtns{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
#resBtns .tbtn{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #4A4C50}
#resBtns .tbtn:hover{box-shadow:inset 0 0 0 1.5px #fff}
#resBtns .tbtn.primary{background:var(--acc);color:var(--ink);box-shadow:none;margin-left:auto}
.rstars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rs{display:flex;flex-direction:column;gap:6px;background:#26282B;border-radius:16px;padding:12px}
.rs b{width:26px;height:26px;border-radius:50%;background:#3A3C40;color:#3A3C40;display:flex;align-items:center;justify-content:center;font-size:14px}
.rs.on b{background:var(--acc);color:var(--ink)}
.rs span{font-size:12.5px;color:#A4A6A0;line-height:1.25}
.rs.on span{color:#fff}
.rmet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.rmet div{background:#26282B;border-radius:16px;padding:12px}
.rmet b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rmet b.hl{color:var(--acc)}
.rmet span{font-size:12px;color:#A4A6A0}
.rsub{color:#C9CBC4;font-size:15px;line-height:1.45}

/* ---------- full-screen screens ---------- */
#ov{position:fixed;inset:0;z-index:5;background-color:var(--bg);display:none;overflow:auto}
/* the dot grid is its own layer so the parallax only moves pixels, it never repaints the screen */
#ovBg{position:fixed;inset:-24px;z-index:-1;pointer-events:none;background-image:radial-gradient(var(--grid2) 1px,transparent 1.2px);background-size:22px 22px;will-change:translate}
#ov.on{display:block}
.scr{display:none;min-height:100%;padding:56px 6vw 64px}
.scr.on{display:block}
#scrMain.on{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:4vw;align-items:center;min-height:100vh}
.brand{font-size:clamp(56px,7.5vw,104px);font-weight:600;letter-spacing:-.045em;line-height:.9}
.brand-sub{color:var(--ink2);margin:14px 0 34px;font-size:17px;max-width:30ch}
.mlist{background:var(--paper);border-radius:28px;padding:8px;box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:22px;font-weight:500;letter-spacing:-.01em;padding:14px 18px;border-radius:20px;color:var(--ink);text-align:left}
.mi .mm{font-size:13px;font-weight:500;color:var(--mute);background:var(--card2);border-radius:999px;padding:4px 10px}
.mi:hover,.mi:focus-visible{background:var(--ink);color:#fff;outline:none}
.mi:hover .mm,.mi:focus-visible .mm{background:#33353A;color:#D5D7D0}
.mi[data-go="continue"]{background:var(--acc)}
.mi[data-go="continue"]:hover{background:var(--ink)}
.mi.small{display:inline-flex;width:auto;font-size:15px;margin-top:24px;padding:0 18px;height:40px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
.mi .v{color:var(--mute)}
.scr h2{font-size:clamp(40px,5vw,64px);font-weight:600;letter-spacing:-.04em;margin-bottom:26px;line-height:1}
.about{max-width:620px;color:var(--ink2);font-size:18px;line-height:1.55;background:var(--paper);border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow)}
#machine{width:100%;max-width:700px;height:auto;overflow:visible}
#machineCap{color:var(--ink2);font-size:15px;margin-top:4px;padding-left:6px}
#tree{display:block;overflow:visible;max-width:100%}
#tree .node{cursor:pointer}
#tree .node.lock{cursor:default}
#treeTip{min-height:44px;font-size:16px;color:var(--ink);margin-top:14px;background:var(--paper);border-radius:999px;padding:12px 20px;display:inline-block;box-shadow:var(--shadow)}
#treeTip:empty{display:none}
.tm{color:var(--mute)}

/* ---------- board svg ---------- */
.w{fill:none;pointer-events:none;stroke-width:calc(var(--ww) * 1px);stroke-linejoin:round;stroke-linecap:round}
/* canvas-coloured halo under every wire: where wires cross, the upper one visibly passes over the lower */
.wgap{fill:none;pointer-events:none;stroke:var(--bg);stroke-width:calc(var(--ww) * 1px + 6px);stroke-linejoin:round}
.w0{stroke:var(--w0)}
.w1{stroke:var(--w1)}
.wf{fill:none;pointer-events:none;stroke:var(--acc);stroke-width:max(1.5px,calc(var(--ww) * 1px - 2.5px));stroke-dasharray:5 23;stroke-linecap:round;animation:flow2 1.6s linear infinite}
@keyframes flow2{to{stroke-dashoffset:-28}}
@keyframes flow{to{stroke-dashoffset:-22}}
.whit{fill:none;stroke:transparent;stroke-width:calc(var(--ww) * 1px + 12px);cursor:pointer}
.whit.on{cursor:move}
.whit:hover+.wsel,.wsel.on{stroke:rgba(220,235,58,.75)}
.wsel{fill:none;stroke:transparent;stroke-width:calc(var(--ww) * 1px + 8px);pointer-events:none;stroke-linejoin:round;stroke-linecap:round}
.gb{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.gst{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
.gl{font:600 15px var(--font);fill:var(--ink);text-anchor:middle}
.gl.s{font-size:11px;font-weight:500}
.gate{cursor:move}
.gate.sel .gb{fill:var(--acc-soft)}
.gate.src .gb{fill:rgba(220,235,58,.28)}
.msel{fill:none;stroke:var(--ink);stroke-width:1.5;stroke-dasharray:6 5;pointer-events:none;opacity:.55}
.mbox{fill:rgba(220,235,58,.18);stroke:var(--ink);stroke-width:1;stroke-dasharray:4 4;pointer-events:none;vector-effect:non-scaling-stroke}
.pin-in{fill:var(--ink)}
.pin-out{fill:var(--ink)}
.pin-hit{fill:transparent;cursor:crosshair}
.pin-hit:hover{fill:rgba(220,235,58,.6)}
.short{fill:none;pointer-events:none;stroke:var(--coral);stroke-width:3;animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{50%{opacity:.35}}
.flag{cursor:pointer}
.lbl{font:600 15px var(--font);text-anchor:middle;dominant-baseline:central}
.jn{fill:var(--ink);pointer-events:none}
.cut{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round}
.ghost{opacity:.55;pointer-events:none}
.tmp{opacity:.8}
.onb{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:1 9;stroke-linecap:round;animation:flow 2.2s linear infinite;opacity:.5;pointer-events:none}

body.hc{--w0:#8E9089;--mute:#62645E;--ink2:#2C2E31;--line:#AFAFA7;--grid:#C4C4BC;--grid2:#B1B1A9}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
.scr.on>*{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.scr.on>*:nth-child(2){animation-delay:.05s}.scr.on>*:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- settings ---------- */
#setList{max-width:720px}
.sgrp{font-size:13px;font-weight:600;color:var(--mute);margin:26px 0 8px 6px}
.sgrp:first-child{margin-top:0}
.sgrp+.srow{border-radius:20px 20px 0 0}
.srow{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 20px;background:var(--paper);font-size:17px;font-weight:500;box-shadow:inset 0 -1px 0 var(--line)}
.srow:has(+ .sgrp),.srow:last-child{border-radius:0 0 20px 20px;box-shadow:none}
.srow .k{flex:1;color:var(--ink);cursor:pointer}
.srow .ar{width:36px;height:36px;border-radius:50%;background:var(--card2);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center}
.srow .ar:hover{background:var(--acc)}
.srow .val{min-width:190px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.sbar{display:inline-block;width:100px;height:6px;border-radius:6px;background:var(--line);vertical-align:middle;margin-right:10px;position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:6px}

/* ---------- Bit and the comm link ---------- */
#mascot{position:fixed;right:18px;display:flex;align-items:flex-end;gap:10px;pointer-events:none;z-index:6}
#mascot.off{display:none}
#bit{width:78px;height:98px;pointer-events:auto;cursor:pointer;flex:0 0 auto;overflow:visible;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
#bit.jump,#menuBit.jump #mbSvg{animation:jump .9s cubic-bezier(.3,1.3,.5,1) 1}
@keyframes jump{40%{transform:translateY(-8px)}75%{transform:translateY(0) scaleY(.97)}}
#bit.shake{animation:shake .6s 2}
@keyframes shake{25%{transform:translateX(-2px) rotate(-2deg)}75%{transform:translateX(2px) rotate(2deg)}}
#bit .eye,.bitsvg .eye{transform-origin:40px 42px;transform-box:view-box;animation:blink 5.5s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#bit .arm-r{transform-origin:66px 50px;transform-box:view-box}
#bit.wave .arm-r{animation:wave .8s ease-in-out 2}
@keyframes wave{50%{transform:rotate(-30deg)}}
#bit .m-open{animation:talk .36s steps(1) infinite}
@keyframes talk{50%{opacity:0}}
#bit .spark{animation:spark 2.6s ease-in-out infinite}
@keyframes spark{50%{opacity:.35}}
#chat{pointer-events:auto;width:min(380px,calc(100vw - 120px));background:var(--paper);border-radius:24px;box-shadow:var(--shadow),0 0 0 1px rgba(26,27,29,.04);position:relative;margin-bottom:46px;opacity:0;transform:translateY(8px) scale(.98);transform-origin:100% 100%;transition:opacity .16s,transform .16s;visibility:hidden;overflow:hidden}
#chat.on{opacity:1;transform:none;visibility:visible}
.chd{display:flex;align-items:center;gap:8px;padding:12px 10px 0 16px;font-size:13px}
.chd .cn{font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chd .cn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--ink)}
.chd .cs{color:var(--mute);flex:1}
.chd button{font-size:12.5px;font-weight:500;color:var(--ink2);padding:5px 11px;border-radius:999px;background:var(--card2)}
.chd button:hover{background:var(--acc);color:var(--ink)}
#chatX{width:28px;height:28px;padding:0!important;font-size:16px!important;line-height:1}
#chatBody{padding:10px 16px 14px;font-size:16px;line-height:1.45;cursor:pointer}
#chatCh{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#chatCh:empty{display:none}
.cbtn{text-align:left;font-size:14px;font-weight:500;color:var(--ink);padding:8px 14px;border-radius:999px;background:var(--card2)}
.cbtn:first-child{background:var(--ink);color:#fff}
.cbtn:hover,.cbtn:focus-visible{background:var(--acc);color:var(--ink);outline:none}
#chatMore{font-size:12px;color:var(--mute);text-align:right;min-height:4px}
#chatLog{display:none;max-height:min(46vh,380px);overflow:auto;padding:8px 16px 14px;font-size:14.5px;line-height:1.45;color:var(--ink2)}
#chatLog p{margin:8px 0;background:var(--card2);border-radius:14px 14px 14px 4px;padding:8px 12px}
#chatLog p.me{background:var(--ink);color:#fff;border-radius:14px 14px 4px 14px;margin-left:20%}
#chat.logon #chatLog{display:block}
#chat.logon #chatBody{display:none}

/* ---------- fx ---------- */
.fx-ring{fill:none;stroke:var(--ink);stroke-width:2;animation:ring .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
.fx-ring.g{stroke:var(--mute)}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(2.2);opacity:0}}
.fx-bit{font:700 16px var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--acc);stroke-width:6px;stroke-linejoin:round;animation:floatup 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes floatup{to{transform:translate(var(--dx),-60px);opacity:0}}

/* ---------- checkpoint test ---------- */
#quizBox{max-width:720px}
.qh{display:inline-flex;font-size:13px;font-weight:600;background:var(--paper);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow)}
.qp{color:var(--mute);margin:18px 0 6px;font-variant-numeric:tabular-nums;font-weight:500}
.qq{font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-.02em;margin-bottom:22px;text-wrap:balance;font-weight:600}
.qq sub,.qb sub{font-size:.62em}
.qfig{width:min(360px,100%);height:auto;display:block;margin:0 0 22px;overflow:visible;background:var(--paper);border-radius:var(--r);padding:14px}
.qv{font:600 14px var(--font);fill:var(--ink)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}
.qb{text-align:left;font-size:18px;font-weight:500;padding:18px 20px;border-radius:20px;background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.qb:hover:not(:disabled){background:var(--ink);color:#fff}
.qb.ok{background:var(--acc);color:var(--ink)}
.qb.bad{background:var(--coral);color:#fff}
.qb:disabled{cursor:default}
.qnext{margin-top:18px;min-height:44px}
.qnext .tbtn{height:44px}
.qres{font-size:clamp(48px,6vw,80px);font-weight:600;letter-spacing:-.04em;margin:18px 0 6px;line-height:1}
.qres.ok{color:var(--ink)}.qres.bad{color:var(--coral)}
.qscore{font-size:20px;color:var(--ink2)}
.qact{margin-top:20px;display:flex;gap:8px;flex-wrap:wrap}
.qact .mi{width:auto;background:var(--paper);box-shadow:var(--shadow)}

/* ---------- personnel file ---------- */
#profBox{max-width:880px}
.pf-k{font-size:14px;color:var(--mute);font-weight:500}
.pf-rank{font-size:clamp(44px,6vw,76px);font-weight:600;letter-spacing:-.04em;margin:2px 0 16px;line-height:1}
.pf-bar{height:10px;background:var(--paper);border-radius:10px;position:relative;max-width:560px;overflow:hidden}
.pf-bar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:10px}
.pf-next{color:var(--ink2);margin:10px 0 26px;font-variant-numeric:tabular-nums;line-height:1.5}
.pf-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:34px}
.pfc{background:var(--paper);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow)}
.pfc b{display:block;font-size:42px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.pfc small{font-size:16px;color:var(--mute);font-weight:500;letter-spacing:0}
.pfc span{display:block;margin-top:6px;font-size:14px;color:var(--ink2)}
#profBox h3{font-size:26px;font-weight:600;letter-spacing:-.02em;margin-bottom:12px}
.bd-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.bd{display:grid;grid-template-columns:46px 1fr;grid-template-rows:auto auto;column-gap:12px;padding:14px;border-radius:20px;background:rgba(250,250,247,.55);color:var(--mute)}
.bd.on{background:var(--paper);color:var(--ink);box-shadow:var(--shadow)}
.bd i{grid-row:1/3;font-style:normal;font-size:20px;font-weight:600;display:flex;align-items:center;justify-content:center;height:46px;border-radius:50%;background:var(--card2)}
.bd.on i{background:var(--acc);color:var(--ink)}
.bd b{font-size:15px;font-weight:600}
.bd span{font-size:13px;line-height:1.3}

@media (max-width:760px){
  #top{left:8px;right:8px;top:8px;grid-template-columns:auto 1fr;grid-template-rows:40px 40px;height:88px;gap:8px}
  #formula{grid-column:1/-1;grid-row:2;justify-self:center;font-size:17px;height:38px}
  .tbtn{height:38px;padding:0 12px;font-size:14px}
  #btnClear,#hud .hr{display:none}
  #palette{left:8px;top:104px;padding:4px}
  .pi{width:58px}
  #sheet{left:8px;right:8px;bottom:8px}
  #sheetBody{grid-template-columns:1fr}
  #stampTbl{display:none}
  #scrMain.on{display:block;padding-top:36px}
  #machine{margin-top:28px}
  .pf-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rmet b{font-size:24px}
  #bit{width:58px;height:74px}#chatBody{font-size:15px}#chat{margin-bottom:30px}
  .chd .cs,#saved{display:none}#hintBtn{font-size:13px;padding:0 12px}#lvTitle{font-size:16px}#lvNum{font-size:24px}
  .srow .val{min-width:110px}.sbar{width:54px}
}
/* reduced motion: the OS setting turns on settings.calm by default (body.calm), so no global override here — shrinking infinite animations to .01ms made them flicker */

/* ===== v3.3 overrides ===== */
/* formulas */
.math{font-family:"STIX Two Text","Onest",serif;font-weight:400;letter-spacing:0}
.mv{font-style:italic;font-family:"STIX Two Text",serif;padding:0 .02em}
.mo{display:inline-block;margin:0 .26em;font-style:normal;font-family:"STIX Two Text",serif}
.mos{width:.74em;height:.74em;vertical-align:-.06em;fill:none;stroke:currentColor;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round;overflow:visible}
sub .mo{margin:0 .06em}
.math .ov,.qb .ov,.qq .ov,.dq .ov,#chatText .ov,#task .ov,#hint .ov,.tt .ov,#treeTip .ov{text-decoration:none;display:inline-block;border-top:.07em solid currentColor;padding-top:.08em;line-height:1.05}
/* task card: formula + truth table, centred under the top bar */
#top{grid-template-columns:1fr 1fr}
#taskCard{position:fixed;top:72px;left:50%;transform:translateX(-50%);z-index:3;background:var(--paper);border-radius:26px;box-shadow:var(--shadow);padding:14px 16px 14px;max-width:min(980px,calc(100vw - 230px));display:flex;flex-direction:column;align-items:center;gap:10px}
#taskCard.notable{padding-bottom:14px}
#formula{height:auto;padding:2px 10px 0;border-radius:0;background:none;box-shadow:none;font-size:27px;pointer-events:none;white-space:nowrap;line-height:1.3}
#ttWrap{background:none;border-radius:0;padding:0;max-width:100%;overflow-x:auto;overflow-y:hidden}
table.tt{border-collapse:separate;border-spacing:3px 2px;font-size:17px}
.tt th{position:sticky;left:0;z-index:1;background:var(--paper);font-size:19px;color:var(--ink);font-weight:400;padding:0 14px 0 6px;text-align:right;font-family:"STIX Two Text","Onest",serif}
.tt td{min-width:34px;height:34px;padding:0 4px;text-align:center;border-radius:9px;background:var(--card2);font-weight:500;cursor:pointer;position:relative;color:var(--ink2)}
.tt tr td:first-child,.tt tr td:last-child{border-radius:9px}
.tt tr.gap th,.tt tr.gap td{border-top:0}
.tt tr.gap>*{position:relative}
.tt tr.gap td::before,.tt tr.gap th::before{content:"";position:absolute;left:-2px;right:-2px;top:-5px;height:2px;background:var(--ink);border-radius:2px}
.tt tr.gap td{margin-top:6px}
.tt tr.hn td{background:none;color:var(--mute);font-size:12px;height:22px;cursor:default}
.tt tr.hn th{font-family:var(--font);font-size:12px;color:var(--mute)}
.tt tr.out td{color:var(--ink);font-weight:600}
.tt td.live{background:var(--acc);color:var(--ink)}
.tt td.cur{background:var(--ink);color:#fff}
.tt td.ok{background:var(--ok);color:var(--ok-ink)}
.tt td.bad{background:var(--bad);color:var(--bad-ink)}
.tt td.wrong{background:var(--coral);color:#fff}
.tt td:hover{outline:2px solid var(--ink);outline-offset:-2px}
.tt .act{position:absolute;right:-5px;top:-7px;margin:0;min-width:15px;line-height:15px;font-size:10px;background:var(--ink);color:#fff;border-radius:8px}
/* dock without the table */
#sheetBody{grid-template-columns:minmax(220px,1fr) auto}
#stampTbl{flex-direction:row;min-width:0}
.met{min-width:130px}
/* headings: page titles calm, content heroes large */
.scr h2{font-size:30px;letter-spacing:-.02em;margin-bottom:22px}
.pf-k{margin-top:6px}
/* result: criteria list */
.rcrit{display:flex;flex-direction:column;gap:4px}
.rc{display:grid;grid-template-columns:28px 1fr auto;align-items:center;gap:12px;padding:10px 14px 10px 10px;border-radius:14px;background:#26282B;color:#8E9089;white-space:nowrap}
.rc i{width:28px;height:28px;border-radius:50%;border:1.5px dashed #55585C;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:14px;font-weight:700}
.rc span{font-size:15px;font-weight:500;overflow:hidden;text-overflow:ellipsis}
.rc em{font-style:normal;font-size:13px;color:#8E9089}
.rc.on{color:#fff}
.rc.on i{border:0;background:var(--acc);color:var(--ink)}
.rc.on em{color:var(--acc)}
.rmet{margin-top:8px}
.rmet b.hl{color:var(--acc)}
/* Bit: hidden until he speaks; his own stage inside the comm panel */
#mascot{right:16px;align-items:flex-end}
#bitTab{position:relative;width:60px;height:60px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);pointer-events:auto;display:flex;align-items:center;justify-content:center;transition:transform .2s,opacity .2s}
#bitTab:hover{transform:translateY(-2px);background:var(--acc)}
#bitTab svg{width:40px;height:48px;margin-top:4px}
#bitTab::after{content:"";position:absolute;right:4px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--paper);opacity:0}
body.bitWaiting #bitTab::after{opacity:1}
body.bitOn #bitTab{opacity:0;transform:scale(.6);pointer-events:none;position:absolute;right:0;bottom:0}
#chat{display:grid;grid-template-columns:132px 1fr;width:min(560px,calc(100vw - 32px));margin:0;border-radius:26px;transform:translateY(24px);transform-origin:100% 100%;transition:opacity .2s,transform .28s cubic-bezier(.2,1.2,.4,1)}
#chat.on{transform:none}
#bitStage{position:relative;background:var(--acc-soft);display:flex;align-items:flex-end;justify-content:center;padding:14px 0 18px;overflow:hidden}
#bitStage::after{content:"";position:absolute;left:24px;right:24px;bottom:16px;height:8px;border-radius:50%;background:rgba(26,27,29,.13)}
#bitStage #bit{position:relative;z-index:1;width:88px;height:110px;animation:none}
#chatMain{min-width:0;display:flex;flex-direction:column}
#chatBody{flex:1}
#bit .torso,.bitsvg .torso{transform-origin:40px 86px;transform-box:view-box;animation:breathe 5s ease-in-out infinite}
@keyframes breathe{50%{transform:scaleY(1.018) translateY(-.6px)}}
#bit .ant,.bitsvg .ant{transform-origin:40px 20px;transform-box:view-box;animation:sway 5.5s ease-in-out infinite}
@keyframes sway{25%{transform:rotate(-3.5deg)}75%{transform:rotate(3deg)}}
#bit .arm-l,.bitsvg .arm-l{transform-origin:14px 50px;transform-box:view-box;animation:armL 5s ease-in-out infinite}
#bit .arm-r,.bitsvg .arm-r{transform-origin:66px 50px;transform-box:view-box;animation:armR 5s ease-in-out infinite}
@keyframes armL{50%{transform:rotate(5deg)}}
@keyframes armR{50%{transform:rotate(-5deg)}}
#bit .pupil{animation:look 10s ease-in-out infinite}
@keyframes look{0%,30%,100%{transform:none}40%,55%{transform:translateX(2.5px)}65%,80%{transform:translate(-2px,1px)}}
#bit.talk .torso{animation:chatter .7s ease-in-out infinite}
@keyframes chatter{50%{transform:scaleY(.985) translateY(.6px)}}
#bit.talk .arm-r{animation:gesture 1.4s ease-in-out infinite}
@keyframes gesture{50%{transform:rotate(-14deg)}}
#bit.wave .arm-r{animation:wave .8s ease-in-out 2}
@media (max-width:760px){
  #top{grid-template-rows:40px;height:40px}
  #taskCard{top:56px;max-width:calc(100vw - 16px);padding:10px}
  #formula{font-size:21px}
  table.tt{font-size:15px}.tt td{min-width:28px;height:28px}.tt th{font-size:16px}
  #palette{top:auto;bottom:calc(var(--dock,180px) + 24px)}
  #chat{grid-template-columns:96px 1fr}#bitStage #bit{width:68px;height:86px}
  #stampTbl{display:none}
}

/* v3.3 fixes */
#mascot{display:block;width:60px;height:60px}
#bitTab{position:absolute;right:0;bottom:0}
#chat{position:absolute;right:0;bottom:0}
#stampTbl{align-items:flex-start}
.met{flex:0 0 auto;min-height:0}
@media (min-width:1100px){body.bitOn #result.on{padding-right:520px}}

/* ================= v3.4 ================= */
/* ---------- comm link: folds into the tab and back ---------- */
#chat{transform:scale(.1);transform-origin:calc(100% - 30px) calc(100% - 30px);opacity:0;visibility:hidden;
  transition:transform .5s cubic-bezier(.6,0,.3,1),opacity .28s ease .2s,visibility 0s linear .5s}
#chat.on{transform:none;opacity:1;visibility:visible;transition:transform .5s cubic-bezier(.2,1.05,.35,1),opacity .2s ease,visibility 0s}
#mascot.fl #chat{left:0;right:auto;transform-origin:30px calc(100% - 30px)}
#mascot.ft #chat{top:0;bottom:auto;transform-origin:calc(100% - 30px) 30px}
#mascot.fl.ft #chat{transform-origin:30px 30px}
#chat .chd{cursor:grab}
#bitTab{overflow:hidden;cursor:grab;transition:transform .35s cubic-bezier(.2,1.2,.4,1) .36s,opacity .25s ease .34s,background .2s}
body.bitOn #bitTab{opacity:0;transform:scale(.6);transition:transform .2s,opacity .15s}
body.mainScr:not(.bitOn) #bitTab{opacity:0;transform:scale(.6);pointer-events:none;transition:transform .2s,opacity .15s}
body.bitDragging,body.bitDragging *{cursor:grabbing!important}
body.bitDragging #chat,body.bitDragging #bitTab{transition:none}
#bitTab svg{width:46px;height:57px;margin-top:22px;overflow:visible}
#bitTab:hover svg{transform:translateY(-3px);transition:transform .3s}
#bitMini .pupil,#mbSvg .pupil,.wr-bit .pupil{transform:translate(var(--px,0px),var(--py,0px));transition:transform .3s ease-out}
#bitMini.peek{animation:peek 3.6s ease-in-out}
@keyframes peek{0%{transform:none}22%,42%{transform:translateY(30px)}62%{transform:translateY(5px) rotate(-7deg)}80%{transform:translateY(5px) rotate(5deg)}100%{transform:none}}

/* ---------- Bit in the main menu ---------- */
.mcol{position:relative}
#menuBit{position:absolute;left:0;top:0;z-index:2;cursor:pointer;transition-property:transform,opacity;transition-timing-function:linear,ease;transition-duration:1s,.3s;will-change:transform}
#menuBit.hop{transition-timing-function:cubic-bezier(.35,-.55,.65,1),ease}
#menuBit.enter{animation:mbIn .9s cubic-bezier(.2,1.2,.4,1)}
@keyframes mbIn{from{opacity:0;scale:.5}}
body.bitOn #menuBit{opacity:0;pointer-events:none}
#mbSvg{width:100%;height:100%;display:block;overflow:visible;transform-origin:43% 97%}
#mbSvg.flipx{scale:-1 1}
#mbSvg .p{display:none}
.a-solder .p-iron,.a-solder .p-chip,.a-read .p-book,.a-scope .p-mag,.a-carry .p-box,.a-nap .p-zz{display:inline!important}
#menuBit .p-iron,#menuBit .p-mag{transform-origin:66px 50px;transform-box:view-box}
.a-solder .arm-r,.a-solder .p-iron{animation:solder 2.4s ease-in-out infinite!important}
@keyframes solder{0%,100%{transform:rotate(60deg)}50%{transform:rotate(56deg)}}
.spk{opacity:0;animation:spk 1.3s steps(1) infinite}
.spk.s2{animation-delay:.4s}.spk.s3{animation-delay:.85s}
@keyframes spk{0%{opacity:1}25%{opacity:0}}
.a-read .arm-l,.a-carry .arm-l{animation:none!important;transform:rotate(-127deg)}
.a-read .arm-r,.a-carry .arm-r{animation:none!important;transform:rotate(127deg)}
.a-read #mbSvg .pupil{animation:readx 3s ease-in-out infinite}
@keyframes readx{0%,100%{transform:translate(-2.5px,3px)}50%{transform:translate(2.5px,3px)}}
#menuBit .page{transform-origin:40px 60px;transform-box:view-box;animation:page 6s ease-in-out infinite}
@keyframes page{0%,70%{transform:none;opacity:1}86%{transform:scaleX(-1);opacity:1}100%{transform:scaleX(-1);opacity:0}}
.a-scope .arm-r,.a-scope .p-mag{animation:scope 4s ease-in-out infinite!important}
@keyframes scope{0%,100%{transform:rotate(-12deg)}50%{transform:rotate(14deg)}}
.a-walk .leg-l,.a-carry .leg-l{animation:stepA .56s ease-in-out infinite}
.a-walk .leg-r,.a-carry .leg-r{animation:stepB .56s ease-in-out infinite}
@keyframes stepA{0%,100%{transform:translateY(0)}50%{transform:translateY(-3px)}}
@keyframes stepB{0%,100%{transform:translateY(-3px)}50%{transform:translateY(0)}}
.a-walk .mb-body,.a-carry .mb-body{animation:walkbob .56s ease-in-out infinite}
@keyframes walkbob{50%{transform:translateY(-1.2px)}}
.a-nap .torso{animation-duration:7s!important}
.p-zz text{opacity:0;animation:zz 3.4s ease-in-out infinite}
.p-zz .z2{animation-delay:1.7s}
@keyframes zz{0%{opacity:0;transform:translate(0,6px)}30%{opacity:1}100%{opacity:0;transform:translate(7px,-9px)}}
#mbSay{position:absolute;left:80%;bottom:64%;width:max-content;max-width:290px;background:var(--paper);color:var(--ink);font-size:15px;font-weight:500;line-height:1.4;
  padding:11px 15px;border-radius:18px 18px 18px 6px;box-shadow:var(--shadow),0 0 0 1px rgba(26,27,29,.05);opacity:0;transform:translateY(6px) scale(.96);transform-origin:0 100%;
  pointer-events:none;transition:opacity .35s,transform .35s;text-wrap:pretty}
#mbSay.on{opacity:1;transform:none}
#menuBit.sl #mbSay{left:auto;right:80%;border-radius:18px 18px 6px 18px;transform-origin:100% 100%}

/* ---------- settings controls ---------- */
.srow{min-height:62px;gap:14px;flex-wrap:wrap}
.srow .k{cursor:default}
.sw{width:52px;height:30px;border-radius:999px;background:var(--line);position:relative;flex:0 0 auto;transition:background .2s}
.sw i{position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .25s cubic-bezier(.3,1.3,.5,1),background .2s}
.sw.on{background:var(--ink)}
.sw.on i{transform:translateX(22px);background:var(--acc)}
.seg{display:flex;background:var(--card2);border-radius:999px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{height:34px;padding:0 15px;border-radius:999px;font-size:14px;font-weight:500;color:var(--ink2)}
.seg button:hover{color:var(--ink);background:rgba(255,255,255,.7)}
.seg button.on{background:var(--ink);color:#fff}
.dd{position:relative}
.dd-b{height:40px;min-width:210px;padding:0 14px 0 16px;border-radius:999px;background:var(--card2);display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:15px;font-weight:500;font-variant-numeric:tabular-nums}
.dd-b:hover{background:var(--line)}
.dd-b svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.dd.open .dd-b{background:var(--ink);color:#fff}
.dd.open .dd-b svg{transform:rotate(180deg)}
.dd-l{position:absolute;right:0;top:calc(100% + 6px);min-width:100%;max-height:320px;overflow:auto;background:var(--paper);border-radius:18px;padding:6px;z-index:10;display:none;
  box-shadow:0 18px 40px -12px rgba(26,27,29,.35),0 0 0 1px rgba(26,27,29,.06)}
.dd.open .dd-l{display:block;animation:ddIn .16s ease-out}
@keyframes ddIn{from{opacity:0;transform:translateY(-4px)}}
.dd-o{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:12px;font-size:15px;font-weight:500;white-space:nowrap;font-variant-numeric:tabular-nums}
.dd-o:hover{background:var(--card2)}
.dd-o.on{background:var(--acc)}
.rng{display:flex;align-items:center;gap:14px}
.rng input{-webkit-appearance:none;appearance:none;width:220px;height:6px;border-radius:6px;cursor:pointer;
  background:linear-gradient(var(--ink),var(--ink)) 0 0/var(--v) 100% no-repeat,var(--line)}
.rng input::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--acc);border:2px solid var(--ink)}
.rng input::-moz-range-thumb{width:18px;height:18px;border-radius:50%;background:var(--acc);border:2px solid var(--ink)}
.rng input:focus-visible{outline:2px solid var(--ink);outline-offset:6px}
.rng output{min-width:50px;text-align:right;font-size:14px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums}

/* ---------- hint price ---------- */
#hintBtn{display:inline-flex;align-items:center}
#hintBtn.owned{padding:0 11px;background:var(--acc-soft);transition:background .2s}
#hintBtn .hk{font-weight:600;width:14px;text-align:center}
#hintBtn .hko{display:inline-block;max-width:0;opacity:0;overflow:hidden;white-space:nowrap;transition:max-width .25s ease,opacity .2s ease,margin .25s ease}
#hintBtn.owned:hover .hko,#hintBtn.owned:focus-visible .hko{max-width:240px;opacity:1;margin-left:6px}
.cost{font-size:12.5px;font-weight:500;opacity:.62;margin-left:9px;white-space:nowrap}

/* ---------- knife and splice ---------- */
.w.doom{stroke:var(--coral)!important}
.gate.doom .gb{fill:var(--bad);stroke:var(--coral)}
.gate.doom .gst{stroke:var(--coral)}
.gate.doom .gl{fill:var(--coral)}
.wins{fill:none;pointer-events:none;stroke:var(--acc);stroke-width:calc(var(--ww) * 1px + 10px);stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.ghost.ins .gb{fill:var(--acc-soft)}

/* ---------- workshop ---------- */
.sh-head{display:flex;align-items:baseline;gap:8px 22px;flex-wrap:wrap;margin-bottom:22px}
.sh-bal b{font-size:64px;font-weight:600;letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums}
.sh-bal span{font-size:17px;color:var(--ink2);margin-left:10px;font-weight:500}
.sh-sub{font-size:14px;color:var(--mute);font-weight:500}
.sh-grid{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:12px;margin-bottom:12px;max-width:1100px}
.sh-card{background:var(--paper);border-radius:var(--r);padding:22px 24px;box-shadow:var(--shadow);max-width:1100px}
.sh-card h3{font-size:22px;font-weight:600;letter-spacing:-.02em;margin-bottom:6px}
.sh-p{font-size:14.5px;color:var(--ink2);line-height:1.45;margin-bottom:16px}
.sh-note{margin:16px 0 0;color:var(--mute)}
.dq{font-size:22px;font-weight:600;line-height:1.3;letter-spacing:-.01em;margin-bottom:14px;text-wrap:balance}
.dq sub{font-size:.62em}
#drillQ .qfig{margin:0 0 14px;background:var(--card2);width:min(300px,100%)}
.dqa{grid-template-columns:repeat(auto-fit,minmax(90px,1fr))}
#drillQ .qb{background:var(--card2);box-shadow:none;text-align:center;font-size:20px;padding:14px;font-variant-numeric:tabular-nums}
#drillQ .qb:hover:not(:disabled){background:var(--ink);color:#fff}
#drillQ .qb.ok{background:var(--acc);color:var(--ink)}
#drillQ .qb.bad{background:var(--coral);color:#fff}
.dfoot{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:14px;font-size:14px;color:var(--ink2);min-height:40px}
.dfoot .tbtn{box-shadow:none;background:var(--ink);color:#fff}
.er{display:flex;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px}
.er:last-child{border-bottom:0}
.er b{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.er.got b{color:var(--ok-ink)}
.wr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.wr{background:var(--card2);border-radius:18px;padding:14px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.wr.on{background:var(--acc-soft);box-shadow:inset 0 0 0 2px var(--ink)}
.wr-bit{width:74px;height:92px;overflow:visible}
.wr b{font-size:15px;font-weight:600}
.wr .tbtn{height:36px;font-size:14px;box-shadow:none}
.wr .tbtn:not(.primary){background:var(--paper)}
@media (max-width:820px){.sh-grid{grid-template-columns:1fr}.sh-bal b{font-size:48px}}
#ov.on~#mascot #bitTab{opacity:0;transform:scale(.6);pointer-events:none;transition:transform .2s,opacity .15s}

/* ================= v3.5 ================= */
/* task card level with the top buttons; drops below them only when it does not fit */
#taskCard{top:14px}
#taskCard.low{top:72px}
/* points pill centred in its button */
#hud{padding:0 6px 0 16px}
#hud .hp{margin:0}
/* truth table: the output separator is its own row, it never covers the cells */
.tt tr.ttsep th,.tt tr.ttsep td{height:9px;min-width:0;padding:0;border-radius:0;cursor:default;background:linear-gradient(var(--ink),var(--ink)) center/100% 2px no-repeat}
.tt tr.ttsep th{background:linear-gradient(var(--ink),var(--ink)) center/100% 2px no-repeat,var(--paper)}
.tt tr.ttsep td:hover{outline:none}
/* Bit: arms hang down now, poses offset by the new rest angle */
@keyframes wave{50%{transform:rotate(-110deg)}}
@keyframes gesture{50%{transform:rotate(-35deg)}}
.a-solder .arm-r{animation:solderArm 2.4s ease-in-out infinite!important}
.a-solder .p-iron{animation:solder 2.4s ease-in-out infinite!important}
@keyframes solderArm{0%,100%{transform:rotate(-2deg)}50%{transform:rotate(-6deg)}}
.a-read .arm-l,.a-carry .arm-l{transform:rotate(-65deg)}
.a-read .arm-r,.a-carry .arm-r{transform:rotate(65deg)}
.a-scope .arm-r{animation:scopeArm 4s ease-in-out infinite!important}
.a-scope .p-mag{animation:scope 4s ease-in-out infinite!important}
@keyframes scopeArm{0%,100%{transform:rotate(-74deg)}50%{transform:rotate(-48deg)}}
/* dragging the comm link: see-through, legs dangle */
body.bitDragging #chat.on{opacity:.72}
body.bitDragging:not(.bitOn) #bitTab{opacity:.75}
body.bitDragging #bit .legs{transform-origin:40px 72px;transform-box:view-box;animation:dangle .7s ease-in-out infinite}
@keyframes dangle{25%{transform:rotate(7deg)}75%{transform:rotate(-7deg)}}
/* delete button next to the selection */
#selPop{position:fixed;left:0;top:0;z-index:4;height:36px;padding:0 16px;border-radius:999px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;
  box-shadow:var(--shadow);display:none;align-items:center;white-space:nowrap;margin-top:-8px}
#selPop.on{display:inline-flex;animation:popIn .18s ease-out}
#selPop::after{content:"";position:absolute;left:50%;bottom:-5px;width:10px;height:10px;margin-left:-5px;background:var(--ink);transform:rotate(45deg);border-radius:2px}
#selPop:hover{background:var(--coral)}
@keyframes popIn{from{opacity:0;scale:.9}}
/* loupe while wiring with a finger */
#loupe{position:fixed;left:0;top:0;width:132px;height:132px;border-radius:50%;overflow:hidden;z-index:7;pointer-events:none;opacity:0;
  box-shadow:0 0 0 3px var(--ink),0 16px 32px -10px rgba(26,27,29,.45);transition:opacity .12s}
#loupe.on{opacity:1}
#loupe svg{display:block}
/* knife */
#knifeBtn.on{background:var(--coral);color:#fff}
body.knife #board{cursor:crosshair}
/* dock: hide / show */
#sheetTog{width:36px;height:36px;border-radius:50%;background:var(--card2);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
#sheetTog:hover{background:var(--line)}
#sheetTog svg{width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#sheet.min #sheetTog svg{transform:rotate(180deg)}
#sheet{transition:height .22s cubic-bezier(.3,.9,.4,1)}
body.sheetDrag #sheet{transition:none}
.pnote{font-size:11px;line-height:1.25;color:var(--mute);text-align:center;padding:6px 4px 4px;max-width:72px}
/* hotkeys */
.keys{display:flex;gap:6px;flex-wrap:wrap}
.kc{min-width:44px;height:36px;padding:0 12px;border-radius:10px;background:var(--card2);box-shadow:inset 0 -2px 0 var(--line);font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}
.kc:hover{background:var(--line)}
.kc.wait{background:var(--acc);box-shadow:none;font-weight:500}
.srow.kfoot{justify-content:flex-end}
.kfoot .tbtn{box-shadow:none;background:var(--card2)}
.srow.mhelp{flex-direction:column;align-items:flex-start;gap:8px;padding:16px 20px;font-size:14.5px;font-weight:400;color:var(--ink2);line-height:1.4}
/* level list for phones */
#treeList{display:none}
body.treeMob #tree,body.treeMob #treeTip{display:none}
body.treeMob #treeList{display:block}
.tl-ch{background:var(--paper);border-radius:22px;margin-bottom:8px;box-shadow:var(--shadow);overflow:hidden}
.tl-h{display:grid;grid-template-columns:40px minmax(0,1fr) 54px 14px;align-items:center;gap:12px;width:100%;padding:14px 16px;text-align:left}
.tl-h b{font-size:30px;font-weight:600;letter-spacing:-.04em;line-height:1}
.tl-h em{display:block;font-style:normal;font-size:17px;font-weight:600;letter-spacing:-.01em}
.tl-h small{display:block;font-size:13px;color:var(--mute);font-weight:500;margin-top:2px}
.tl-bar{display:block;height:6px;border-radius:6px;background:var(--line);overflow:hidden}
.tl-bar i{display:block;height:100%;background:var(--ink);border-radius:6px}
.tl-h svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
.tl-ch.open .tl-h svg{transform:rotate(180deg)}
.tl-ch.lock .tl-h{opacity:.55}
.tl-body{display:none;grid-template-columns:1fr 1fr;gap:8px;padding:0 12px 12px}
.tl-ch.open .tl-body{display:grid}
.tl-l{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:12px 14px;border-radius:16px;background:var(--card2);text-align:left;min-height:96px;color:var(--ink)}
.tl-l b{font-size:22px;font-weight:600;letter-spacing:-.03em;line-height:1}
.tl-l span{font-size:14px;font-weight:500;line-height:1.25;flex:1}
.tl-st{font-style:normal;font-size:12px;color:var(--ink2);display:flex;gap:5px;align-items:center}
.tl-st u{width:8px;height:8px;border-radius:50%;background:#55585C;display:inline-block}
.tl-st u.on{background:var(--acc)}
.tl-l.av{background:var(--acc)}
.tl-l.done{background:var(--ink);color:#fff}
.tl-l.done .tl-st{color:#A4A6A0}
.tl-l.lock{opacity:.5}
.tl-q{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 16px;border-radius:16px;background:var(--card2);font-size:15px;font-weight:600;color:var(--ink);text-align:left}
.tl-q b{font-weight:500;font-size:13px}
.tl-q.av{background:var(--ink);color:#fff}
.tl-q.pass{background:var(--acc)}
.tl-q.lock{opacity:.5}

@media (max-width:760px){
  #taskCard,#taskCard.low{top:56px}
  #hud{padding:0 6px}
  /* elements in a horizontal strip above the dock */
  #palette{flex-direction:row;max-width:calc(100vw - 96px);overflow-x:auto;overflow-y:hidden;bottom:calc(var(--dock,180px) + 16px);max-height:none}
  .pi{width:64px;flex:0 0 auto;padding:8px 0 6px}
  .pcount,.pnote{align-self:center;flex:0 0 auto;padding:6px 8px}
  #zIn,#zOut{display:none}
  /* comm link drops from the top on phones */
  #mascot.mob #chat{position:fixed;left:8px;right:8px;width:auto;bottom:auto;grid-template-columns:84px 1fr;transform-origin:calc(100% - 30px) 100%}
  #mascot.mob #bitStage #bit{width:60px;height:76px}
  #chatX{width:44px;height:44px;font-size:22px!important}
  #chatLogBtn{height:36px;padding:0 12px!important}
  #chatBody{padding:8px 14px 12px}
  .cbtn{padding:10px 14px}
  #sheetTog{width:40px;height:40px}
  #selPop{height:42px;padding:0 20px;font-size:15px}
}

/* ================= v3.6 ================= */
/* undo, redo and scissors: one icon group next to Menu */
.tgrp{display:flex;align-items:center;gap:2px;height:40px;padding:0 4px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
.ib{width:36px;height:32px;border-radius:16px;display:flex;align-items:center;justify-content:center;color:var(--ink);flex:0 0 auto}
.ib svg,#chatX svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ib:hover{background:var(--card2)}
.ib:disabled{opacity:.3;pointer-events:none}
.tsep{width:1px;height:20px;background:var(--line);margin:0 4px}
#knifeBtn.on{background:var(--coral);color:#fff}
/* Bit's folded tab is a square window, like the comm link it opens into */
#bitTab{border-radius:16px}
/* close sits first in the header, bare until hovered */
.chd{padding-left:8px}
.chd #chatX{width:30px;height:30px;padding:0;border-radius:8px;background:none;color:var(--ink2);display:flex;align-items:center;justify-content:center;flex:0 0 auto;margin-right:2px}
.chd #chatX:hover{background:var(--card2);color:var(--ink)}
#chatX svg{width:16px;height:16px}
#chatLogBtn{margin-left:auto}
@media (max-width:760px){
  .tgrp{height:38px;padding:0 3px}
  .ib{width:36px;height:32px}
  .chd #chatX{width:40px;height:40px}
  #chatX svg{width:20px;height:20px}
}

/* ---------- main menu: exactly one screen tall (the screen is zoomed by --ui, so divide it back out) ---------- */
#scrMain.on{min-height:calc(100vh / var(--ui));height:calc(100vh / var(--ui))}
#scrMain .mcol{will-change:translate}
@media (max-width:760px){#scrMain.on{height:auto}}

/* ---------- Bit's dock: where the magnet pulls him back; the zoom buttons slide aside while he is away ---------- */
#zoom{transition:bottom .15s,right .32s cubic-bezier(.2,1,.3,1)}
#bitDock{position:fixed;right:16px;bottom:178px;width:60px;height:60px;border-radius:16px;border:2px dashed var(--mute);pointer-events:none;z-index:6;opacity:0;transform:scale(.86);transition:opacity .18s,transform .22s cubic-bezier(.2,1.3,.4,1),background .15s,border-color .15s}
body.bitDragging #bitDock{opacity:.7;transform:none}
body.bitNear #bitDock{opacity:1;transform:scale(1.08);background:var(--acc-soft);border-style:solid;border-color:var(--ink)}
#mascot{transition:translate .32s cubic-bezier(.2,1,.3,1)}
body.bitDragging #mascot{transition:none;will-change:translate}
body.bitDragging.bitNear #mascot{transition:translate .14s ease-out}
body.bitDragging #chat{will-change:rotate}
@media (max-width:760px){#bitDock{display:none}}

/* ---------- gate tooltip in the palette: name, formula and truth table ---------- */
#gtip{position:fixed;left:0;top:0;z-index:7;pointer-events:none;background:var(--paper);border-radius:18px;box-shadow:var(--shadow),0 0 0 1px rgba(26,27,29,.05);padding:14px 16px 14px;min-width:170px;max-width:250px;opacity:0;visibility:hidden;transform:translateX(-6px);transition:opacity .12s,transform .16s,visibility 0s .16s}
#gtip.on{opacity:1;visibility:visible;transform:none;transition:opacity .12s,transform .16s,visibility 0s}
.gt-h{display:flex;align-items:baseline;gap:8px;font-size:17px;font-weight:600;line-height:1.1}
.gt-h span{font-size:12px;font-weight:500;color:var(--mute)}
.gt-f{font-family:"STIX Two Text","Onest",serif;font-size:19px;margin:8px 0 4px;white-space:nowrap}
.gt-f .ov{text-decoration:none;display:inline-block;border-top:.07em solid currentColor;padding-top:.08em;line-height:1.05}
.gt-f sub,.gtt sub{font-size:.62em}
.gt-d{font-size:13px;line-height:1.3;color:var(--ink2);margin-bottom:10px}
table.gtt{border-collapse:separate;border-spacing:3px 3px;margin:-3px;font-variant-numeric:tabular-nums}
.gtt th{font-family:"STIX Two Text","Onest",serif;font-weight:400;font-size:17px;color:var(--ink);padding:0 4px;text-align:center}
.gtt td{min-width:32px;height:26px;padding:0 6px;text-align:center;border-radius:8px;background:var(--card2);font-size:14px;font-weight:500;color:var(--ink2);white-space:nowrap}
.gtt td.o{background:var(--paper);box-shadow:inset 0 0 0 1.5px var(--ink);color:var(--ink);font-weight:600}
.gtt td.o.one{background:var(--acc);box-shadow:none}
.gtt .sep{min-width:0;width:2px;padding:0;background:var(--ink);border-radius:1px}
.gtt th.sep{background:none}
body.calm #gtip{transform:none}
/* the palette stops above the bottom sheet and scrolls instead of sliding under it */
@media (min-width:761px){#palette{max-height:calc((100vh - var(--dock,180px)) / var(--ui) - 96px)}}

/* truth table card: drag to move, collapse to the formula */
#taskCard{cursor:grab;touch-action:none}
#taskCard.drag{cursor:grabbing;transition:none;user-select:none}
#taskCard.moved{transform:none}
#ttTog{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--mute);opacity:.55;transition:opacity .15s,background .15s}
#taskCard:hover #ttTog,#ttTog:focus-visible{opacity:1}
#ttTog:hover{background:var(--card2);color:var(--ink)}
#ttTog svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#taskCard.tthide #ttTog svg{transform:rotate(180deg)}
#taskCard.tthide #ttWrap{display:none}
#taskCard:has(#ttWrap:not(:empty)){padding-right:40px;padding-left:40px}
#taskCard:has(#ttWrap:empty) #ttTog{display:none}
/* the Back button of every menu screen stays in the top-left corner */
.scr>.mi.small[data-go]{position:fixed;top:14px;left:16px;margin:0;z-index:6}
#navGrp .ib svg{width:18px;height:18px}
/* floating editor tools on the right edge, centred between the top bar and the sheet */
#toolDock{position:fixed;right:16px;top:calc((76px + 100vh - var(--dock,180px))/2);transform:translateY(-50%);z-index:3;display:flex;flex-direction:column;align-items:center;gap:6px}
#toolDock .tgrp{flex-direction:column;height:auto;width:44px;padding:4px 0;gap:2px}
#toolDock .tsep{width:20px;height:1px;margin:4px 0}
#toolsTog{width:28px;height:28px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center;color:var(--mute)}
#toolsTog:hover{color:var(--ink)}
#toolsTog svg{width:11px;height:11px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s}
#toolDock.hide #toolsTog svg{transform:rotate(180deg)}
#toolDock.hide #tools{display:none}
.w.wc{stroke:var(--wc)}
.w0.wc{opacity:.38}
#wcolBtn .wcdot{fill:var(--wc,transparent);stroke:none}
#wcolPop{position:fixed;z-index:4;display:none;transform:translateY(-50%);gap:6px;padding:6px 8px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
#wcolPop.on{display:flex}
#wnotePop{position:fixed;z-index:4;display:none;transform:translateY(-50%);padding:4px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
#wnotePop.on{display:block}
#netInsp{position:fixed;z-index:4;display:none;width:250px;padding:12px 14px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);font-size:13px;color:var(--ink)}
#netInsp.on{display:block}
#netInsp .ni-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px;font-size:14px}
#netInsp .ni-v{min-width:22px;height:22px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;background:var(--card2);font-weight:600}
#netInsp .ni-v.on{background:var(--acc)}
#netInsp .ni-r{display:grid;grid-template-columns:70px 1fr;gap:8px;padding:6px 0;border-top:1px solid var(--line)}
#netInsp .ni-r>span{color:var(--mute)}
#netInsp .ni-c{display:flex;flex-wrap:wrap;gap:5px}
#netInsp .ni-c button{width:18px;height:18px;border-radius:50%;background:var(--wc,var(--w1));box-shadow:inset 0 0 0 2px var(--paper)}
#netInsp .ni-c button:not([style]){background:linear-gradient(135deg,var(--w1) 50%,var(--w0) 50%)}
#netInsp .ni-c button[aria-checked=true]{outline:2px solid var(--ink);outline-offset:1px}
#netBtn.on{background:var(--card2)}
.nethl{fill:none;stroke:rgba(220,235,58,.75);stroke-width:6;pointer-events:none}
#wnoteIn{width:220px;height:30px;border:0;border-radius:999px;padding:0 12px;background:var(--card2);color:var(--ink);font:500 14px var(--font);outline:none}
#wnoteIn:focus{box-shadow:inset 0 0 0 2px var(--ink)}
.wnote{font:600 12px var(--font);fill:var(--ink2);dominant-baseline:central;paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round;pointer-events:none}
#wcolPop button{width:22px;height:22px;border-radius:50%;background:var(--wc,var(--w1));box-shadow:inset 0 0 0 2px var(--paper)}
#wcolPop button:not([style]){background:linear-gradient(135deg,var(--w1) 50%,var(--w0) 50%)}
#wcolPop button[aria-checked=true]{outline:2px solid var(--ink);outline-offset:1px}
#wcolPop button:hover{transform:scale(1.12)}
@media (max-width:760px){#toolDock{right:8px;top:calc((56px + 100vh - var(--dock,180px))/2)}}
/* one spacing grid: 16px from the screen edges on desktop, 8px on phones; equal palette cells */
.pi{min-height:64px;justify-content:center}
@media (max-width:760px){
  #mascot{right:8px}
  #palette{scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 20px),transparent)}
  #palette::-webkit-scrollbar{display:none}
  .pi{min-height:0}
}
/* gate card: only the name is interactive (hover cross-fades it to the other language); the card stays below the top bar */
#gtip.on .gt-h{pointer-events:auto}
.gt-n{display:grid}
.gt-n>span{grid-area:1/1;font:inherit;color:inherit;transition:opacity .2s,transform .2s}
.gt-n .alt{opacity:0;transform:translateY(3px)}
.gt-h:hover .gt-n>span:first-child{opacity:0;transform:translateY(-3px)}
.gt-h:hover .gt-n .alt{opacity:1;transform:none}

.odhit{fill:transparent}
#odTip{position:fixed;z-index:7;pointer-events:none;background:var(--paper);border-radius:999px;box-shadow:var(--shadow);padding:7px 14px;font-size:13px;color:var(--ink);white-space:nowrap;opacity:0;transition:opacity .12s}
#odTip.on{opacity:1}
#odTip b{font-weight:700}

/* indices sit below the baseline like in a textbook */
sub{vertical-align:baseline;position:relative;top:.34em;line-height:0}
sup{vertical-align:baseline;position:relative;top:-.5em;line-height:0}
</style>

  <div class="tb r"><button class="tbtn" id="hud"></button><button class="tbtn" id="btnClear" data-t="clear"></button><button class="tbtn primary" id="verify" data-t="verify"></button></div>

  </div><button id="toolsTog" aria-expanded="true"><svg viewBox="0 0 12 12"><path d="M4.5 2.5L8 6L4.5 9.5"/></svg></button></div><div id="wcolPop" role="menu"></div><div id="netInsp" role="dialog"></div>
<div id="odTip" role="tooltip"></div><div id="wnotePop"><input id="wnoteIn" maxlength="40" autocomplete="off" spellcheck="false"></div>

   <div class="mcol">

    <div class="brand-sub" data-t="brandSub"></div>
    <div class="mlist">
      <button class="mi" data-go="continue"><span data-t="cont"></span><span class="mm" id="mmCont"></span></button>
