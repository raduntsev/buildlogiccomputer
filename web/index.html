      {t:['А если нет?','And if not?'],r:{t:['Отказ не предусмотрен. Я проверил. Дважды. Нажмите «Продолжить».','Refusal is not an option. I checked. Twice. Press “Continue”.'],m:'think'}}]}],
  welcome:[['С возвращением, испытуемый. Ваше отсутствие длилось слишком долго. Я считал.','Welcome back, subject. Your absence lasted far too long. I counted.'],
    ['А, это вы. Протокол уже открыт.','Ah, it’s you. The log is already open.'],
    ['Снова здравствуйте. Машина скучала. Я — нет. Почти.','Hello again. The Machine missed you. I did not. Mostly.']],
  ch:{
    1:['Испытание первое: «Основы». Машина должна снова отличать 0 от 1. Начнём с того, что умею даже я.','Trial one: “Basics”. The Machine must tell 0 from 1 again. We start with what even I can do.'],
    2:['Глава вторая. На складе остались одни элементы И-НЕ. Кто-то заказал тысячу штук. Не я. Почти наверняка не я.','Chapter two. Only NAND gates are left in storage. Someone ordered a thousand. Not me. Almost certainly not me.'],
    3:['Глава третья. Учим Машину считать. Раньше этим занимался я, но мне никто не платил.','Chapter three. We teach the Machine to count. I used to do that, but nobody paid me.'],
    4:['Глава четвёртая. Машина забывает всё через мгновение. Как испытуемые, только быстрее. Дадим ей память.','Chapter four. The Machine forgets everything in an instant. Like test subjects, only faster. Let us give it memory.'],
    5:['Глава пятая. Складывать умеем. Теперь вычитать. Начнём с вашего времени — оно уже уходит.','Chapter five. We can add. Now we subtract. Starting with your time, which is already running.'],
    6:['Глава шестая. Автоматы: схемы, которые живут по тактам и не задают лишних вопросов. Мои любимые.','Chapter six. State machines: circuits that live by the clock and ask no questions. My favourites.'],
    7:['Глава седьмая. Регистры — места, где Машина хранит важное. Я бы хранил там себя, но меня не спросили.','Chapter seven. Registers, where the Machine keeps what matters. I would keep myself there, but nobody asked.'],
    8:['Глава восьмая. АЛУ, сердце вычислений. Моё сердце — один триггер, но я не жалуюсь.','Chapter eight. The ALU, the heart of computation. My heart is a single flip-flop, but I do not complain.'],
    9:['Глава девятая. Испытания с ограничениями. Элементов мало, амбиций много. Как у меня.','Chapter nine. Trials with limits. Few gates, many ambitions. Like me.'],
    10:['Глава десятая. Пробуждение. Ещё немного — и Машина откроет глаза. Надеюсь, она меня вспомнит.','Chapter ten. Awakening. A little more and the Machine opens its eyes. I hope it remembers me.']},
  lv:{
    1:['Монтажник перепутал три провода и уволился. Записываю в протокол: «уволен за провода». Разберите, что куда идёт.','The wiring technician mixed up three cables and quit. Logging: “fired over wires”. Figure out what goes where.'],
    2:['Элемент НЕ. Говорит «нет» на всё. Мы с ним похожи. Здесь их понадобится два.','The NOT gate. It says “no” to everything. We have a lot in common. You will need two of them here.'],
    3:['Вход B — блокировка: пока он горит, лампе ничего не светит. Элемент И строгий, а с инверсией — ещё строже. Уважаю.','Input B is an inhibit line: while it is lit, the lamp gets nothing. AND is strict, and with inversion even stricter. I respect that.'],
    4:['Импликация: лампа повторяет B, а при погашенном A горит всегда. Звучит как мой трудовой контракт.','Implication: the lamp follows B, and while A is dark it is always lit. Sounds like my employment contract.'],
    5:['Соберите И-НЕ из И и НЕ. В протоколе это называется «штрих Шеффера». Звучит как приём в фехтовании.','Build NAND from AND and NOT. The log calls it the “Sheffer stroke”. Sounds like a fencing move.'],
    6:['Теперь ИЛИ-НЕ, стрелка Пирса. Настоящих стрел в лаборатории нет, я проверял.','Now NOR, the Peirce arrow. There are no real arrows in the lab. I checked.'],
    7:['Исключающее ИЛИ горит, когда входы спорят. Я бы назвал его элементом «семейный ужин».','XOR lights up when its inputs argue. I would call it the “family dinner” gate.'],
    8:['Равнозначность горит, когда входы согласны. Редкое событие. Наслаждайтесь.','XNOR lights up when the inputs agree. A rare event. Enjoy it.'],
    9:['Склад пуст, остались одни И-НЕ. Обойдёмся. Мы же профессионалы. Ну, один из нас.','Storage is empty except for NANDs. We will manage. We are professionals. Well, one of us is.'],
    10:['Два отрицания дают утверждение. Это верно и в логике, и в моих отчётах.','Two negations make an affirmation. True in logic and in my reports.'],
    11:['Закон де Моргана: переверни всё — и И станет ИЛИ. С настроением тоже работает. Не с моим.','De Morgan’s law: flip everything and AND becomes OR. Works on moods too. Not on mine.'],
    12:['Четыре И-НЕ, не больше. Испытуемый № 0000 использовал девять. Мы о нём больше не говорим.','Four NANDs, no more. Test subject No. 0000 used nine. We do not talk about him anymore.'],
    13:['Три входа, а элементы на два. Математика против вас. Но у вас есть провода.','Three inputs and two-input gates. The maths is against you. But you have wires.'],
    14:['Голосование. Лампа соглашается с большинством. Демократия в одном корпусе.','A vote. The lamp sides with the majority. Democracy in a single package.'],
    15:['Проверка чётности. Так Машина ловит ошибки в данных. А я — в ваших схемах.','Parity check. That is how the Machine catches errors in data. And how I catch them in your circuits.'],
    16:['Полусумматор. Один плюс один равно десять. Не спорьте, это двоичная система.','Half adder. One plus one equals ten. Do not argue, it is binary.'],
    17:['Полный сумматор учитывает перенос. Без переноса числа не складываются. Без вас тоже, к сожалению.','The full adder handles the carry. Numbers do not add up without it. Nor without you, regrettably.'],
    18:['Мультиплексор — стрелочник. Решает, какой сигнал пройдёт. Должность почти как у меня.','A multiplexer is a switchman. It decides which signal passes. Almost my job title.'],
    19:['Демультиплексор разводит один сигнал по двум путям. Как я делю внимание между вами и протоколом.','A demultiplexer splits one signal across two paths. Like I split my attention between you and the log.'],
    20:['Дешифратор зажигает ровно одну лампу из четырёх. Ровно одну. Я буду считать.','A decoder lights exactly one lamp of four. Exactly one. I will be counting.'],
    21:['Два бита плюс два бита. Здесь перенос — не формальность, а вопрос выживания.','Two bits plus two bits. Here the carry is not a formality, it is a matter of survival.'],
    22:['Компаратор: больше, меньше или равно? Сравнивать — моё любимое занятие. Особенно вас с другими испытуемыми.','Comparator: greater, less or equal? Comparing is my favourite pastime. Especially comparing you to other subjects.'],
    23:['Два элемента, замкнутые друг на друга, начинают помнить. Это не магия, это обратная связь. Магии не бывает, я проверял.','Two gates wired into each other start to remember. Not magic, feedback. There is no magic, I checked.'],
    24:['D-триггер запоминает D, когда такт переходит из 0 в 1. Один триггер — один бит. Как я. Отнеситесь с уважением.','A D flip-flop stores D when the clock goes from 0 to 1. One flip-flop, one bit. Like me. Show some respect.'],
    25:['Делитель частоты — триггер, который сам себе противоречит. Знакомое чувство.','A frequency divider is a flip-flop contradicting itself. A familiar feeling.'],
    26:['Счётчик. Машина считает такты. Я считаю ваши попытки. У нас обоих большие числа.','A counter. The Machine counts ticks. I count your attempts. We both have big numbers.'],
    27:['Сдвиговый регистр. Биты двигаются по очереди. Как испытуемые к моему столу.','A shift register. Bits move in line. Like test subjects queuing at my desk.'],
    28:['Детектор фронта. Лампа должна мигнуть ровно в момент включения A. Не раньше и не позже. Я замерю.','Edge detector. The lamp must blink exactly when A turns on. Not before, not after. I will measure.'],
    29:['Вычитание — почти сложение, только с заёмом. Заём, кстати, придётся вернуть.','Subtraction is almost addition, but with a borrow. The borrow, by the way, must be repaid.'],
    30:['Полный вычитатель. Заём из младшего разряда, как в столбик. Помните столбик? Я помню всё.','Full subtractor. Borrow from the lower digit, like long subtraction. Remember that? I remember everything.'],
    31:['Два числа равны, если равны все разряды. С людьми сложнее, но это не моя забота.','Two numbers are equal if every digit is equal. People are harder, but that is not my department.'],
    32:['Мультиплексор 4:1. Шесть входов, один выход, шестьдесят четыре строки проверки. Я уже предвкушаю.','4:1 multiplexer. Six inputs, one output, sixty-four rows to check. I am looking forward to it.'],
    33:['Приоритетный шифратор отвечает только самому старшему. Иерархия. Мне нравится.','A priority encoder answers only to the most senior input. Hierarchy. I like it.'],
    34:['T-триггер — выключатель: щёлк — включено, щёлк — выключено. Не щёлкайте мной.','A T flip-flop is a switch: click on, click off. Do not click me.'],
    35:['JK-триггер умеет всё: включать, выключать, переключать. Универсальный, как я. Почти.','A JK flip-flop does it all: set, reset, toggle. Versatile, like me. Almost.'],
    36:['Счётчик до трёх. Дальше трёх он не умеет. Некоторые испытуемые тоже.','A mod-3 counter. It cannot count past three. Neither can some subjects.'],
    37:['Бегущие огни, счётчик Джонсона. Красиво. Не говорите никому, что я так сказал.','Running lights, a Johnson counter. Beautiful. Do not tell anyone I said that.'],
    38:['Обратный счёт. Обычно он бывает перед чем-то важным. Не волнуйтесь. Наверное.','A countdown. It usually comes before something important. Do not worry. Probably.'],
    39:['Регистр с загрузкой пишет только по команде. Дисциплина. Наконец-то.','A load register writes only on command. Discipline. Finally.'],
    40:['Двухбитный регистр. Вдвое больше памяти, вдвое больше ответственности.','A 2-bit register. Twice the memory, twice the responsibility.'],
    41:['Делитель со сбросом. Вход R возвращает всё в ноль. Хотел бы я такой для некоторых дней.','Divider with reset. Input R returns everything to zero. I wish I had one for certain days.'],
    42:['Счётчик с разрешением считает, только когда разрешили. Я разрешаю. Пока.','A counter with enable counts only when allowed. I allow it. For now.'],
    43:['Трёхбитный счётчик, до семи. Семь, кстати, — мой любимый номер испытуемого. Не ваш.','A 3-bit counter, up to seven. Seven is my favourite subject number, by the way. Not yours.'],
    44:['Управляемый инвертор: один вход решает, говорить правду или наоборот. Не буду проводить параллели.','A controlled inverter: one input decides whether to tell the truth or the opposite. I will draw no parallels.'],
    45:['Логический блок. Код операции выбирает: И или ИЛИ. Первый настоящий шаг к АЛУ.','A logic unit. The opcode picks AND or OR. The first real step towards an ALU.'],
    46:['Сумматор-вычитатель: один и тот же разряд и складывает, и вычитает. Экономия. Одобряю.','An adder-subtractor: the same slice both adds and subtracts. Thrifty. I approve.'],
    47:['Инкремент. Прибавить единицу. Звучит просто. Звучит.','An incrementer. Add one. Sounds simple. Sounds.'],
    48:['Флаг нуля поднимается, когда ничего нет. Как моя оценка вашей первой попытки. Шучу. Почти.','The zero flag goes up when there is nothing. Like my rating of your first attempt. Joking. Mostly.'],
    49:['Больше или нет? Решает старший разряд, а младший — если старшие равны. Как в любой бюрократии.','Greater or not? The high digit decides; the low one only if the high ones tie. Like any bureaucracy.'],
    50:['Испытание: XOR из одних ИЛИ-НЕ, не больше пяти. Лимит проверяется строго. Мной.','Trial: XOR from NOR only, five at most. The limit is enforced strictly. By me.'],
    51:['Мультиплексор из четырёх И-НЕ. Испытуемый № 0000 использовал семь. Где он теперь? Неважно.','A multiplexer from four NANDs. Subject No. 0000 used seven. Where is he now? Irrelevant.'],
    52:['Большинство из И-НЕ, не больше шести. Это сложно. Я в вас… верю? Записываю как гипотезу.','Majority from NAND, six at most. It is hard. I… believe in you? Logging it as a hypothesis.'],
    53:['Полусумматор только из ИЛИ-НЕ, шесть штук. Если получится, я сделаю вид, что не удивлён.','A half adder from NOR only, six of them. If you manage it, I will pretend not to be surprised.'],
    54:['Равенство двух чисел тремя элементами. Три. Не четыре. Я считаю.','Equality of two numbers with three gates. Three. Not four. I am counting.'],
    55:['Чётность четырёх входов тремя элементами. Подумайте о форме схемы, а не только о составе.','Parity of four inputs with three gates. Think about the shape of the circuit, not just its parts.'],
    56:['Семисегментный индикатор. Машина учится показывать цифры. Скоро она сможет сообщить вам, сколько у вас ошибок.','A seven-segment display. The Machine learns to show digits. Soon it can tell you how many mistakes you made.'],
    57:['Светофор: красный, красный с жёлтым, зелёный, жёлтый. Строго по порядку. Порядок — это я.','Traffic light: red, red and yellow, green, yellow. Strictly in order. I am order.'],
    58:['Кодовый замок откроется только на 1, 0, 1. Пароль надёжный. Я его придумал.','The code lock opens only on 1, 0, 1. A secure password. I came up with it.'],
    59:['Реверсивный счётчик умеет и вперёд, и назад. Как и вы, судя по истории отмен.','An up/down counter goes both ways. Like you, judging by your undo history.'],
    60:['Счётчик команд. Последняя деталь. Соберите её — и Машина проснётся. Не волнуйтесь. Я не волнуюсь. Совсем.','The program counter. The last piece. Build it and the Machine wakes up. Do not worry. I am not worried. At all.']},
  sandbox:['Песочница. Здесь нет заданий, нет оценок и нет протокола. Шучу: протокол есть всегда.','The sandbox. No tasks, no grades and no log. Joking: there is always a log.'],
  win:[['Испытание пройдено. Записываю в протокол. Почерк у меня, кстати, идеальный.','Trial passed. Logging it. My handwriting is flawless, by the way.'],
    ['Работает. Я этого ожидал. Примерно на тридцать семь процентов.','It works. I expected that. About thirty-seven percent.'],
    ['Все строки зелёные. Мой любимый цвет. После оранжевого.','All rows are green. My favourite colour. After orange.'],
    ['Хорошо. Не отлично, но хорошо. «Отлично» я ставлю только себе.','Good. Not excellent, but good. I only give “excellent” to myself.'],
    ['Машина тихо загудела. Это значит «спасибо». Я перевожу, потому что она стесняется.','The Machine hummed quietly. That means “thank you”. I translate because it is shy.']],
  win3:[['Без подсказок и минимумом элементов. Подозрительно хорошо. Я перепроверю. Позже.','No hints and minimum gates. Suspiciously good. I will double-check. Later.'],
    ['Безупречно. Я вынужден это признать. Не привыкайте.','Flawless. I am obliged to admit it. Do not get used to it.']],
  fail:[['Красные строки — там, где вы ошиблись. Я подсветил их заботливо. Ну, почти заботливо.','The red rows are where you went wrong. I highlighted them with care. Well, almost with care.'],
    ['Не сошлось. Испытуемый № 0000 тоже начинал с ошибок. И закончил ими же.','No match. Subject No. 0000 also started with mistakes. And finished with them.'],
    ['Машина издала звук, который я не буду переводить.','The Machine made a sound I will not translate.'],
    ['Отрицательный результат — тоже результат. Отрицательный.','A negative result is still a result. A negative one.']],
  hintPre:[['Ладно. Подсказка. Заношу её в ваше личное дело:','Fine. A hint. Adding it to your file:'],
    ['Только потому, что мне скучно:','Only because I am bored:'],
    ['Слушайте внимательно, второй раз не повторю. Хотя повторю, если попросите:','Listen carefully, I will not repeat it. Well, I will if you ask:']],
  noHint:['Подсказок для песочницы не предусмотрено. Импровизируйте.','There are no hints for the sandbox. Improvise.'],
  short:{t:['Два провода на одном входе. Короткое замыкание. Чувствую запах палёной изоляции. Уберите лишний правым кликом.','Two wires on one input. Short circuit. I smell burning insulation. Remove one with a right click.'],m:'shock'},
  empty:{t:['Проверять пустую схему? Смело. Бессмысленно, но смело.','Testing an empty circuit? Bold. Pointless, but bold.'],m:'think'},
  over:{t:['Лимит элементов превышен. Правила есть правила. Особенно мои.','Element limit exceeded. Rules are rules. Especially mine.'],m:'sad'},
  idle:{t:['Вы давно ничего не делаете. Я начинаю волноваться. Не за вас, за протокол. Нажмите на меня, если нужна помощь.','You have done nothing for a while. I am getting worried. Not about you, about the log. Click me if you need help.'],m:'think'},
  mute:{t:['Без комментариев. Хорошо. Буду молчать до конца этого уровня. Громко молчать.','No comments. Fine. I will stay silent until the end of this level. Loudly silent.'],m:'sad'},
  chDone:{1:['Глава пройдена. Машина снова отличает 0 от 1. Это больше, чем умеют некоторые.','Chapter complete. The Machine tells 0 from 1 again. More than some can do.'],
    2:['Всё — из одного типа элементов. Эффективно. Мне бы так.','Everything from a single type of gate. Efficient. I wish I were.'],
    3:['Арифметический блок работает. Машина умеет считать. Я тоже, но меня никто не хвалил.','The arithmetic unit works. The Machine can count. So can I, but nobody ever praised me.'],
    4:['У Машины появилась память. Теперь она запомнит и этот день. И вас. Хорошо это или плохо — посмотрим.','The Machine has memory now. It will remember this day. And you. Whether that is good, we shall see.'],
    5:['Вычитание и коды готовы. Осталось совсем чуть-чуть. Ну, половина.','Subtraction and codes are done. Only a little left. Well, half.'],
    6:['Автоматы запущены. Они тикают. Мне это нравится больше, чем следовало бы.','The state machines are running. They tick. I like that more than I should.'],
    7:['Регистры на месте. Машина хранит числа. Я храню на вас досье.','Registers are in place. The Machine stores numbers. I store a file on you.'],
    8:['АЛУ работает. Это уже почти процессор. Я горжусь. Собой, разумеется.','The ALU works. That is almost a processor. I am proud. Of myself, naturally.'],
    9:['Испытания пройдены, причём с лимитами. Я… впечатлён. Не цитируйте меня.','Trials complete, with limits. I am… impressed. Do not quote me.'],
    10:['','']},
  final:[{t:['Все узлы на месте. Подаю питание.','All units in place. Applying power.'],m:'think'},
    {t:['…','…'],m:'shock'},
    {t:['Она работает. Машина проснулась.','It works. The Machine is awake.'],m:'happy',wave:1},
    {t:['Знаете, я долго был единственным битом здесь, который хоть что-то значил. Теперь битов миллионы.','You know, for a long time I was the only bit here that mattered at all. Now there are millions.'],m:'sad'},
    {t:['Я не скажу «спасибо». Это не по протоколу. Но я запишу. Большими буквами.','I will not say “thank you”. It is not protocol. But I will write it down. In capital letters.']},
    {t:['Песочница открыта. Заходите. Я… буду здесь.','The sandbox is open. Drop by. I… will be here.'],m:'happy'}],
  rankUp:['Новый допуск: «{r}». Поздравляю. Это не значит, что я стал добрее.','New clearance: “{r}”. Congratulations. That does not mean I am any nicer.'],
  badge:['Бейдж «{b}». Выдаю неохотно, но протокол обязывает.','Badge “{b}”. Issued reluctantly, as protocol requires.'],
  quizIntro:['Контрольное испытание. Шесть заданий: две схемы на доске и четыре вопроса. Зачёт — минимум пять. Один таймер на всё. Подсказывать не буду. Принципиально.','Checkpoint test. Six tasks: two circuits on the board and four questions. At least five to pass. One timer for everything. I will not help. On principle.'],

  AND :{n:['И','AND'],ins:2,h:40,f:i=>[i[0]&i[1]]},
  OR  :{n:['ИЛИ','OR'],ins:2,h:40,f:i=>[i[0]|i[1]]},
  NAND:{n:['И-НЕ','NAND'],ins:2,h:40,f:i=>[1-(i[0]&i[1])]},
  NOR :{n:['ИЛИ-НЕ','NOR'],ins:2,h:40,f:i=>[1-(i[0]|i[1])]},
  XOR :{n:['Искл. ИЛИ','XOR'],ins:2,h:40,f:i=>[i[0]^i[1]]},
  XNOR:{n:['Равнозн.','XNOR'],ins:2,h:40,f:i=>[1-(i[0]^i[1])]},
  DFF :{n:['D-тригг.','D flip-flop'],ins:2,h:60,seq:1}

/* ========== geometry ========== */
function nodePos(id){
  if(C.io&&C.io[id])return C.io[id];
  if(id[0]==='I'||id[0]==='O')return ioHome(id);
  return C.gates.find(g=>g.id===id);
}
function pinPos(id,k,p){
  if(id[0]==='I'){const n=nodePos(id);return{x:n.x+20,y:n.y}}
  if(id[0]==='O'){const n=nodePos(id);return{x:n.x,y:n.y}}
  const g=nodePos(id),P=gPins(g.type);
  return k==='i'?{x:g.x,y:g.y+P.i[p]}:{x:g.x+GW,y:g.y+P.o[p]};
}
function autoRoute(s,t,srcId){
  const off=(((s.y/20)%3)+3)%3*10;
  if(t.x-s.x>=40){
    const mx=Math.min(s.x+20+off,t.x-20);
    if(s.y===t.y)return[s,t];
    return[s,{x:mx,y:s.y},{x:mx,y:t.y},t];
  }
  const ax=s.x+20+off,bx=t.x-20,ym=Math.max(s.y,t.y)+60;
  return[s,{x:ax,y:s.y},{x:ax,y:ym},{x:bx,y:ym},{x:bx,y:t.y},t];
}
/* A* on a 10 px grid: shortest orthogonal path around gates, flags and lamps, with a cost per bend.
   Leaves the source pin to the right and enters the target pin from the left. Cached per layout. */
const STEP=10,BEND=6;
let routeSig='',routeMemo=new Map();
function routeObstacles(){
  const R=[],m=6;
  for(const g of C.gates)R.push([g.x-m,g.y-m,g.x+GW+m,g.y+GATES[g.type].h+m]);
  ioIns().forEach((_,i)=>{const n=nodePos('I'+i);R.push([n.x-62-m,n.y-19-m,n.x+12+m,n.y+19+m])});
  level.outs.forEach((_,i)=>{const n=nodePos('O'+i);R.push([n.x+4,n.y-22-m,n.x+56+m,n.y+22+m])});
  return R;
}
// all auto-routed wires are laid out together, in order, so a wire avoids running along another net's wire
function smartRoute(s,t){
  const sig=C.gates.map(g=>g.id+g.x+','+g.y).join(';')+'|'+C.wires.map(w=>w.from.g+w.from.p+w.to.g+w.to.p+(w.pts&&w.pts.length?'m':'')).join(';')+'|'+OUTX()+'|'+ioIns().length+'|'+level.outs.length+'|'+JSON.stringify(C.io||0);
  const key=s.x+','+s.y+'>'+t.x+','+t.y;
  if(sig!==routeSig){
    routeSig=sig;routeMemo=new Map();const nets=new Map(),G=routeGrid(C.wires.flatMap(w=>[pinPos(w.from.g,'o',w.from.p),pinPos(w.to.g,'i',w.to.p)]));
    for(const w of C.wires){if(w.pts&&w.pts.length)continue;
      const a=pinPos(w.from.g,'o',w.from.p),b=pinPos(w.to.g,'i',w.to.p),k=a.x+','+a.y+'>'+b.x+','+b.y,net=w.from.g+':'+w.from.p;
      if(routeMemo.has(k))continue;
      if(!nets.has(net))nets.set(net,nets.size+1);
      const id=nets.get(net),r=astar(a,b,id,G)||autoRoute(a,b);routeMemo.set(k,r);
      if(G)for(let i=0;i<r.length-1;i++){const p=r[i],q=r[i+1],O=p.y===q.y?G.occH:G.occV,n=Math.max(Math.abs(q.x-p.x),Math.abs(q.y-p.y))/STEP;
        for(let j=0;j<=n;j++){const x=(p.x+Math.sign(q.x-p.x)*j*STEP)/STEP-G.x0,y=(p.y+Math.sign(q.y-p.y)*j*STEP)/STEP-G.y0;
          if(x>=0&&y>=0&&x<G.W&&y<G.H&&x%1===0&&y%1===0)O[y*G.W+x]=id}}
    }
  }
  let r=routeMemo.get(key);
  if(!r){r=astar(s,t)||autoRoute(s,t);routeMemo.set(key,r)}
  return r;
}
// blocked cells for the current layout, shared by every wire routed in one pass
function routeGrid(pins){
  const R=routeObstacles();
  let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity;
  for(const p of pins){x0=Math.min(x0,p.x/STEP|0);x1=Math.max(x1,Math.ceil(p.x/STEP));y0=Math.min(y0,p.y/STEP|0);y1=Math.max(y1,Math.ceil(p.y/STEP))}
  for(const r of R){x0=Math.min(x0,Math.floor(r[0]/STEP));x1=Math.max(x1,Math.ceil(r[2]/STEP));y0=Math.min(y0,Math.floor(r[1]/STEP));y1=Math.max(y1,Math.ceil(r[3]/STEP))}
  x0-=4;x1+=4;y0-=4;y1+=4;
  const W=x1-x0+1,H=y1-y0+1,N=W*H;
  if(!(N>0)||N>400000)return null;
  const block=new Uint8Array(N);
  for(const r of R)for(let y=Math.max(y0,Math.ceil(r[1]/STEP));y<=Math.min(y1,Math.floor(r[3]/STEP));y++)
    for(let x=Math.max(x0,Math.ceil(r[0]/STEP));x<=Math.min(x1,Math.floor(r[2]/STEP));x++){
      const px=x*STEP,py=y*STEP;if(px>r[0]&&px<r[2]&&py>r[1]&&py<r[3])block[(y-y0)*W+x-x0]=1}
  return{x0,x1,y0,y1,W,H,N,block,g:new Float32Array(N*4),from:new Int32Array(N*4),occH:new Int32Array(N),occV:new Int32Array(N)};
}
function astar(s,t,net,G){
  if(s.x%STEP||s.y%STEP||t.x%STEP||t.y%STEP)return null;
  G=G||routeGrid([s,t]);if(!G)return null;
  const {x0,x1,y0,y1,W,H,N,block,g,from,occH,occV}=G;
  const sx=s.x/STEP+1,sy=s.y/STEP,tx=t.x/STEP-1,ty=t.y/STEP;
  if(sx<x0||sx>x1||tx<x0||tx>x1||sy<y0||sy>y1||ty<y0||ty>y1)return null;
  const si=(sy-y0)*W+sx-x0,ti=(ty-y0)*W+tx-x0;
  const bs=block[si],bt=block[ti];block[si]=0;block[ti]=0;
  const DX=[1,0,-1,0],DY=[0,1,0,-1];
  g.fill(Infinity);from.fill(-1);
  // binary heap in two parallel arrays (priority, state)
  const HF=[],HI=[];
  const push=(f,i)=>{let k=HF.length;HF.push(f);HI.push(i);while(k){const q=(k-1)>>1;if(HF[q]<=f)break;HF[k]=HF[q];HI[k]=HI[q];k=q}HF[k]=f;HI[k]=i};
  let popF=0;
  const pop=()=>{const top=HI[0];popF=HF[0];const f=HF.pop(),i=HI.pop(),n=HF.length;if(n){let k=0;for(;;){const l=2*k+1,r=l+1;let m=l;if(l>=n)break;if(r<n&&HF[r]<HF[l])m=r;if(HF[m]>=f)break;HF[k]=HF[m];HI[k]=HI[m];k=m}HF[k]=f;HI[k]=i}return top};
  const h=i=>{const x=i%W,y=(i/W)|0;return Math.abs(x+x0-tx)+Math.abs(y+y0-ty)+(y+y0!==ty?BEND:0)};
  g[si*4]=0;push(h(si),si*4);
  let end=-1,budget=N*3;
  while(HF.length&&budget--){
    const st=pop(),f=popF,i=st>>2,d=st&3,gc=g[st];
    if(f>gc+h(i)+1e-9)continue;
    if(i===ti){if(d===0){end=st;break}}
    const x=i%W,y=(i/W)|0;
    for(let nd=0;nd<4;nd++){
      if(nd===(d+2)%4)continue;
      const nx=x+DX[nd],ny=y+DY[nd];if(nx<0||ny<0||nx>=W||ny>=H)continue;
      const ni=ny*W+nx;if(block[ni])continue;
      let c=gc+1+(nd!==d?BEND:0)+(ni===ti&&nd!==0?BEND:0);const ns=ni*4+nd;
      const o=(nd&1?occV:occH)[ni];if(o&&o!==net)c+=8;
      if(c<g[ns]){g[ns]=c;from[ns]=st;push(c+h(ni),ns)}
    }
  }
  block[si]=bs;block[ti]=bt;
  if(end<0)return null;
  const o=[t];
  for(let st=end;st>=0;st=from[st]){const i=st>>2;o.push({x:(i%W+x0)*STEP,y:(((i/W)|0)+y0)*STEP})}
  o.push(s);
  return dedupe(o.reverse());
}
function route(s,pts,t){
  if(!pts||!pts.length)return smartRoute(s,t);
  const o=[s];let a=s;
  for(const b of pts){if(a.x!==b.x&&a.y!==b.y)o.push({x:b.x,y:a.y});o.push(b);a=b}
  if(a.x!==t.x&&a.y!==t.y)o.push({x:a.x,y:t.y});
  o.push(t);
  return dedupe(o);
}
function dedupe(o){
  const r=[o[0]];
  for(let i=1;i<o.length;i++){const p=r[r.length-1];if(p.x===o[i].x&&p.y===o[i].y)continue;r.push(o[i])}
  // merge collinear
  const m=[r[0]];
  for(let i=1;i<r.length-1;i++){const a=m[m.length-1],b=r[i],c=r[i+1];if((a.x===b.x&&b.x===c.x)||(a.y===b.y&&b.y===c.y))continue;m.push(b)}
  if(r.length>1)m.push(r[r.length-1]);
  return m;
}
function wirePts(w){return route(pinPos(w.from.g,'o',w.from.p),w.pts,pinPos(w.to.g,'i',w.to.p))}
const toD=pts=>'M'+pts.map(p=>p.x+','+p.y).join('L');
function roundD(pts,r=10){
  if(pts.length<3)return toD(pts);
  let d='M'+pts[0].x+','+pts[0].y;
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1];
    const l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y),k=Math.min(r,l1/2,l2/2);
    const p1={x:b.x+(a.x-b.x)/l1*k,y:b.y+(a.y-b.y)/l1*k},p2={x:b.x+(c.x-b.x)/l2*k,y:b.y+(c.y-b.y)/l2*k};
    d+=`L${p1.x},${p1.y}Q${b.x},${b.y} ${p2.x},${p2.y}`}
  const z=pts[pts.length-1];return d+'L'+z.x+','+z.y;
}

/* ========== simulation ========== */
function resetSim(){sim={v:{},ff:{}}}
function srcMap(){const m={};for(const w of C.wires){const k=w.to.g+':'+w.to.p;(m[k]=m[k]||[]).push(w.from.g+':'+w.from.p)}return m}
function settle(inVals){
  const v=sim.v,m=srcMap();
  inVals.forEach((x,i)=>v['I'+i+':0']=x);
  const rd=(id,p)=>{const s=m[id+':'+p];if(!s)return 0;return v[s[0]]|0};
  for(let it=0;it<80;it++){
    let ch=false;
    const caps=[];
    for(const g of C.gates)if(g.type==='DFF'){
      const st=sim.ff[g.id]||(sim.ff[g.id]={q:0,c:0});
      const c=rd(g.id,1);
      if(c&&!st.c)caps.push([st,rd(g.id,0)]);
      st.c=c;
    }
    for(const [st,d] of caps){if(st.q!==d){st.q=d;ch=true}}
    for(const g of C.gates){
      let outs;
      if(g.type==='DFF'){const st=sim.ff[g.id]||(sim.ff[g.id]={q:0,c:0});outs=[st.q,1-st.q]}
      else outs=GATES[g.type].f(gPins(g.type).i.map((_,p)=>rd(g.id,p)));
      outs.forEach((o,p)=>{const k=g.id+':'+p;if(v[k]!==o){v[k]=o;ch=true}});
    }
    if(!ch)return true;
  }
  return false;
}
function readOuts(){const m=srcMap(),o={};level.outs.forEach((k,i)=>{const s=m['O'+i+':0'];o[k]=s?(sim.v[s[0]]|0):0});return o}
function shorts(){const m=srcMap();return Object.keys(m).filter(k=>m[k].length>1)}
function vecInVals(row,c){const a=level.ins.map(k=>row.in[k]|0);if(level.clk)a.push(c);return a}

function gateSVG(type,gost,extraCls){
  const h=GATES[type].h,P=gPins(type);
  let s='';
  // stubs
  P.i.forEach(y=>s+=`<path class="gst" d="M0,${y}H12"/>`);
  P.o.forEach(y=>s+=`<path class="gst" d="M48,${y}H60"/>`);
  const inv=['NOT','NAND','NOR','XNOR'].includes(type);
  if(type==='DFF'){
    s+=`<rect class="gb" x="12" y="0" width="36" height="60" rx="7"/>`;
    if(gost){
      s+=`<path class="gst" d="M24,0V60"/><text class="gl" x="36" y="17">T</text>`;
      s+=`<text class="gl s" x="18" y="24">D</text><text class="gl s" x="18" y="44">C</text>`;
      s+=`<path class="gst" d="M12,36L17,40L12,44" style="stroke-width:1.5"/>`;
      s+=`<circle class="gb" cx="52" cy="40" r="4"/>`;
    }else{
      s+=`<text class="gl s" x="21" y="24">D</text><path class="gst" d="M12,34L19,40L12,46" style="stroke-width:1.5"/>`;
      s+=`<text class="gl s" x="40" y="24">Q</text><text class="gl s" x="40" y="44"><tspan class="ov" style="text-decoration:overline">Q</tspan></text>`;
    }
    return s;
  }
  if(gost){
    s+=`<rect class="gb" x="12" y="0" width="36" height="${h}" rx="7"/>`;
    const L={NOT:'1',AND:'&',OR:'1',NAND:'&',NOR:'1',XOR:'=1',XNOR:'=1'}[type];
    s+=`<text class="gl" x="30" y="17">${L}</text>`;
    if(inv)s+=`<circle class="gb" cx="52" cy="20" r="4"/>`;
    return s;
  }
  const e=inv?6:0;
  if(type==='NOT'){s+=`<path class="gb" d="M14,4L42,20L14,36Z"/><circle class="gb" cx="46" cy="20" r="4"/>`;return s}

/* dropping a gate onto a wire splices it in: source → gate input, gate output → old destination */
function wireUnder(gx,gy,type,skip){
  const P=gPins(type);let best=null;

    const pl=wirePts(w);
    for(let j=0;j<pl.length-1;j++){const a=pl[j],b=pl[j+1];if(a.y!==b.y)continue;
      if(Math.min(a.x,b.x)>gx+10||Math.max(a.x,b.x)<gx+50)continue;

      P.i.forEach((py,p)=>{const d=Math.abs(a.y-(gy+py));if(!best||d<best.d)best={w,p,y:a.y-py,d}});

function spliceIn(g,ins){

  if(/^Numpad\d$/.test(c))return 'Num '+c.slice(6);

/* Quine-McCluskey minimisation to a sum of products; literals join by concatenation (AB = A& B), terms by OR */
function qmPrime(n,minterms){
  const full=(1<<n)-1;
  let terms=minterms.map(b=>({b,m:full}));
  const primes=[],pseen=new Set();
  for(;;){
    const used=new Set(),nt=[],nseen=new Set();let merged=false;
    for(let i=0;i<terms.length;i++)for(let j=i+1;j<terms.length;j++){
      const a=terms[i],b=terms[j];
      if(a.m!==b.m)continue;
      const d=(a.b^b.b)&a.m;
      if(d&&!(d&(d-1))){
        const nm=a.m&~d,nb=a.b&nm,key=nb+'/'+nm;
        if(!nseen.has(key)){nseen.add(key);nt.push({b:nb,m:nm})}
        used.add(i);used.add(j);merged=true;
      }
    }
    terms.forEach((t,i)=>{if(!used.has(i)){const k=t.b+'/'+t.m;if(!pseen.has(k)){pseen.add(k);primes.push(t)}}});
    if(!merged)break;
    terms=nt;
  }
  const cov=(p,mt)=>(mt&p.m)===p.b;
  const pickT=[];
  for(const mt of minterms){const c=primes.filter(p=>cov(p,mt));if(c.length===1&&!pickT.includes(c[0]))pickT.push(c[0])}
  const covd=mt=>pickT.some(p=>cov(p,mt));
  for(const mt of minterms){
    if(covd(mt))continue;
    let best=null,bc=0;
    for(const p of primes){
      if(pickT.includes(p)||!cov(p,mt))continue;
      const c=minterms.filter(x=>!covd(x)&&cov(p,x)).length;
      if(c>bc){bc=c;best=p}
    }
    if(best)pickT.push(best);
    else{const q=primes.find(p=>cov(p,mt));if(q&&!pickT.includes(q))pickT.push(q)}
  }
  const cnt=p=>{let c=0;for(let j=0;j<n;j++)if(p.m&(1<<j))c++;return c};
  pickT.sort((a,b)=>cnt(a)-cnt(b));
  return pickT;
}
function qmExpr(n,minterms,ins){
  if(!minterms.length)return'0';
  if(minterms.length>=(1<<n))return'1';
  return qmPrime(n,minterms).map(p=>{
    const ls=[];
    for(let j=0;j<n;j++){
      const bit=1<<(n-1-j);
      if(p.m&bit)ls.push((p.b&bit)?esc(ins[j]):ov(esc(ins[j])));
    }
    return ls.join('')||'1';
  }).join(' \u2228 ');
}

/* ========== hint tiers: ready-circuit synthesis ==========
   Builds a sum-of-products circuit from the level truth table using only the gates
   the level offers. Returns null for sequential levels and impossible gate sets.
   The layout is plain columns by depth; the A* router wires it up. */
function synth(lv){
  if(lv.seq||lv.clk)return null;
  const nIn=lv.ins.length;if(!nIn)return null;
  const av=lv.gates,has=t=>av.includes(t);
  // truth vectors per output
  const bits=k=>lv.vec.map(r=>r.out[k]|0);
  // estimated term count for a truth vector (qm prime count, constants are cheap)
  function est(tt){
    const n1=tt.filter(x=>x).length,N=1<<nIn;
    if(!n1||n1===N)return 1;
    return qmPrime(nIn,tt.map((x,i)=>x?i:-1).filter(i=>i>=0)).length;
  }
  // algebraic normal form: linear iff only constants and single variables appear
  function anfLin(tt){
    const a=tt.slice();
    for(let j=0;j<nIn;j++)for(let m=0;m<(1<<nIn);m++)if(!(m&(1<<j)))a[m|(1<<j)]^=a[m];
    // a[m] is the coefficient of the monomial of bit-set m using bit j for variable (nIn-1-j)
    const vars=[];let lin=true;
    for(let m=1;m<(1<<nIn);m++){
      if(!a[m])continue;
      const pc=m.toString(2).split('1').length-1;
      if(pc>1){lin=false;break}
      for(let j=0;j<nIn;j++)if(m&(1<<j))vars.push(nIn-1-j);
    }
    if(!lin)return null;
    return{c0:a[0]|0,vars};
  }
  function attempt(flip){
    const gates=[],wires=[];let nx=1;
    const depth={},colN={};
    const need=()=>{throw 'nosynth'};
    function place(type,deps){
      const d=1+Math.max(0,...deps.map(sg=>depth[sg[0]]|0));
      const k=colN[d]=(colN[d]|0)+1;
      const x=110+d*105,y=-270+(d%2)*45+(k-1)*90;
      const id='g'+(nx++);gates.push({id,type,x,y});depth[id]=d;return id;
    }
    const wire=(f,fp,t,tp)=>wires.push({id:'w'+(nx++),from:{g:f,p:fp},to:{g:t,p:tp},pts:[]});
    const join=(sig,g)=>{wire(sig[0],sig[1],g,0);wire(sig[0],sig[1],g,1)};
    function gNOT(sig){
      let g;
      if(has('NOT')){g=place('NOT',[sig]);wire(sig[0],sig[1],g,0);return[g,0]}
      if(has('NAND')){g=place('NAND',[sig]);join(sig,g);return[g,0]}
      if(has('NOR')){g=place('NOR',[sig]);join(sig,g);return[g,0]}
      need();
    }
    function gAND2(a,b){
      let g;
      if(has('AND')){g=place('AND',[a,b]);wire(a[0],a[1],g,0);wire(b[0],b[1],g,1);return[g,0]}
      if(has('NAND')){g=place('NAND',[a,b]);wire(a[0],a[1],g,0);wire(b[0],b[1],g,1);return gNOT([g,0])}
      if(has('NOR')){const na=gNOT(a),nb=gNOT(b);g=place('NOR',[na,nb]);wire(na[0],na[1],g,0);wire(nb[0],nb[1],g,1);return[g,0]}
      if(has('OR')&&has('NOT')){const na=gNOT(a),nb=gNOT(b);g=place('OR',[na,nb]);wire(na[0],na[1],g,0);wire(nb[0],nb[1],g,1);return gNOT([g,0])}
      need();
    }
    function gOR2(a,b){
      let g;
      if(has('OR')){g=place('OR',[a,b]);wire(a[0],a[1],g,0);wire(b[0],b[1],g,1);return[g,0]}
      if(has('NAND')){const na=gNOT(a),nb=gNOT(b);g=place('NAND',[na,nb]);wire(na[0],na[1],g,0);wire(nb[0],nb[1],g,1);return[g,0]}
      if(has('NOR')){g=place('NOR',[a,b]);wire(a[0],a[1],g,0);wire(b[0],b[1],g,1);return gNOT([g,0])}
      if(has('AND')&&has('NOT')){const na=gNOT(a),nb=gNOT(b);g=place('AND',[na,nb]);wire(na[0],na[1],g,0);wire(nb[0],nb[1],g,1);return gNOT([g,0])}
      need();
    }
    function gXOR2(a,b,flipLast){
      const t=flipLast?'XNOR':'XOR';
      if(!has(t))need();
      const g=place(t,[a,b]);wire(a[0],a[1],g,0);wire(b[0],b[1],g,1);return[g,0];
    }
    const invC={};
    function lit(j,neg){
      const src=['I'+j,0];
      if(!neg)return src;
      if(!invC[j])invC[j]=gNOT(src);
      return invC[j];
    }
    function chain(fn,sigs){
      let acc=sigs[0];
      for(let i=1;i<sigs.length;i++)acc=fn(acc,sigs[i]);
      return acc;
    }
    lv.outs.forEach((k,oi)=>{
      const tt=bits(k).map(x=>flip?1-x:x);
      const lin=has('XOR')?anfLin(tt):null;
      let sig;
      if(lin){
        if(!lin.vars.length){
          if(!lin.c0)sig=chain(gOR2,[['I0',0],gNOT(['I0',0])]);
          else sig=chain(gAND2,[['I0',0],lit(0,true)]);
        }else if(lin.vars.length===1){
          sig=['I'+lin.vars[0],0];
          if(lin.c0)sig=gNOT(sig);
        }else{
          sig=['I'+lin.vars[0],0];
          let flipped=false;
          for(let i=1;i<lin.vars.length;i++){
            const last=i===lin.vars.length-1,wantFlip=last&&lin.c0&&has('XNOR');
            sig=gXOR2(sig,['I'+lin.vars[i],0],wantFlip);
            if(wantFlip)flipped=true;
          }
          if(lin.c0&&!flipped)sig=gNOT(sig);
        }
      }else{
        const mts=[];tt.forEach((x,m)=>{if(x)mts.push(m)});
        const N=1<<nIn;
        if(!mts.length)sig=gAND2(['I0',0],lit(0,true));
        else if(mts.length===N)sig=gOR2(['I0',0],lit(0,true));
        else{
          const terms=qmPrime(nIn,mts).map(p=>{
            const ls=[];
            for(let j=0;j<nIn;j++){const bit=1<<(nIn-1-j);if(p.m&bit)ls.push(lit(j,!(p.b&bit)))}
            return ls.length===1?ls[0]:chain(gAND2,ls);
          });
          sig=terms.length===1?terms[0]:chain(gOR2,terms);
        }
      }
      if(flip)sig=gNOT(sig);
      wire(sig[0],sig[1],'O'+oi,0);
    });
    return{gates,wires};
  }
  // try polarity masks, cheapest estimate first
  const nOut=lv.outs.length,masks=[];
  for(let m=0;m<(1<<nOut);m++){
    let c=0;
    lv.outs.forEach((k,oi)=>{
      const tt=bits(k);
      const direct=est(tt),comp=est(tt.map(x=>1-x))+1;
      c+=Math.min((m>>oi)&1?comp:direct,(m>>oi)&1?comp:direct);
    });
    masks.push([c,m]);
  }
  // prefer polarity with smaller estimate per output
  let pref=0;
  lv.outs.forEach((k,oi)=>{
    const tt=bits(k);
    if(est(tt.map(x=>1-x))+1<=est(tt))pref|=(1<<oi);
  });
  masks.sort((a,b)=>((a[1]===pref?-1:0)-(b[1]===pref?-1:0))||a[0]-b[0]);
  let best=null;
  for(const [,m] of masks){
    try{const r=attempt(m);if(!best||r.gates.length<best.gates.length)best=r}catch(e){}
  }
  return best;
}

/* ----- music: mains hum + generative theme; key, mode and tempo depend on the chapter ----- */
const SCALES={dor:[0,2,3,5,7,9,10],lyd:[0,2,4,6,7,9,11],min:[0,2,3,5,7,8,10],mix:[0,2,4,5,7,9,10],maj:[0,2,4,5,7,9,11]};
const CHM={1:[57,'dor',84],2:[50,'dor',80],3:[48,'lyd',90],4:[52,'min',74],5:[53,'lyd',88],6:[55,'mix',96],7:[46,'maj',86],8:[48,'min',100],9:[54,'min',70],10:[57,'maj',92]};
const PROG=[0,5,3,4];
/* moods: the theme leans towards what is happening (and how Bit reacts) and glides between states.
   Numbers ease a little every step; the scale changes only on a bar line, pads overlap, so nothing jumps. */
const MOODS={
  calm:   {dens:.25,bright:.85,tempo:.94,arp:0, bass:0, pulse:0, sc:null},
  focus:  {dens:.5, bright:1,  tempo:1,  arp:0, bass:0, pulse:0, sc:null},
  bright: {dens:.75,bright:1.7,tempo:1.06,arp:.9,bass:.2,pulse:0, sc:'lyd'},
  playful:{dens:.6, bright:1.3,tempo:1.04,arp:.2,bass:.9,pulse:0, sc:'mix'},
  low:    {dens:.2, bright:.55,tempo:.86,arp:0, bass:0, pulse:0, sc:'min'},
  tense:  {dens:.4, bright:.75,tempo:1.1, arp:0, bass:0, pulse:.9,sc:'min'}
};
const mus={ch:1,step:0,next:0,base:'focus',mood:'focus',cur:Object.assign({},MOODS.focus),sc:null,moodT:0};
function musicChapter(ch,calm){mus.ch=CHM[ch]?ch:1;mus.base=calm?'calm':'focus';if(!mus.moodT)mus.mood=mus.base}
function musicMood(m,hold=22000){
  if(!m||!MOODS[m])return;mus.mood=m;clearTimeout(mus.moodT);
  mus.moodT=setTimeout(()=>{mus.moodT=0;mus.mood=mus.base},hold);
}
const deg=(sc,root,d)=>{const s=SCALES[sc],o=Math.floor(d/7);return root+s[((d%7)+7)%7]+12*o};
function pad(f,t,dur,v){[-4,4].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;lp.type='lowpass';lp.frequency.value=700;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+1.4);g.gain.setValueAtTime(v,t+dur-1.2);g.gain.linearRampToValueAtTime(.0001,t+dur);o.connect(lp);lp.connect(g);g.connect(mBus);o.start(t);o.stop(t+dur+.05)})}
function pluck(f,t,dur,v,type){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=type;o.frequency.value=f;lp.type='lowpass';lp.frequency.setValueAtTime(f*6,t);lp.frequency.exponentialRampToValueAtTime(f*1.2,t+dur);env(g,t,.004,v,dur);o.connect(lp);lp.connect(g);g.connect(mBus);o.start(t);o.stop(t+dur+.05)}
function hum(){[[50,.010],[100,.006],[150,.003]].forEach(([f,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(mBus);o.start()})}
function playStep(st,t,root,sc0,sp){
  const bar=Math.floor(st/16),cd=PROG[bar%4],s=st%16,M=mus.cur,T=MOODS[mus.mood];
  for(const k of ['dens','bright','tempo','arp','bass','pulse'])M[k]+=(T[k]-M[k])*.035;
  if(s===0){mus.sc=T.sc||sc0;if(mLP)mLP.frequency.setTargetAtTime(2200*M.bright,t,1.5)}
  const sc=mus.sc||sc0;
  if(M.arp>.05&&s%2===0&&Math.random()<M.arp){const k=[0,2,4,7,9,7,4,2][(s/2)%8];pluck(mtof(deg(sc,root+12,cd+k)),t,.32,.022,'sine')}
  if(M.bass>.05&&(s===2||s===6||s===10||s===14)&&Math.random()<M.bass)pluck(mtof(deg(sc,root-12,cd+(s===10?4:0))),t,.16,.06,'triangle');
  if(M.pulse>.05&&s%2===1&&Math.random()<M.pulse)pluck(mtof(deg(sc,root-24,cd)),t,.09,.05,'square');
  if(s===0){[0,2,4].forEach(k=>pad(mtof(deg(sc,root,cd+k)),t,sp*16+.6,.012));pluck(mtof(deg(sc,root-12,cd)),t,.9,.07,'sine')}
  if(s===8)pluck(mtof(deg(sc,root-12,cd+4)),t,.6,.045,'sine');
  const pat=[1,0,.35,0,.7,0,.3,.15,.85,0,.4,0,.6,.2,.3,0];
  if(Math.random()<pat[s]*M.dens){const k=[0,2,4,7,9][Math.floor(Math.random()*5)];pluck(mtof(deg(sc,root+12,cd+k)),t,.4,.035,'triangle')}
  if(s%4===0){const n=AC.createBufferSource();n.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=AC.createGain();env(g,t,.001,.02,.02);n.connect(f);f.connect(g);g.connect(mBus);n.start(t,Math.random()*.5);n.stop(t+.04)}
}
function startMusic(){
  hum();mus.next=AC.currentTime+.3;
  musicT=setInterval(()=>{if(!AC||AC.state!=='running')return;const [root,sc,bpm]=CHM[mus.ch],sp=60/(bpm*mus.cur.tempo)/4;
    if(mus.next<AC.currentTime)mus.next=AC.currentTime+.05;
    while(mus.next<AC.currentTime+.3){playStep(mus.step,mus.next,root,sc,sp);mus.next+=sp;mus.step=(mus.step+1)%64}},100);
}

/* ========== palette: truth table of a gate on hover (long press on touch) ========== */
const GATE_INFO={
  NOT :{f:()=>'Y = '+ov('A'),d:['Инвертирует вход: 0 → 1, 1 → 0','Inverts the input: 0 → 1, 1 → 0']},
  AND :{f:()=>'Y = A ∧ B',d:['1, только если оба входа 1','1 only when both inputs are 1']},
  OR  :{f:()=>'Y = A ∨ B',d:['1, если хотя бы один вход 1','1 when at least one input is 1']},
  NAND:{f:()=>'Y = '+ov('A ∧ B'),d:['0, только если оба входа 1','0 only when both inputs are 1']},
  NOR :{f:()=>'Y = '+ov('A ∨ B'),d:['1, только если оба входа 0','1 only when both inputs are 0']},
  XOR :{n:['Исключающее ИЛИ','Exclusive OR'],f:()=>'Y = A ⊕ B',d:['1, если входы разные','1 when the inputs differ']},
  XNOR:{n:['Равнозначность','Equivalence'],f:()=>'Y = '+ov('A ⊕ B'),d:['1, если входы одинаковые','1 when the inputs are equal']},
  DFF :{n:['D-триггер','D flip-flop'],f:()=>'Q<sub>n+1</sub> = D',d:['По фронту C запоминает D, в остальное время хранит Q','Stores D on the rising edge of C, otherwise keeps Q']}
};
function gateTipHTML(t){
  const G=GATES[t],I=GATE_INFO[t]||{f:()=>'',d:''};
  let tb='<table class="gtt">';
  if(t==='DFF'){
    tb+='<tr><th>D</th><th>C</th><th class="sep"></th><th>Q<sub>n+1</sub></th></tr>';
    for(const [d,c,q,one] of [['0','↑','0',0],['1','↑','1',1],['×','0, 1, ↓','Q<sub>n</sub>',0]])
      tb+=`<tr><td>${d}</td><td>${c}</td><td class="sep"></td><td class="o${one?' one':''}">${q}</td></tr>`;
  }else{
    const n=G.ins,names=n===1?['A']:['A','B'];
    tb+='<tr>'+names.map(k=>`<th>${k}</th>`).join('')+'<th class="sep"></th><th>Y</th></tr>';
    for(let r=0;r<1<<n;r++){
      const ins=names.map((_,i)=>(r>>(n-1-i))&1),y=G.f(ins)[0];
      tb+='<tr>'+ins.map(v=>`<td>${v}</td>`).join('')+`<td class="sep"></td><td class="o${y?' one':''}">${y}</td></tr>`;
    }
  }
  tb+='</table>';
  const nm=I.n||G.n;
  // one card: name (hover it to see the other language), formula, table
  const other=LANG==='en'?nm[0]:G.n[1];
  return `<div class="gt-h"><b class="gt-n"><span>${tx(nm)}</span>${other&&other!==tx(nm)?`<span class="alt" lang="${LANG==='en'?'ru':'en'}">${other}</span>`:''}</b></div><div class="gt-f math">${mathHTML(I.f())}</div>${tb}`;
}
const gtip=(()=>{
  const el=document.createElement('div');el.id='gtip';el.className='zz';el.setAttribute('role','tooltip');document.body.appendChild(el);
  let cur=null,lp=null,hideT=0;
  function show(it){
    const t=it.dataset.type;if(!GATES[t])return;
    if(cur!==t){el.innerHTML=gateTipHTML(t);cur=t}
    clearTimeout(hideT);
    const z=UI(),pr=$('#palette').getBoundingClientRect(),ir=it.getBoundingClientRect(),w=el.offsetWidth*z,h=el.offsetHeight*z,g=12,m=8,tp=$('#top').getBoundingClientRect().bottom+m;
    // try every side of the palette in turn; the first one that fits on screen without covering the palette (and so the gate) wins
    const cx=clamp(ir.left+ir.width/2-w/2,m,innerWidth-w-m),cy=clamp(ir.top+ir.height/2-h/2,tp,innerHeight-h-m);
    const C=[[pr.right+g,cy],[cx,pr.top-g-h],[cx,pr.bottom+g],[pr.left-g-w,cy]];
    const fits=([x,y])=>x>=m&&y>=tp&&x+w<=innerWidth-m&&y+h<=innerHeight-m;
    const [x,y]=C.find(fits)||[clamp(pr.right+g,m,innerWidth-w-m),cy];
    el.style.left=(x/z)+'px';el.style.top=(y/z)+'px';el.classList.add('on');
  }
  function hide(){el.classList.remove('on');clearTimeout(lp&&lp.t);lp=null}
  const pal=$('#palette');
  pal.addEventListener('pointerover',e=>{if(e.pointerType!=='mouse'||ghost)return;const it=e.target.closest('.pi');if(it)show(it)});
  // a short grace period lets the mouse cross the gap to the card (to hover its name)
  pal.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse'){clearTimeout(hideT);hideT=setTimeout(hide,160)}});
  el.addEventListener('pointerenter',()=>clearTimeout(hideT));
  el.addEventListener('pointerleave',e=>{if(e.pointerType==='mouse')hide()});
  // touch: hold a gate still for a moment to see its table; letting go then does not place it
  pal.addEventListener('pointerdown',e=>{
    if(e.pointerType==='mouse'){hide();return}
    const it=e.target.closest('.pi');if(!it)return;
    lp={x:e.clientX,y:e.clientY,shown:false,t:setTimeout(()=>{if(lp){lp.shown=true;show(it)}},420)};
  });
  window.addEventListener('pointermove',e=>{if(lp&&Math.hypot(e.clientX-lp.x,e.clientY-lp.y)>8)hide()},{passive:true});
  pal.addEventListener('pointerup',()=>{if(lp&&lp.shown)ghost=null;hide()},true);
  window.addEventListener('pointerup',()=>{if(lp)hide()});
  return {hide};
})();

/* a little physics: the window swings on the point you hold it by and settles on a spring */
const PH={a:0,v:0,t:0,raf:0,el:null,stopT:0,lt:0};
function physStep(now){
  // tuned for 60 fps; scale by the real frame time so 120/144 Hz screens swing at the same speed
  const f=PH.lt?Math.min(3,Math.max(.25,(now-PH.lt)/16.67)):1;PH.lt=now;
  PH.v=(PH.v+(PH.t-PH.a)*.09*f)*Math.pow(.86,f);PH.a+=PH.v*f;
  if(PH.el)PH.el.style.rotate=PH.a.toFixed(2)+'deg';
  if(Math.abs(PH.v)>.02||Math.abs(PH.t-PH.a)>.05)PH.raf=requestAnimationFrame(physStep);
  else{PH.raf=0;PH.lt=0;PH.a=PH.t;if(PH.el){PH.el.style.rotate=PH.t?PH.t+'deg':'';if(!PH.t)PH.el.style.transformOrigin=''}}
}
function physKick(){if(!PH.raf&&!settings.calm)PH.raf=requestAnimationFrame(physStep)}

/* ========== economy: points you earn and spend ==========
   Earned (never goes down, drives the clearance rank): levels + tests + badges + warm-up + daily shift.
   Balance = earned − spent. Spent on hints and on Bit's wardrobe.

  if(k<8){const n=1+ri(15),bin=n.toString(2).padStart(4,'0');
    return{q:[`Двоичное число ${bin}<sub>2</sub>. Сколько это в десятичной системе?`,`The binary number ${bin}<sub>2</sub>. What is it in decimal?`],a:opts(n,()=>1+ri(15)),c:n}}
  if(k<9){const n=1+ri(15),bin=x=>x.toString(2).padStart(4,'0');
    const o=opts(n,()=>1+ri(15));return{q:[`Как записать число ${n} в двоичной системе?`,`How do you write ${n} in binary?`],a:o.map(bin),c:bin(n)}}
  const n=2+ri(4);
  return{q:[`Сколько строк в таблице истинности для ${n} входов?`,`How many rows does a truth table for ${n} inputs have?`],a:opts(2**n,()=>pick([2*n,n*n,2**(n+1),2**(n-1),n+2])),c:2**n};
}
const DR={q:null,answered:false,streak:0};

  el.innerHTML=`<div class="dq">${mathHTML(tx(q.q))}</div>${q.fig?figSVG(q.fig):''}

  const q=DR.q,ok=String(q.c)===b.dataset.v;DR.answered=true;
  $$('#drillQ .qb').forEach(x=>{if(x.dataset.v===String(q.c))x.classList.add('ok');else if(x===b)x.classList.add('bad');x.disabled=true});
  sfx(ok?'qok':'qbad');
  let msg;

    if(prog.st.drillDay!==today()){prog.st.drillDay=today();prog.st.drillToday=0}
    const g=Math.min(DRILL_PTS,drillLeft());
    if(g){const prevRank=rankIdx();prog.st.drill=(prog.st.drill||0)+g;prog.st.drillToday+=g;save();updHud();checkRank(prevRank);msg=ui('drillGain',{p:ptsN(g)})}
