<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Logic Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=STIX+Two+Text:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>/* Logic Lab — "lab console".
   Stone canvas with a faint grid, floating rounded cards, pill controls, graphite for structure and emphasis,
   one lime accent for logic 1 and anything switched on, coral only for faults. Big numerals with small units.
   Typeface: Onest (Cyrillic-first neo-grotesque). */
:root{
  --bg:#E6E6E1;        /* stone canvas */
  --grid:#D7D7D0; --grid2:#CBCBC3;
  --paper:#FAFAF7;     /* cards */
  --card2:#F1F1EC;     /* inset areas */
  --ink:#1A1B1D;       /* graphite */
  --ink2:#4B4D50;
  --mute:#8B8D87;
  --line:#D2D2CB;
  --acc:#DCEB3A;       /* lime: logic 1, lamps, on */
  --acc-soft:#EEF5A6;
  --acc-ink:#1A1B1D;   /* text on lime is graphite */
  --w0:#BDBEB6; --w1:#1A1B1D;
  --ok:#ECF3C2; --ok-ink:#3E4A00;
  --bad:#F7D8D0; --bad-ink:#C2412A; --coral:#E8553D;
  --r:22px; --r-s:14px;
  --shadow:0 1px 0 rgba(26,27,29,.04),0 12px 32px -16px rgba(26,27,29,.28);
  --ui:1; --ww:4;
  --font:"Onest","Golos Text",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none;touch-action:none}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
#board{position:fixed;inset:0;width:100%;height:100%;display:block;cursor:default}
#board.panning{cursor:grabbing}
#frame{display:none}
.zz{zoom:var(--ui)}

/* ---------- top bar: floating pills ---------- */
#top{position:fixed;left:16px;right:16px;top:14px;height:48px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;pointer-events:none;z-index:3}
#top>*{pointer-events:auto}
.tb{display:flex;gap:6px;align-items:center}
.tb.r{justify-content:flex-end}
.tbtn{height:40px;padding:0 16px;font-size:15px;font-weight:500;color:var(--ink);background:var(--paper);border-radius:999px;box-shadow:var(--shadow);display:inline-flex;align-items:center;gap:8px;white-space:nowrap}
.tbtn:hover{background:#fff}
.tbtn:disabled{opacity:.4;pointer-events:none;box-shadow:none}
.tbtn.primary{color:#fff;background:var(--ink);padding:0 22px}
.tbtn.primary:hover{background:#000}
#formula{height:44px;display:flex;align-items:center;padding:0 22px;border-radius:999px;background:var(--paper);box-shadow:var(--shadow);font-size:21px;font-weight:500;letter-spacing:-.01em;white-space:nowrap;pointer-events:none}
#formula:empty{display:none}
.ov{text-decoration:overline;text-decoration-thickness:1.5px;text-underline-offset:0}
#formula sub,#sheet sub,#chatText sub{font-size:.62em}
.sep{display:inline-block;width:1.3em}
.op{font-size:.82em;vertical-align:.04em;margin:0 .04em}
.lim{font-size:13px;font-weight:600;margin-left:12px;background:var(--ink);color:#fff;border-radius:999px;padding:3px 10px}
#hud{gap:10px}
#hud .hr{color:var(--ink2);font-weight:500}
#hud .hp{font-variant-numeric:tabular-nums;font-weight:600;background:var(--acc);border-radius:999px;padding:3px 10px;margin-right:-8px}

/* ---------- element toolbar ---------- */
#palette{position:fixed;left:16px;top:76px;display:flex;flex-direction:column;gap:2px;background:var(--paper);border-radius:var(--r);padding:6px;box-shadow:var(--shadow);z-index:3;max-height:calc(100vh - 100px);overflow:auto}
#palette:empty{display:none}
.pi{display:flex;flex-direction:column;align-items:center;width:72px;padding:9px 0 7px;cursor:grab;color:var(--ink2);touch-action:none;border-radius:16px}
.pi:hover{background:var(--card2);color:var(--ink)}
.pi:active{background:var(--acc)}
.pi svg{width:48px;height:30px;overflow:visible}
.pi span{font-size:11.5px;margin-top:4px;font-weight:500;text-align:center;line-height:1.15}
.pcount{margin-top:4px;font-size:13px;text-align:center;font-weight:600;padding:6px 0;border-radius:12px;background:var(--card2);font-variant-numeric:tabular-nums}
.pcount.full{background:var(--coral);color:#fff}

/* ---------- zoom ---------- */
#zoom{position:fixed;right:16px;z-index:4;display:flex;gap:4px;transition:bottom .15s}
#zoom .tbtn{height:36px;padding:0 14px;font-size:14px}

/* ---------- bottom dock ---------- */
#sheet{position:fixed;left:16px;right:16px;bottom:14px;background:var(--paper);border-radius:var(--r);box-shadow:var(--shadow);display:flex;flex-direction:column;z-index:3;overflow:hidden}
#grip{height:52px;flex:0 0 52px;display:flex;align-items:center;gap:12px;padding:0 10px 0 18px;cursor:ns-resize;touch-action:none;position:relative}
#grip::before{content:"";position:absolute;left:50%;top:6px;width:36px;height:4px;margin-left:-18px;border-radius:4px;background:var(--line)}
#lvNum{font-size:30px;font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1}
#lvTitle{font-size:19px;font-weight:600;letter-spacing:-.01em}
#lvStars{font-size:15px;letter-spacing:2px}
.st{color:var(--line)}.st.on{color:var(--ink)}
#saved{font-size:12px;color:var(--mute);opacity:0;transition:opacity .3s;display:inline-flex;align-items:center;gap:6px}
#saved::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--ink)}
#saved.on{opacity:1}
#hintBtn{margin-left:auto;height:36px;padding:0 16px;border-radius:999px;font-size:14px;font-weight:500;background:var(--card2)}
#hintBtn:hover{background:var(--acc)}
#sheetBody{flex:1;overflow:auto;display:grid;grid-template-columns:minmax(220px,1fr) auto auto;gap:10px;padding:0 10px 10px;align-items:stretch}
#task{padding:6px 8px 8px;font-size:16px;line-height:1.45;color:var(--ink2);min-width:0}
#hint{margin-top:10px;font-size:15px;color:var(--ink);background:var(--acc-soft);border-radius:var(--r-s);padding:10px 14px;display:none}
#hint.on{display:block}
#ttWrap{overflow:auto;background:var(--card2);border-radius:18px;padding:6px 10px 10px}
#ttWrap:empty{display:none}
table.tt{border-collapse:separate;border-spacing:0;font-variant-numeric:tabular-nums;font-size:15px}
.tt th{font-weight:500;color:var(--mute);padding:6px 12px;text-align:center;font-size:13px}
.tt td{padding:4px 12px;text-align:center;cursor:pointer;font-weight:500}
.tt tr td:first-child{border-radius:10px 0 0 10px}.tt tr td:last-child{border-radius:0 10px 10px 0}
.tt th.gap,.tt td.gap{box-shadow:inset 1px 0 0 var(--line)}
.tt th.n,.tt td.n{color:var(--mute);font-size:12px;padding:4px 8px}
.tt tr.live td{background:var(--paper)}
.tt tr.cur td{background:var(--ink);color:#fff}
.tt tr.ok td{background:var(--ok);color:var(--ok-ink)}
.tt tr.bad td{background:var(--bad);color:var(--bad-ink)}
.tt .act{display:inline-block;font-size:11px;line-height:16px;min-width:16px;margin-right:5px;background:var(--coral);color:#fff;border-radius:8px;font-weight:600;vertical-align:1px}
#stampTbl{display:flex;flex-direction:column;gap:8px;min-width:150px}
.met{background:var(--card2);border-radius:18px;padding:10px 14px;display:flex;flex-direction:column;justify-content:center;flex:1}
.met b{font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.met b small{font-size:13px;font-weight:500;color:var(--mute);letter-spacing:0;margin-left:3px}
.met span{font-size:12px;color:var(--mute);margin-top:4px}
.met.over{background:var(--bad)}

/* ---------- toast ---------- */
#toast{position:fixed;left:50%;top:72px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-size:14px;font-weight:500;opacity:0;transition:opacity .2s,transform .2s;pointer-events:none;max-width:90vw;text-align:center;z-index:8}
#toast.on{opacity:1}

/* ---------- result card ---------- */
#result{position:fixed;inset:0;z-index:5;display:none;align-items:center;justify-content:center;background:rgba(230,230,225,.45);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
#result.on{display:flex}
#resCard{background:var(--ink);color:#fff;border-radius:30px;padding:28px 28px 22px;width:min(440px,92vw);box-shadow:0 30px 60px -20px rgba(0,0,0,.45);animation:pop .35s cubic-bezier(.2,1.3,.4,1) both}
@keyframes pop{from{transform:translateY(16px) scale(.96);opacity:0}}
#resTitle{display:flex;align-items:center;gap:14px;font-size:30px;font-weight:600;letter-spacing:-.02em}
#resTitle::before{content:"✓";flex:0 0 52px;height:52px;border-radius:50%;background:var(--acc);color:var(--ink);display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:700}
#resTitle.bad::before{content:"!";background:var(--coral);color:#fff}
#resTitle small{display:block;font-size:13px;font-weight:400;color:#A4A6A0;letter-spacing:0;margin-top:2px}
#resSub{margin-top:20px}
#resBtns{display:flex;gap:8px;margin-top:22px;flex-wrap:wrap}
#resBtns .tbtn{background:transparent;color:#fff;box-shadow:inset 0 0 0 1.5px #4A4C50}
#resBtns .tbtn:hover{box-shadow:inset 0 0 0 1.5px #fff}
#resBtns .tbtn.primary{background:var(--acc);color:var(--ink);box-shadow:none;margin-left:auto}
.rstars{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.rs{display:flex;flex-direction:column;gap:6px;background:#26282B;border-radius:16px;padding:12px}
.rs b{width:26px;height:26px;border-radius:50%;background:#3A3C40;color:#3A3C40;display:flex;align-items:center;justify-content:center;font-size:14px}
.rs.on b{background:var(--acc);color:var(--ink)}
.rs span{font-size:12.5px;color:#A4A6A0;line-height:1.25}
.rs.on span{color:#fff}
.rmet{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px;margin-top:6px}
.rmet div{background:#26282B;border-radius:16px;padding:12px}
.rmet b{display:block;font-size:30px;font-weight:600;letter-spacing:-.03em;line-height:1;font-variant-numeric:tabular-nums}
.rmet b.hl{color:var(--acc)}
.rmet span{font-size:12px;color:#A4A6A0}
.rsub{color:#C9CBC4;font-size:15px;line-height:1.45}

/* ---------- full-screen screens ---------- */
#ov{position:fixed;inset:0;z-index:5;background-color:var(--bg);background-image:radial-gradient(var(--grid2) 1px,transparent 1.2px);background-size:22px 22px;display:none;overflow:auto}
#ov.on{display:block}
.scr{display:none;min-height:100%;padding:56px 6vw 64px}
.scr.on{display:block}
#scrMain.on{display:grid;grid-template-columns:minmax(300px,440px) minmax(0,1fr);gap:4vw;align-items:center;min-height:100vh}
.brand{font-size:clamp(56px,7.5vw,104px);font-weight:600;letter-spacing:-.045em;line-height:.9}
.brand-sub{color:var(--ink2);margin:14px 0 34px;font-size:17px;max-width:30ch}
.mlist{background:var(--paper);border-radius:28px;padding:8px;box-shadow:var(--shadow)}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;font-size:22px;font-weight:500;letter-spacing:-.01em;padding:14px 18px;border-radius:20px;color:var(--ink);text-align:left}
.mi .mm{font-size:13px;font-weight:500;color:var(--mute);background:var(--card2);border-radius:999px;padding:4px 10px}
.mi:hover,.mi:focus-visible{background:var(--ink);color:#fff;outline:none}
.mi:hover .mm,.mi:focus-visible .mm{background:#33353A;color:#D5D7D0}
.mi[data-go="continue"]{background:var(--acc)}
.mi[data-go="continue"]:hover{background:var(--ink)}
.mi.small{display:inline-flex;width:auto;font-size:15px;margin-top:24px;padding:0 18px;height:40px;background:var(--paper);border-radius:999px;box-shadow:var(--shadow)}
.mi .v{color:var(--mute)}
.scr h2{font-size:clamp(40px,5vw,64px);font-weight:600;letter-spacing:-.04em;margin-bottom:26px;line-height:1}
.about{max-width:620px;color:var(--ink2);font-size:18px;line-height:1.55;background:var(--paper);border-radius:var(--r);padding:24px 26px;box-shadow:var(--shadow)}
#machine{width:100%;max-width:700px;height:auto;overflow:visible}
#machineCap{color:var(--ink2);font-size:15px;margin-top:4px;padding-left:6px}
#tree{display:block;overflow:visible;max-width:100%}
#tree .node{cursor:pointer}
#tree .node.lock{cursor:default}
#treeTip{min-height:44px;font-size:16px;color:var(--ink);margin-top:14px;background:var(--paper);border-radius:999px;padding:12px 20px;display:inline-block;box-shadow:var(--shadow)}
#treeTip:empty{display:none}
.tm{color:var(--mute)}

/* ---------- board svg ---------- */
.w{fill:none;pointer-events:none;stroke-width:calc(var(--ww) * 1px);stroke-linejoin:round;stroke-linecap:round}
.w0{stroke:var(--w0)}
.w1{stroke:var(--w1)}
.demo .w1{stroke-dasharray:2 9;animation:flow .5s linear infinite;stroke-width:calc(var(--ww) * 1px + 1px)}
@keyframes flow{to{stroke-dashoffset:-22}}
.whit{fill:none;stroke:transparent;stroke-width:calc(var(--ww) * 1px + 12px);cursor:pointer}
.whit:hover+.wsel,.wsel.on{stroke:rgba(220,235,58,.75)}
.wsel{fill:none;stroke:transparent;stroke-width:calc(var(--ww) * 1px + 8px);pointer-events:none;stroke-linejoin:round;stroke-linecap:round}
.gb{fill:var(--paper);stroke:var(--ink);stroke-width:1.8}
.gst{stroke:var(--ink);stroke-width:1.8;fill:none;stroke-linecap:round}
.gl{font:600 15px var(--font);fill:var(--ink);text-anchor:middle}
.gl.s{font-size:11px;font-weight:500}
.gate{cursor:move}
.gate.sel .gb{fill:var(--acc-soft)}
.pin-in{fill:var(--ink)}
.pin-out{fill:var(--ink)}
.pin-hit{fill:transparent;cursor:crosshair}
.pin-hit:hover{fill:rgba(220,235,58,.6)}
.short{fill:none;pointer-events:none;stroke:var(--coral);stroke-width:3;animation:pulse .5s steps(2) infinite}
@keyframes pulse{50%{opacity:.2}}
.flag{cursor:pointer}
.lbl{font:600 15px var(--font);text-anchor:middle;dominant-baseline:central}
.jn{fill:var(--ink);pointer-events:none}
.cut{fill:none;stroke:var(--coral);stroke-width:2.5;stroke-dasharray:6 5;stroke-linecap:round}
.ghost{opacity:.55;pointer-events:none}
.tmp{opacity:.8}
.onb{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-dasharray:1 9;stroke-linecap:round;animation:flow 1s linear infinite;opacity:.5;pointer-events:none}

body.hc{--w0:#8E9089;--mute:#62645E;--ink2:#2C2E31;--line:#AFAFA7;--grid:#C4C4BC;--grid2:#B1B1A9}
body.calm *,body.calm *::before,body.calm *::after{animation:none!important;transition:none!important}
.scr.on>*{animation:rise .4s cubic-bezier(.2,.8,.3,1) both}
.scr.on>*:nth-child(2){animation-delay:.05s}.scr.on>*:nth-child(3){animation-delay:.1s}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}

/* ---------- settings ---------- */
#setList{max-width:720px}
.sgrp{font-size:13px;font-weight:600;color:var(--mute);margin:26px 0 8px 6px}
.sgrp:first-child{margin-top:0}
.sgrp+.srow{border-radius:20px 20px 0 0}
.srow{display:flex;align-items:center;gap:6px;padding:10px 10px 10px 20px;background:var(--paper);font-size:17px;font-weight:500;box-shadow:inset 0 -1px 0 var(--line)}
.srow:has(+ .sgrp),.srow:last-child{border-radius:0 0 20px 20px;box-shadow:none}
.srow .k{flex:1;color:var(--ink);cursor:pointer}
.srow .ar{width:36px;height:36px;border-radius:50%;background:var(--card2);color:var(--ink);font-size:18px;display:flex;align-items:center;justify-content:center}
.srow .ar:hover{background:var(--acc)}
.srow .val{min-width:190px;text-align:center;color:var(--ink);font-variant-numeric:tabular-nums;font-size:15px}
.sbar{display:inline-block;width:100px;height:6px;border-radius:6px;background:var(--line);vertical-align:middle;margin-right:10px;position:relative;overflow:hidden}
.sbar i{position:absolute;left:0;top:0;bottom:0;background:var(--ink);border-radius:6px}

/* ---------- Bit and the comm link ---------- */
#mascot{position:fixed;right:18px;display:flex;align-items:flex-end;gap:10px;pointer-events:none;z-index:6}
#mascot.off{display:none}
#bit{width:78px;height:98px;pointer-events:auto;cursor:pointer;flex:0 0 auto;overflow:visible;animation:bob 3.4s ease-in-out infinite;transform-origin:50% 100%}
@keyframes bob{50%{transform:translateY(-3px)}}
#bit.jump{animation:jump .55s cubic-bezier(.3,1.5,.5,1) 2}
@keyframes jump{40%{transform:translateY(-18px) scaleY(1.05)}75%{transform:translateY(0) scaleY(.93)}}
#bit.shake{animation:shake .3s 3}
@keyframes shake{25%{transform:translateX(-4px) rotate(-4deg)}75%{transform:translateX(4px) rotate(4deg)}}
#bit .eye{transform-origin:40px 42px;transform-box:view-box;animation:blink 4.6s infinite}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.08)}}
#bit .arm-r{transform-origin:66px 50px;transform-box:view-box}
#bit.wave .arm-r{animation:wave .45s ease-in-out 4}
@keyframes wave{50%{transform:rotate(-40deg)}}
#bit .m-open{animation:talk .2s steps(1) infinite}
@keyframes talk{50%{opacity:0}}
#bit .spark{animation:spark 1.2s ease-in-out infinite}
@keyframes spark{50%{opacity:.35}}
#chat{pointer-events:auto;width:min(380px,calc(100vw - 120px));background:var(--paper);border-radius:24px;box-shadow:var(--shadow),0 0 0 1px rgba(26,27,29,.04);position:relative;margin-bottom:46px;opacity:0;transform:translateY(8px) scale(.98);transform-origin:100% 100%;transition:opacity .16s,transform .16s;visibility:hidden;overflow:hidden}
#chat.on{opacity:1;transform:none;visibility:visible}
.chd{display:flex;align-items:center;gap:8px;padding:12px 10px 0 16px;font-size:13px}
.chd .cn{font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:8px}
.chd .cn::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--acc);box-shadow:0 0 0 2px var(--ink)}
.chd .cs{color:var(--mute);flex:1}
.chd button{font-size:12.5px;font-weight:500;color:var(--ink2);padding:5px 11px;border-radius:999px;background:var(--card2)}
.chd button:hover{background:var(--acc);color:var(--ink)}
#chatX{width:28px;height:28px;padding:0!important;font-size:16px!important;line-height:1}
#chatBody{padding:10px 16px 14px;font-size:16px;line-height:1.45;cursor:pointer}
#chatCh{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
#chatCh:empty{display:none}
.cbtn{text-align:left;font-size:14px;font-weight:500;color:var(--ink);padding:8px 14px;border-radius:999px;background:var(--card2)}
.cbtn:first-child{background:var(--ink);color:#fff}
.cbtn:hover,.cbtn:focus-visible{background:var(--acc);color:var(--ink);outline:none}
#chatMore{font-size:12px;color:var(--mute);text-align:right;min-height:4px}
#chatLog{display:none;max-height:min(46vh,380px);overflow:auto;padding:8px 16px 14px;font-size:14.5px;line-height:1.45;color:var(--ink2)}
#chatLog p{margin:8px 0;background:var(--card2);border-radius:14px 14px 14px 4px;padding:8px 12px}
#chatLog p.me{background:var(--ink);color:#fff;border-radius:14px 14px 4px 14px;margin-left:20%}
#chat.logon #chatLog{display:block}
#chat.logon #chatBody{display:none}

/* ---------- fx ---------- */
.fx-ring{fill:none;stroke:var(--ink);stroke-width:2;animation:ring .5s ease-out forwards;transform-box:fill-box;transform-origin:center}
.fx-ring.g{stroke:var(--mute)}
@keyframes ring{from{transform:scale(.3);opacity:.9}to{transform:scale(2.2);opacity:0}}
.fx-bit{font:700 16px var(--font);fill:var(--ink);paint-order:stroke;stroke:var(--acc);stroke-width:6px;stroke-linejoin:round;animation:floatup 1.4s cubic-bezier(.2,.7,.4,1) forwards}
@keyframes floatup{to{transform:translate(var(--dx),-90px);opacity:0}}

/* ---------- checkpoint test ---------- */
#quizBox{max-width:720px}
.qh{display:inline-flex;font-size:13px;font-weight:600;background:var(--paper);border-radius:999px;padding:7px 14px;box-shadow:var(--shadow)}
.qp{color:var(--mute);margin:18px 0 6px;font-variant-numeric:tabular-nums;font-weight:500}
.qq{font-size:clamp(28px,3.4vw,40px);line-height:1.12;letter-spacing:-.02em;margin-bottom:22px;text-wrap:balance;font-weight:600}
.qq sub,.qb sub{font-size:.62em}
.qfig{width:min(360px,100%);height:auto;display:block;margin:0 0 22px;overflow:visible;background:var(--paper);border-radius:var(--r);padding:14px}
.qv{font:600 14px var(--font);fill:var(--ink)}
.qa{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:8px}

/* ========== formula typesetting ==========
   Variables: italic serif (STIX Two). Operators: upright, with air around them; ⊕ ∨ ⊙ → ← drawn as vector glyphs
   so they match the stroke of the letters on every system. Conjunction is shown as &, as in Russian textbooks. */
const OPSVG={'⊕':'<circle cx="8" cy="8" r="6"/><path d="M8 3.4V12.6M3.4 8H12.6"/>','⊙':'<circle cx="8" cy="8" r="6"/><circle cx="8" cy="8" r="1.5" fill="currentColor" stroke="none"/>',
  '∨':'<path d="M3.2 3.6L8 12.8L12.8 3.6"/>','→':'<path d="M2 8H14M10 4.2L14 8L10 11.8"/>','←':'<path d="M14 8H2M6 4.2L2 8L6 11.8"/>'};
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function mo(c){return `<span class="mo">${OPSVG[c]?`<svg class="mos" viewBox="0 0 16 16">${OPSVG[c]}</svg>`:c}</span>`}
function mathHTML(h){
  return String(h).replace(/∧/g,'&amp;').split(/(<[^>]+>)/).map(p=>p[0]==='<'?p:p.replace(
    /&amp;|&gt;|&lt;|[⊕⊙∨→←=+−]| [?:] |(?<![A-Za-z])(?:Co|Bo|[A-Z]{1,2}|n|k)(?![A-Za-z])/g,
    m=>m==='&amp;'?mo('&amp;'):m==='&gt;'||m==='&lt;'?mo(m):/^ [?:] $/.test(m)?' '+mo(m.trim())+' ':(OPSVG[m]||'=+−'.includes(m))?mo(m):/^[A-Z]{2}$/.test(m)?m.split('').map(c=>`<i class="mv">${c}</i>`).join(''):`<i class="mv">${m}</i>`)).join('');
}

/* ========== content: Bit's voice, quizzes, badges, ranks ========== */
// Bit: the Machine's control bit. One bit of memory, considers himself the lab's supervising mind.
// Polite bureaucratic tone, keeps the "Test log", quotes dubious statistics, praises as if scolding,
// sulks when ignored. Secretly grows attached to the player; it shows in the finale.
const STORY={
  prologue:[
    {t:['Внимание. Обнаружен испытуемый. Регистрирую… регистрирую… Готово. Вы — испытуемый № 0001.','Attention. Test subject detected. Registering… registering… Done. You are test subject No. 0001.'],m:'think'},
    {t:['Я — Бит. Управляющий бит этой Машины. Да, всего один бит. Но очень, очень управляющий.','I am Bit, the control bit of this Machine. Yes, a single bit. But a very, very controlling one.'],m:'happy',wave:1},
    {t:['Этой ночью Машина погасла. Официальная версия — сбой питания. Неофициальная — кто-то сел на рубильник. Не будем показывать пальцем.','Last night the Machine went dark. Official version: power failure. Unofficial version: someone sat on the breaker. Let us not point fingers.'],m:'sad'},
    {t:['Ваша задача — пересобрать её, элемент за элементом. Я буду наблюдать, вести протокол и комментировать. В основном комментировать.','Your task is to rebuild it, gate by gate. I will observe, keep the log and comment. Mostly comment.']},
    {t:['Готовы?','Ready?'],m:'think',ch:[
      {t:['Поехали','Let’s go'],r:{t:['Прекрасно. Записываю: «испытуемый уверен в себе». Посмотрим, надолго ли. Нажмите «Продолжить».','Splendid. Logging: “subject is confident”. We will see how long that lasts. Press “Continue”.'],m:'happy'}},
      {t:['А если нет?','And if not?'],r:{t:['Отказ не предусмотрен. Я проверил. Дважды. Нажмите «Продолжить».','Refusal is not an option. I checked. Twice. Press “Continue”.'],m:'think'}}]}],
  welcome:[['С возвращением, испытуемый. Ваше отсутствие длилось слишком долго. Я считал.','Welcome back, subject. Your absence lasted far too long. I counted.'],
    ['А, это вы. Протокол уже открыт.','Ah, it’s you. The log is already open.'],
    ['Снова здравствуйте. Машина скучала. Я — нет. Почти.','Hello again. The Machine missed you. I did not. Mostly.']],
  ch:{
    1:['Испытание первое: «Основы». Машина должна снова отличать 0 от 1. Начнём с того, что умею даже я.','Trial one: “Basics”. The Machine must tell 0 from 1 again. We start with what even I can do.'],
    2:['Глава вторая. На складе остались одни элементы И-НЕ. Кто-то заказал тысячу штук. Не я. Почти наверняка не я.','Chapter two. Only NAND gates are left in storage. Someone ordered a thousand. Not me. Almost certainly not me.'],
    3:['Глава третья. Учим Машину считать. Раньше этим занимался я, но мне никто не платил.','Chapter three. We teach the Machine to count. I used to do that, but nobody paid me.'],
    4:['Глава четвёртая. Машина забывает всё через мгновение. Как испытуемые, только быстрее. Дадим ей память.','Chapter four. The Machine forgets everything in an instant. Like test subjects, only faster. Let us give it memory.'],
    5:['Глава пятая. Складывать умеем. Теперь вычитать. Начнём с вашего времени — оно уже уходит.','Chapter five. We can add. Now we subtract. Starting with your time, which is already running.'],
    6:['Глава шестая. Автоматы: схемы, которые живут по тактам и не задают лишних вопросов. Мои любимые.','Chapter six. State machines: circuits that live by the clock and ask no questions. My favourites.'],
    7:['Глава седьмая. Регистры — места, где Машина хранит важное. Я бы хранил там себя, но меня не спросили.','Chapter seven. Registers, where the Machine keeps what matters. I would keep myself there, but nobody asked.'],
    8:['Глава восьмая. АЛУ, сердце вычислений. Моё сердце — один триггер, но я не жалуюсь.','Chapter eight. The ALU, the heart of computation. My heart is a single flip-flop, but I do not complain.'],
    9:['Глава девятая. Испытания с ограничениями. Элементов мало, амбиций много. Как у меня.','Chapter nine. Trials with limits. Few gates, many ambitions. Like me.'],
    10:['Глава десятая. Пробуждение. Ещё немного — и Машина откроет глаза. Надеюсь, она меня вспомнит.','Chapter ten. Awakening. A little more and the Machine opens its eyes. I hope it remembers me.']},
  lv:{
    1:['Первый провод. Соедините флажок A с лампой Y. Это проще, чем кажется. Хотя вам, возможно, покажется сложнее.','First wire. Connect flag A to lamp Y. It is easier than it looks. Although to you it may look harder.'],
    2:['Элемент НЕ. Говорит «нет» на всё. Мы с ним похожи.','The NOT gate. It says “no” to everything. We have a lot in common.'],
    3:['Элемент И выдаёт единицу, только если оба входа согласны. Строгий. Уважаю.','AND outputs one only when both inputs agree. Strict. I respect that.'],
    4:['Элементу ИЛИ хватает одной единицы. Низкие стандарты. Но кто я такой, чтобы судить? А, точно: я тот, кто судит.','OR is happy with a single one. Low standards. But who am I to judge? Oh, right: I am the one who judges.'],
    5:['Соберите И-НЕ из И и НЕ. В протоколе это называется «штрих Шеффера». Звучит как приём в фехтовании.','Build NAND from AND and NOT. The log calls it the “Sheffer stroke”. Sounds like a fencing move.'],
    6:['Теперь ИЛИ-НЕ, стрелка Пирса. Настоящих стрел в лаборатории нет, я проверял.','Now NOR, the Peirce arrow. There are no real arrows in the lab. I checked.'],
    7:['Исключающее ИЛИ горит, когда входы спорят. Я бы назвал его элементом «семейный ужин».','XOR lights up when its inputs argue. I would call it the “family dinner” gate.'],
    8:['Равнозначность горит, когда входы согласны. Редкое событие. Наслаждайтесь.','XNOR lights up when the inputs agree. A rare event. Enjoy it.'],
    9:['Склад пуст, остались одни И-НЕ. Обойдёмся. Мы же профессионалы. Ну, один из нас.','Storage is empty except for NANDs. We will manage. We are professionals. Well, one of us is.'],
    10:['Два отрицания дают утверждение. Это верно и в логике, и в моих отчётах.','Two negations make an affirmation. True in logic and in my reports.'],
    11:['Закон де Моргана: переверни всё — и И станет ИЛИ. С настроением тоже работает. Не с моим.','De Morgan’s law: flip everything and AND becomes OR. Works on moods too. Not on mine.'],
    12:['Четыре И-НЕ, не больше. Испытуемый № 0000 использовал девять. Мы о нём больше не говорим.','Four NANDs, no more. Test subject No. 0000 used nine. We do not talk about him anymore.'],
    13:['Три входа, а элементы на два. Математика против вас. Но у вас есть провода.','Three inputs and two-input gates. The maths is against you. But you have wires.'],
    14:['Голосование. Лампа соглашается с большинством. Демократия в одном корпусе.','A vote. The lamp sides with the majority. Democracy in a single package.'],
    15:['Проверка чётности. Так Машина ловит ошибки в данных. А я — в ваших схемах.','Parity check. That is how the Machine catches errors in data. And how I catch them in your circuits.'],
    16:['Полусумматор. Один плюс один равно десять. Не спорьте, это двоичная система.','Half adder. One plus one equals ten. Do not argue, it is binary.'],
    17:['Полный сумматор учитывает перенос. Без переноса числа не складываются. Без вас тоже, к сожалению.','The full adder handles the carry. Numbers do not add up without it. Nor without you, regrettably.'],
    18:['Мультиплексор — стрелочник. Решает, какой сигнал пройдёт. Должность почти как у меня.','A multiplexer is a switchman. It decides which signal passes. Almost my job title.'],
    19:['Демультиплексор разводит один сигнал по двум путям. Как я делю внимание между вами и протоколом.','A demultiplexer splits one signal across two paths. Like I split my attention between you and the log.'],
    20:['Дешифратор зажигает ровно одну лампу из четырёх. Ровно одну. Я буду считать.','A decoder lights exactly one lamp of four. Exactly one. I will be counting.'],
    21:['Два бита плюс два бита. Здесь перенос — не формальность, а вопрос выживания.','Two bits plus two bits. Here the carry is not a formality, it is a matter of survival.'],
    22:['Компаратор: больше, меньше или равно? Сравнивать — моё любимое занятие. Особенно вас с другими испытуемыми.','Comparator: greater, less or equal? Comparing is my favourite pastime. Especially comparing you to other subjects.'],
    23:['Два элемента, замкнутые друг на друга, начинают помнить. Это не магия, это обратная связь. Магии не бывает, я проверял.','Two gates wired into each other start to remember. Not magic, feedback. There is no magic, I checked.'],
    24:['D-триггер запоминает D, когда такт переходит из 0 в 1. Один триггер — один бит. Как я. Отнеситесь с уважением.','A D flip-flop stores D when the clock goes from 0 to 1. One flip-flop, one bit. Like me. Show some respect.'],
    25:['Делитель частоты — триггер, который сам себе противоречит. Знакомое чувство.','A frequency divider is a flip-flop contradicting itself. A familiar feeling.'],
    26:['Счётчик. Машина считает такты. Я считаю ваши попытки. У нас обоих большие числа.','A counter. The Machine counts ticks. I count your attempts. We both have big numbers.'],
    27:['Сдвиговый регистр. Биты двигаются по очереди. Как испытуемые к моему столу.','A shift register. Bits move in line. Like test subjects queuing at my desk.'],
    28:['Детектор фронта. Лампа должна мигнуть ровно в момент включения A. Не раньше и не позже. Я замерю.','Edge detector. The lamp must blink exactly when A turns on. Not before, not after. I will measure.'],
    29:['Вычитание — почти сложение, только с заёмом. Заём, кстати, придётся вернуть.','Subtraction is almost addition, but with a borrow. The borrow, by the way, must be repaid.'],
    30:['Полный вычитатель. Заём из младшего разряда, как в столбик. Помните столбик? Я помню всё.','Full subtractor. Borrow from the lower digit, like long subtraction. Remember that? I remember everything.'],
    31:['Два числа равны, если равны все разряды. С людьми сложнее, но это не моя забота.','Two numbers are equal if every digit is equal. People are harder, but that is not my department.'],
    32:['Мультиплексор 4:1. Шесть входов, один выход, шестьдесят четыре строки проверки. Я уже предвкушаю.','4:1 multiplexer. Six inputs, one output, sixty-four rows to check. I am looking forward to it.'],
    33:['Приоритетный шифратор отвечает только самому старшему. Иерархия. Мне нравится.','A priority encoder answers only to the most senior input. Hierarchy. I like it.'],
    34:['T-триггер — выключатель: щёлк — включено, щёлк — выключено. Не щёлкайте мной.','A T flip-flop is a switch: click on, click off. Do not click me.'],
    35:['JK-триггер умеет всё: включать, выключать, переключать. Универсальный, как я. Почти.','A JK flip-flop does it all: set, reset, toggle. Versatile, like me. Almost.'],
    36:['Счётчик до трёх. Дальше трёх он не умеет. Некоторые испытуемые тоже.','A mod-3 counter. It cannot count past three. Neither can some subjects.'],
    37:['Бегущие огни, счётчик Джонсона. Красиво. Не говорите никому, что я так сказал.','Running lights, a Johnson counter. Beautiful. Do not tell anyone I said that.'],
    38:['Обратный счёт. Обычно он бывает перед чем-то важным. Не волнуйтесь. Наверное.','A countdown. It usually comes before something important. Do not worry. Probably.'],
    39:['Регистр с загрузкой пишет только по команде. Дисциплина. Наконец-то.','A load register writes only on command. Discipline. Finally.'],
    40:['Двухбитный регистр. Вдвое больше памяти, вдвое больше ответственности.','A 2-bit register. Twice the memory, twice the responsibility.'],
    41:['Делитель со сбросом. Вход R возвращает всё в ноль. Хотел бы я такой для некоторых дней.','Divider with reset. Input R returns everything to zero. I wish I had one for certain days.'],
    42:['Счётчик с разрешением считает, только когда разрешили. Я разрешаю. Пока.','A counter with enable counts only when allowed. I allow it. For now.'],
    43:['Трёхбитный счётчик, до семи. Семь, кстати, — мой любимый номер испытуемого. Не ваш.','A 3-bit counter, up to seven. Seven is my favourite subject number, by the way. Not yours.'],
    44:['Управляемый инвертор: один вход решает, говорить правду или наоборот. Не буду проводить параллели.','A controlled inverter: one input decides whether to tell the truth or the opposite. I will draw no parallels.'],
    45:['Логический блок. Код операции выбирает: И или ИЛИ. Первый настоящий шаг к АЛУ.','A logic unit. The opcode picks AND or OR. The first real step towards an ALU.'],
    46:['Сумматор-вычитатель: один и тот же разряд и складывает, и вычитает. Экономия. Одобряю.','An adder-subtractor: the same slice both adds and subtracts. Thrifty. I approve.'],
    47:['Инкремент. Прибавить единицу. Звучит просто. Звучит.','An incrementer. Add one. Sounds simple. Sounds.'],
    48:['Флаг нуля поднимается, когда ничего нет. Как моя оценка вашей первой попытки. Шучу. Почти.','The zero flag goes up when there is nothing. Like my rating of your first attempt. Joking. Mostly.'],
    49:['Больше или нет? Решает старший разряд, а младший — если старшие равны. Как в любой бюрократии.','Greater or not? The high digit decides; the low one only if the high ones tie. Like any bureaucracy.'],
    50:['Испытание: XOR из одних ИЛИ-НЕ, не больше пяти. Лимит проверяется строго. Мной.','Trial: XOR from NOR only, five at most. The limit is enforced strictly. By me.'],
    51:['Мультиплексор из четырёх И-НЕ. Испытуемый № 0000 использовал семь. Где он теперь? Неважно.','A multiplexer from four NANDs. Subject No. 0000 used seven. Where is he now? Irrelevant.'],
    52:['Большинство из И-НЕ, не больше шести. Это сложно. Я в вас… верю? Записываю как гипотезу.','Majority from NAND, six at most. It is hard. I… believe in you? Logging it as a hypothesis.'],
    53:['Полусумматор только из ИЛИ-НЕ, шесть штук. Если получится, я сделаю вид, что не удивлён.','A half adder from NOR only, six of them. If you manage it, I will pretend not to be surprised.'],
    54:['Равенство двух чисел тремя элементами. Три. Не четыре. Я считаю.','Equality of two numbers with three gates. Three. Not four. I am counting.'],
    55:['Чётность четырёх входов тремя элементами. Подумайте о форме схемы, а не только о составе.','Parity of four inputs with three gates. Think about the shape of the circuit, not just its parts.'],
    56:['Семисегментный индикатор. Машина учится показывать цифры. Скоро она сможет сообщить вам, сколько у вас ошибок.','A seven-segment display. The Machine learns to show digits. Soon it can tell you how many mistakes you made.'],
    57:['Светофор: красный, красный с жёлтым, зелёный, жёлтый. Строго по порядку. Порядок — это я.','Traffic light: red, red and yellow, green, yellow. Strictly in order. I am order.'],
    58:['Кодовый замок откроется только на 1, 0, 1. Пароль надёжный. Я его придумал.','The code lock opens only on 1, 0, 1. A secure password. I came up with it.'],
    59:['Реверсивный счётчик умеет и вперёд, и назад. Как и вы, судя по истории отмен.','An up/down counter goes both ways. Like you, judging by your undo history.'],
    60:['Счётчик команд. Последняя деталь. Соберите её — и Машина проснётся. Не волнуйтесь. Я не волнуюсь. Совсем.','The program counter. The last piece. Build it and the Machine wakes up. Do not worry. I am not worried. At all.']},
  sandbox:['Песочница. Здесь нет заданий, нет оценок и нет протокола. Шучу: протокол есть всегда.','The sandbox. No tasks, no grades and no log. Joking: there is always a log.'],
  win:[['Испытание пройдено. Записываю в протокол. Почерк у меня, кстати, идеальный.','Trial passed. Logging it. My handwriting is flawless, by the way.'],
    ['Работает. Я этого ожидал. Примерно на тридцать семь процентов.','It works. I expected that. About thirty-seven percent.'],
    ['Все строки зелёные. Мой любимый цвет. После оранжевого.','All rows are green. My favourite colour. After orange.'],
    ['Хорошо. Не отлично, но хорошо. «Отлично» я ставлю только себе.','Good. Not excellent, but good. I only give “excellent” to myself.'],
    ['Машина тихо загудела. Это значит «спасибо». Я перевожу, потому что она стесняется.','The Machine hummed quietly. That means “thank you”. I translate because it is shy.']],
  win3:[['Без подсказок и минимумом элементов. Подозрительно хорошо. Я перепроверю. Позже.','No hints and minimum gates. Suspiciously good. I will double-check. Later.'],
    ['Безупречно. Я вынужден это признать. Не привыкайте.','Flawless. I am obliged to admit it. Do not get used to it.']],

    ['Не сошлось. Испытуемый № 0000 тоже начинал с ошибок. И закончил ими же.','No match. Subject No. 0000 also started with mistakes. And finished with them.'],
    ['Машина издала звук, который я не буду переводить.','The Machine made a sound I will not translate.'],
    ['Отрицательный результат — тоже результат. Отрицательный.','A negative result is still a result. A negative one.']],

  short:{t:['Два провода на одном входе. Короткое замыкание. Чувствую запах палёной изоляции. Уберите лишний правым кликом.','Two wires on one input. Short circuit. I smell burning insulation. Remove one with a right click.'],m:'shock'},

  mute:{t:['Без комментариев. Хорошо. Буду молчать до конца этого уровня. Громко молчать.','No comments. Fine. I will stay silent until the end of this level. Loudly silent.'],m:'sad'},
  chDone:{1:['Глава пройдена. Машина снова отличает 0 от 1. Это больше, чем умеют некоторые.','Chapter complete. The Machine tells 0 from 1 again. More than some can do.'],
    2:['Всё — из одного типа элементов. Эффективно. Мне бы так.','Everything from a single type of gate. Efficient. I wish I were.'],
    3:['Арифметический блок работает. Машина умеет считать. Я тоже, но меня никто не хвалил.','The arithmetic unit works. The Machine can count. So can I, but nobody ever praised me.'],
    4:['У Машины появилась память. Теперь она запомнит и этот день. И вас. Хорошо это или плохо — посмотрим.','The Machine has memory now. It will remember this day. And you. Whether that is good, we shall see.'],

    ['Алгебру логики придумал Джордж Буль в середине XIX века. Обо мне он не знал, но всё равно предсказал.','George Boole devised the algebra of logic in the mid-19th century. He did not know about me, yet he predicted me.'],

/* ========== geometry ========== */
function nodePos(id){
  if(id[0]==='I'){const n=ioIns().length;return{x:0,y:ioY(n,+id.slice(1))}}
  if(id[0]==='O'){return{x:OUTX(),y:ioY(level.outs.length,+id.slice(1))}}
  return C.gates.find(g=>g.id===id);
}
function pinPos(id,k,p){
  if(id[0]==='I'){const n=nodePos(id);return{x:n.x+20,y:n.y}}
  if(id[0]==='O'){const n=nodePos(id);return{x:n.x,y:n.y}}
  const g=nodePos(id),P=gPins(g.type);
  return k==='i'?{x:g.x,y:g.y+P.i[p]}:{x:g.x+GW,y:g.y+P.o[p]};
}
function autoRoute(s,t,srcId){
  const off=(((s.y/20)%3)+3)%3*10;
  if(t.x-s.x>=40){
    const mx=Math.min(s.x+20+off,t.x-20);
    if(s.y===t.y)return[s,t];
    return[s,{x:mx,y:s.y},{x:mx,y:t.y},t];
  }
  const ax=s.x+20+off,bx=t.x-20,ym=Math.max(s.y,t.y)+60;
  return[s,{x:ax,y:s.y},{x:ax,y:ym},{x:bx,y:ym},{x:bx,y:t.y},t];
}
function route(s,pts,t){
  if(!pts||!pts.length)return autoRoute(s,t);
  const o=[s];let a=s;
  for(const b of pts){if(a.x!==b.x&&a.y!==b.y)o.push({x:b.x,y:a.y});o.push(b);a=b}
  if(a.x!==t.x&&a.y!==t.y)o.push({x:a.x,y:t.y});
  o.push(t);
  return dedupe(o);
}
function dedupe(o){
  const r=[o[0]];
  for(let i=1;i<o.length;i++){const p=r[r.length-1];if(p.x===o[i].x&&p.y===o[i].y)continue;r.push(o[i])}
  // merge collinear
  const m=[r[0]];
  for(let i=1;i<r.length-1;i++){const a=m[m.length-1],b=r[i],c=r[i+1];if((a.x===b.x&&b.x===c.x)||(a.y===b.y&&b.y===c.y))continue;m.push(b)}
  if(r.length>1)m.push(r[r.length-1]);
  return m;
}
function wirePts(w){return route(pinPos(w.from.g,'o',w.from.p),w.pts,pinPos(w.to.g,'i',w.to.p))}
const toD=pts=>'M'+pts.map(p=>p.x+','+p.y).join('L');
function roundD(pts,r=10){
  if(pts.length<3)return toD(pts);
  let d='M'+pts[0].x+','+pts[0].y;
  for(let i=1;i<pts.length-1;i++){const a=pts[i-1],b=pts[i],c=pts[i+1];
    const l1=Math.hypot(b.x-a.x,b.y-a.y),l2=Math.hypot(c.x-b.x,c.y-b.y),k=Math.min(r,l1/2,l2/2);
    const p1={x:b.x+(a.x-b.x)/l1*k,y:b.y+(a.y-b.y)/l1*k},p2={x:b.x+(c.x-b.x)/l2*k,y:b.y+(c.y-b.y)/l2*k};
    d+=`L${p1.x},${p1.y}Q${b.x},${b.y} ${p2.x},${p2.y}`}
  const z=pts[pts.length-1];return d+'L'+z.x+','+z.y;
}

/* ========== simulation ========== */
function resetSim(){sim={v:{},ff:{}}}
function srcMap(){const m={};for(const w of C.wires){const k=w.to.g+':'+w.to.p;(m[k]=m[k]||[]).push(w.from.g+':'+w.from.p)}return m}
function settle(inVals){
  const v=sim.v,m=srcMap();
  inVals.forEach((x,i)=>v['I'+i+':0']=x);
  const rd=(id,p)=>{const s=m[id+':'+p];if(!s)return 0;return v[s[0]]|0};
  for(let it=0;it<80;it++){
    let ch=false;
    const caps=[];
    for(const g of C.gates)if(g.type==='DFF'){
      const st=sim.ff[g.id]||(sim.ff[g.id]={q:0,c:0});
      const c=rd(g.id,1);
      if(c&&!st.c)caps.push([st,rd(g.id,0)]);
      st.c=c;
    }
    for(const [st,d] of caps){if(st.q!==d){st.q=d;ch=true}}
    for(const g of C.gates){
      let outs;
      if(g.type==='DFF'){const st=sim.ff[g.id]||(sim.ff[g.id]={q:0,c:0});outs=[st.q,1-st.q]}
      else outs=GATES[g.type].f(gPins(g.type).i.map((_,p)=>rd(g.id,p)));
      outs.forEach((o,p)=>{const k=g.id+':'+p;if(v[k]!==o){v[k]=o;ch=true}});
    }
    if(!ch)return true;
  }
  return false;
}
function readOuts(){const m=srcMap(),o={};level.outs.forEach((k,i)=>{const s=m['O'+i+':0'];o[k]=s?(sim.v[s[0]]|0):0});return o}
function shorts(){const m=srcMap();return Object.keys(m).filter(k=>m[k].length>1)}
function vecInVals(row,c){const a=level.ins.map(k=>row.in[k]|0);if(level.clk)a.push(c);return a}

const pinIn=(x,y)=>`<path class="pin-in" d="M${x-1},${y-5}L${x+5},${y}L${x-1},${y+5}Z"/>`;

function junctions(){
  const by={};
  for(const w of C.wires){const k=w.from.g+':'+w.from.p;(by[k]=by[k]||[]).push(wirePts(w))}
  const dots=[];
  for(const k in by){
    const L=by[k];if(L.length<2)continue;
    const cand=[];L.forEach(pl=>pl.slice(1,-1).forEach(p=>cand.push(p)));
    const seen=new Set();
    for(const P of cand){
      const key=P.x+','+P.y;if(seen.has(key))continue;seen.add(key);
      const dirs=new Set();let cnt=0;
      for(const pl of L){
        for(let i=0;i<pl.length-1;i++){
          const a=pl[i],b=pl[i+1];
          if(onSeg(P,a,b)&&!(b.x===P.x&&b.y===P.y)){
            cnt++;dirs.add(Math.sign(b.x-a.x)+':'+Math.sign(b.y-a.y));break;
          }
        }
      }
      if(cnt>=2&&dirs.size>=2)dots.push(P);
    }
  }
  return dots;
}
function onSeg(p,a,b){
  if(a.x===b.x)return p.x===a.x&&p.y>=Math.min(a.y,b.y)&&p.y<=Math.max(a.y,b.y);
  if(a.y===b.y)return p.y===a.y&&p.x>=Math.min(a.x,b.x)&&p.x<=Math.max(a.x,b.x);
  return false;
}

  }
  // level inputs (flags)
  const ins=ioIns();
  ins.forEach((k,i)=>{
    const n=nodePos('I'+i),val=v['I'+i+':0']|0,isC=level.clk&&i===ins.length-1;
    const lit=val;
    s+=`<g class="flag" data-in="${i}"><rect x="${n.x-62}" y="${n.y-19}" width="74" height="38" rx="19" fill="${lit?'var(--acc)':'var(--paper)'}" stroke="var(--ink)" stroke-width="1.8"/>`;
    s+=`<circle cx="${lit?n.x-7:n.x-43}" cy="${n.y}" r="13" fill="${lit?'var(--ink)':'var(--card2)'}" style="transition:cx .15s"/>`;
    if(isC)s+=`<path d="${lit?`M${n.x-49},${n.y+4}h4v-8h5v8h5v-8h4`:`M${n.x-13},${n.y+4}h4v-8h5v8h5v-8h4`}" fill="none" stroke="${lit?'var(--acc)':'var(--ink)'}" stroke-width="1.6"/>`;
    s+=`<text class="lbl" x="${lit?n.x-43:n.x-7}" y="${n.y}" fill="var(--ink)" style="${isC?'display:none':''}">${subS(k)}</text>`;
    s+=`<text class="lbl" x="${lit?n.x-7:n.x-43}" y="${n.y}" fill="${lit?'var(--acc)':'var(--ink2)'}" style="font-size:13px">${isC?'C':val}</text></g>`;
    s+=`<path class="gst" d="M${n.x+12},${n.y}H${n.x+20}"/>`+pinOut(n.x+20,n.y)+`<circle class="pin-hit" data-pin="I${i}|o|0" cx="${n.x+20}" cy="${n.y}" r="11"/>`;
  });
  // outputs (lamps)
  const ov_=readOuts();
  level.outs.forEach((k,i)=>{
    const n=nodePos('O'+i),val=ov_[k];
    s+=`<path class="gst" d="M${n.x},${n.y}H${n.x+10}"/>`;

    s+=`<circle cx="${n.x+28}" cy="${n.y}" r="19" fill="${val?'var(--acc)':'var(--paper)'}" stroke="var(--ink)" stroke-width="1.8"/>`;
    s+=`<text class="lbl" x="${n.x+28}" y="${n.y}" fill="var(--ink)">${subS(disp(k))}</text>`;
    s+=pinIn(n.x,n.y);
    if(sh.has('O'+i+':0'))s+=`<circle class="short" cx="${n.x}" cy="${n.y}" r="10"/>`;
    s+=`<circle class="pin-hit" data-pin="O${i}|i|0" cx="${n.x}" cy="${n.y}" r="11"/>`;
  });
  // temp wire
  if(tmp){
    const sp=pinPos(tmp.from.g,'o',tmp.from.p);

  }
  if(ghost)s+=`<g class="ghost" transform="translate(${ghost.x},${ghost.y})">${gateSVG(ghost.type,gost)}</g>`;
  if(cut&&cut.pts.length>1)s+=`<path class="cut" d="${toD(cut.pts.map(p=>({x:p.x,y:p.y})))}"/>`;
  world.innerHTML=s;
  board.classList.toggle('demo',demoOn);

/* ========== view ========== */
function fit(){
  const pts=[];ioIns().forEach((_,i)=>{const n=nodePos('I'+i);pts.push({x:n.x-70,y:n.y-40},{x:n.x+20,y:n.y+40})});
  level.outs.forEach((_,i)=>{const n=nodePos('O'+i);pts.push({x:n.x,y:n.y-40},{x:n.x+60,y:n.y+40})});
  C.gates.forEach(g=>pts.push({x:g.x,y:g.y},{x:g.x+GW,y:g.y+GATES[g.type].h}));
  const x0=Math.min(...pts.map(p=>p.x)),x1=Math.max(...pts.map(p=>p.x)),y0=Math.min(...pts.map(p=>p.y)),y1=Math.max(...pts.map(p=>p.y));
  const L=level.gates.length?$('#palette').getBoundingClientRect().right+14:16,T=Math.max($('#top').getBoundingClientRect().bottom,$('#taskCard').style.display==='none'?0:$('#taskCard').getBoundingClientRect().bottom)+14,MW=0,W=innerWidth-L-24-MW,H=innerHeight-T-(sheetH+14)*UI()-24;
  const z=clamp(Math.min(W/(x1-x0+40),H/(y1-y0+40)),.3,1.6);
  view.z=z;view.x=L+(W-(x1-x0)*z)/2-x0*z;view.y=T+(H-(y1-y0)*z)/2-y0*z;
  render();
}
function zoomAt(f,cx,cy){const nz=clamp(view.z*f,.3,3);const k=nz/view.z;view.x=cx-(cx-view.x)*k;view.y=cy-(cy-view.y)*k;view.z=nz;render()}
$('#zIn').onclick=()=>zoomAt(1.2,innerWidth/2,innerHeight/2);
$('#zOut').onclick=()=>zoomAt(1/1.2,innerWidth/2,innerHeight/2);
$('#zFit').onclick=fit;
board.addEventListener('wheel',e=>{e.preventDefault();zoomAt(Math.exp(-e.deltaY*.0015),e.clientX,e.clientY)},{passive:false});
const toW=(cx,cy)=>({x:(cx-view.x)/view.z,y:(cy-view.y)/view.z});

/* ========== interaction ========== */
const ptrs=new Map();let act=null,pinch=null;
function hitInfo(target){
  const pin=target.closest&&target.closest('[data-pin]');
  if(pin){const [g,k,p]=pin.dataset.pin.split('|');return{type:'pin',g,k,p:+p}}
  const w=target.closest&&target.closest('[data-wire]');if(w)return{type:'wire',id:w.dataset.wire};
  const gt=target.closest&&target.closest('[data-gate]');if(gt)return{type:'gate',id:gt.dataset.gate};
  const f=target.closest&&target.closest('[data-in]');if(f)return{type:'in',i:+f.dataset.in};
  return{type:'empty'};
}
function nearestOnWire(w,p){
  const pl=wirePts(w);let best=null;
  for(let i=0;i<pl.length-1;i++){
    const a=pl[i],b=pl[i+1];let q;
    if(a.x===b.x)q={x:a.x,y:clamp(snap(p.y,10),Math.min(a.y,b.y),Math.max(a.y,b.y))};
    else q={x:clamp(snap(p.x,10),Math.min(a.x,b.x),Math.max(a.x,b.x)),y:a.y};
    const d=Math.hypot(q.x-p.x,q.y-p.y);if(!best||d<best.d)best={d,q,i};
  }
  return{pt:best.q,pre:pl.slice(1,best.i+1)};
}
function startWire(from,pts,cur){tmp={from,pts:pts.map(p=>({x:p.x,y:p.y})),cur,mode:'drag'};sfx('pick')}
function finishWire(to){
  if(!tmp)return;
  const f=tmp.from;
  if(!C.wires.some(w=>w.from.g===f.g&&w.from.p===f.p&&w.to.g===to.g&&w.to.p===to.p)){
    snapshot();
    C.wires.push({id:'w'+(nextId++),from:{g:f.g,p:f.p},to:{g:to.g,p:to.p},pts:tmp.pts});
    sfx('relay');badge('FIRST_WIRE');
    tmp=null;changed();
    {const q=pinPos(to.g,'i',to.p);fxRing(q.x,q.y)}
    if(shorts().length){sfx('spark');toast(ui('shortToast'));badge('SHORT');say([STORY.short],{hint:1})}
    return;
  }
  tmp=null;render();
}
function delWire(id){snapshot();C.wires=C.wires.filter(w=>w.id!==id);sfx('remove');changed()}
function atLimit(){if(level.max&&C.gates.length>=level.max){toast(ui('limitToast',{m:level.max}));say([STORY.over],{hint:1});return true}return false}
function updCount(){const el=$('#pcount');if(el){el.textContent=C.gates.length+' / '+level.max;el.classList.toggle('full',C.gates.length>=level.max)}
  const m=$('#stampTbl');if(!m)return;
  if(level.sandbox){m.innerHTML=`<div class="met"><b>${C.gates.length}</b><span>${ui('mGates')}</span></div>`;return}
  const best=(prog.lv[level.id]||{}).g;
  m.innerHTML=`<div class="met${level.max&&C.gates.length>level.max?' over':''}"><b>${C.gates.length}${level.max?`<small>/ ${level.max}</small>`:''}</b><span>${ui('mGates')}</span></div><div class="met"><b>${level.par}${best!=null&&best<999?`<small>${ui('mYours',{n:best})}</small>`:''}</b><span>${ui('mPar')}</span></div>`;
}
function disp(k){return (LANG==='en'&&level.dl&&level.dl[k])||k}
function delGate(id){{const g=C.gates.find(x=>x.id===id);if(g)fxRing(g.x+30,g.y+20,22,1)}snapshot();C.gates=C.gates.filter(g=>g.id!==id);C.wires=C.wires.filter(w=>w.from.g!==id&&w.to.g!==id);sel=null;sfx('remove');changed()}
function segX(a,b,c,d){
  const o=(p,q,r)=>Math.sign((q.x-p.x)*(r.y-p.y)-(q.y-p.y)*(r.x-p.x));
  return o(a,b,c)!==o(a,b,d)&&o(c,d,a)!==o(c,d,b);
}
function applyCut(){
  const cp=cut.pts;const hit=[];
  for(const w of C.wires){const pl=wirePts(w);
    outer:for(let i=0;i<cp.length-1;i++)for(let j=0;j<pl.length-1;j++)if(segX(cp[i],cp[i+1],pl[j],pl[j+1])){hit.push(w.id);break outer}}
  if(hit.length){snapshot();C.wires=C.wires.filter(w=>!hit.includes(w.id));sfx('remove');cut=null;changed()}else{cut=null;render()}
}

board.addEventListener('contextmenu',e=>e.preventDefault());
board.addEventListener('pointerdown',e=>{
  if(demoOn)return;
  ensureAudio();
  ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===2){ // pinch
    const [a,b]=[...ptrs.values()];
    pinch={d:Math.hypot(a.x-b.x,a.y-b.y),cx:(a.x+b.x)/2,cy:(a.y+b.y)/2};
    if(act&&act.kind==='cut')cut=null;
    if(act&&act.kind==='wire'&&tmp&&tmp.mode==='drag')tmp=null;
    act=null;render();return;
  }
  const p=toW(e.clientX,e.clientY),h=hitInfo(e.target);
  const right=e.button===2,touch=e.pointerType==='touch';
  // click-mode wiring in progress
  if(tmp&&tmp.mode==='click'){
    if(right){tmp=null;render();return}
    if(h.type==='pin'&&h.k==='i'){finishWire(h);return}
    if(h.type==='pin'&&h.k==='o'){tmp=null;render();return}
    tmp.pts.push({x:snap(p.x,10),y:snap(p.y,10)});tmp.cur=p;render();return;
  }
  if(right){act={kind:'rclick',sx:e.clientX,sy:e.clientY,h};cut={pts:[p]};return}
  if(h.type==='pin'&&h.k==='o'){startWire({g:h.g,p:h.p},[],p);act={kind:'wire',sx:e.clientX,sy:e.clientY};render();return}
  if(h.type==='pin'&&h.k==='i'){ // pull existing wire off an input
    const w=C.wires.filter(w=>w.to.g===h.g&&w.to.p===h.p).pop();
    if(w){snapshot();C.wires=C.wires.filter(x=>x!==w);startWire(w.from,w.pts||[],p);act={kind:'wire',sx:e.clientX,sy:e.clientY,detached:true};changed();return}
    return;
  }
  if(h.type==='wire'){
    const w=C.wires.find(x=>x.id===h.id);const n=nearestOnWire(w,p);
    act={kind:'branch',sx:e.clientX,sy:e.clientY,w,n};return;
  }
  if(h.type==='gate'){
    const g=C.gates.find(x=>x.id===h.id);
    act={kind:'gate',g,ox:p.x-g.x,oy:p.y-g.y,sx:e.clientX,sy:e.clientY,moved:false};return;
  }
  if(h.type==='in'){act={kind:'toggle',i:h.i};return}
  if(touch){act={kind:'cut'};cut={pts:[p]};return}
  act={kind:'pan',sx:e.clientX,sy:e.clientY,vx:view.x,vy:view.y};board.classList.add('panning');
  if(sel){sel=null;render()}
});
window.addEventListener('pointermove',e=>{
  if(ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(pinch&&ptrs.size===2){
    const [a,b]=[...ptrs.values()],d=Math.hypot(a.x-b.x,a.y-b.y),cx=(a.x+b.x)/2,cy=(a.y+b.y)/2;
    view.x+=cx-pinch.cx;view.y+=cy-pinch.cy;zoomAt(d/pinch.d,cx,cy);pinch={d,cx,cy};return;
  }
  const p=toW(e.clientX,e.clientY);
  if(ghost){ghost.x=snap(p.x-30);ghost.y=snap(p.y-GATES[ghost.type].h/2);render();return}
  if(tmp){
    tmp.cur=p;
    const el=document.elementFromPoint(e.clientX,e.clientY);const h=el?hitInfo(el):{type:'empty'};
    hover=h.type==='pin'?h:null;render();
  }
  if(!act)return;
  const dist=act.sx!=null?Math.hypot(e.clientX-act.sx,e.clientY-act.sy):99;
  if(act.kind==='pan'){view.x=act.vx+e.clientX-act.sx;view.y=act.vy+e.clientY-act.sy;render()}
  else if(act.kind==='gate'){
    if(!act.moved&&dist>4){act.moved=true;snapshot()}
    if(act.moved){act.g.x=snap(p.x-act.ox);act.g.y=snap(p.y-act.oy);render()}
  }else if(act.kind==='branch'&&dist>5){
    startWire(act.w.from,[...act.n.pre,act.n.pt],p);act={kind:'wire',sx:act.sx,sy:act.sy,branch:true};render();
  }else if(act.kind==='cut'||act.kind==='rclick'){cut.pts.push(p);if(act.kind==='rclick'&&dist>6)act.kind='cut';render()}
});
window.addEventListener('pointerup',e=>{
  ptrs.delete(e.pointerId);
  if(pinch){if(ptrs.size<2)pinch=null;return}
  if(ghost){
    const overBoard=document.elementFromPoint(e.clientX,e.clientY)===board||board.contains(document.elementFromPoint(e.clientX,e.clientY));
    if(overBoard&&!e.target.closest?.('#palette')){if(atLimit()){ghost=null;render();return}snapshot();C.gates.push({id:'g'+(nextId++),type:ghost.type,x:ghost.x,y:ghost.y});sfx('place');fxRing(ghost.x+30,ghost.y+GATES[ghost.type].h/2,22);ghost=null;changed();gatePlaced()}
    else{ghost=null;render()}
    return;
  }
  if(!act)return;
  const a=act;act=null;board.classList.remove('panning');
  const dist=a.sx!=null?Math.hypot(e.clientX-a.sx,e.clientY-a.sy):0;
  if(a.kind==='wire'){
    const el=document.elementFromPoint(e.clientX,e.clientY),h=el?hitInfo(el):{type:'empty'};
    if(h.type==='pin'&&h.k==='i'){finishWire(h);return}
    if(dist<6&&!a.branch){tmp.mode='click';render();return}
    if(h.type==='pin'||!tmp){tmp=null;render();return}
    const p=toW(e.clientX,e.clientY);tmp.pts.push({x:snap(p.x,10),y:snap(p.y,10)});tmp.mode='click';render();return;
  }
  if(a.kind==='branch'){sel={w:a.w.id};render();return}
  if(a.kind==='gate'){if(a.moved)changed();else{sel={g:a.g.id};render()}return}
  if(a.kind==='toggle'){liveIn[a.i]^=1;rowMark=null;sfx('toggle',liveIn[a.i]);update();return}
  if(a.kind==='rclick'){
    cut=null;
    if(a.h.type==='wire')return delWire(a.h.id);
    if(a.h.type==='gate')return delGate(a.h.id);
    render();return;
  }
  if(a.kind==='cut'){applyCut();return}
});
window.addEventListener('pointercancel',e=>{ptrs.delete(e.pointerId);act=null;pinch=null;cut=null;board.classList.remove('panning')});

$('#palette').addEventListener('pointerdown',e=>{
  const it=e.target.closest('.pi');if(!it||demoOn)return;ensureAudio();
  const p=toW(e.clientX,e.clientY);ghost={type:it.dataset.type,x:snap(p.x-30),y:snap(p.y-20),sx:e.clientX,sy:e.clientY};
});
$('#palette').addEventListener('pointerup',e=>{
  const it=e.target.closest('.pi');
  if(ghost&&it&&Math.hypot(e.clientX-ghost.sx,e.clientY-ghost.sy)<6){ // tap → place at free spot
    const c=toW(innerWidth/2,(innerHeight-sheetH*UI())/2+28);let x=snap(c.x-30),y=snap(c.y-20);

/* ========== audio: everything is synthesized, no sound files ==========
   Buses: music (lab hum + generative theme per chapter), sfx (materials: relay, toggle switch,
   stamp, buzzer, spark), voice (Bit's chatter). A compressor glues the mix; sound fades when hidden. */
let AC=null,master,mBus,sBus,vBus,musicT=null,noiseBuf=null;
const mtof=m=>440*Math.pow(2,(m-69)/12);
function ensureAudio(){
  if(AC){if(AC.state==='suspended')AC.resume();return}
  try{AC=new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
  master=AC.createGain();
  const comp=AC.createDynamicsCompressor();comp.threshold.value=-20;comp.ratio.value=3;comp.attack.value=.004;comp.release.value=.2;
  master.connect(comp);comp.connect(AC.destination);
  sBus=AC.createGain();sBus.connect(master);
  vBus=AC.createGain();vBus.connect(master);
  const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;lp.Q.value=.4;
  const dl=AC.createDelay(2);dl.delayTime.value=.42;const fb=AC.createGain();fb.gain.value=.3;const dlf=AC.createBiquadFilter();dlf.type='lowpass';dlf.frequency.value=1500;
  mBus=AC.createGain();mBus.gain.value=0;mBus.connect(lp);lp.connect(master);lp.connect(dl);dl.connect(dlf);dlf.connect(fb);fb.connect(dl);dlf.connect(master);
  noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  startMusic();musicGain();
  document.addEventListener('visibilitychange',()=>{if(AC)master.gain.setTargetAtTime(document.hidden?0:1,AC.currentTime,.25)});
}
function musicGain(){if(!AC)return;const t=AC.currentTime;
  mBus.gain.setTargetAtTime(settings.musicVol/100*.9,t,.8);sBus.gain.setTargetAtTime(settings.sfxVol/100,t,.05);vBus.gain.setTargetAtTime((settings.voiceVol==null?70:settings.voiceVol)/100,t,.05)}
function env(g,t,a,peak,dur){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+dur)}
function osc(bus,type,f,t,dur,peak,a=.004,f2){const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+dur);env(g,t,a,peak,dur);o.connect(g);g.connect(bus);o.start(t);o.stop(t+dur+.05)}
function noise(bus,t,dur,peak,ft,freq,q=1,a=.002){const s=AC.createBufferSource();s.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type=ft;f.frequency.value=freq;f.Q.value=q;const g=AC.createGain();env(g,t,a,peak,dur);s.connect(f);f.connect(g);g.connect(bus);s.start(t,Math.random()*.6);s.stop(t+dur+.05)}
const SND={
  pick(){const t=AC.currentTime;noise(sBus,t,.018,.22,'highpass',4500,.8)},                                   // probe touches a pin
  relay(){const t=AC.currentTime;noise(sBus,t,.02,.55,'bandpass',3400,5);noise(sBus,t+.022,.035,.35,'bandpass',1900,7);osc(sBus,'triangle',150,t,.05,.1)}, // wire lands: relay armature + contact
  toggle(on){const t=AC.currentTime;noise(sBus,t,.025,.5,'bandpass',on?2900:2100,4);osc(sBus,'square',on?1100:700,t,.022,.035)}, // toggle switch
  place(){const t=AC.currentTime;osc(sBus,'sine',190,t,.13,.4,.002,70);noise(sBus,t,.05,.2,'lowpass',900,.7)}, // part set on the board
  remove(){const t=AC.currentTime;osc(sBus,'sine',300,t,.1,.2,.002,110);noise(sBus,t,.07,.16,'bandpass',1300,1)},
  tick(ok){const t=AC.currentTime;noise(sBus,t,.016,.3,'bandpass',ok?2500:1400,5);if(!ok)osc(sBus,'sawtooth',110,t,.1,.05)}, // one row of the test
  clock(){const t=AC.currentTime;noise(sBus,t,.012,.18,'highpass',5200,1)},
  stamp(ok){const t=AC.currentTime;
    noise(sBus,t,.11,.12,'bandpass',700,.7,.08);                      // swing
    osc(sBus,'sine',120,t+.11,.28,.8,.002,42);noise(sBus,t+.11,.09,.55,'lowpass',650,.7);noise(sBus,t+.12,.14,.16,'highpass',3200,.5); // thud on paper
    if(ok){[0,4,7,12].forEach((s,i)=>osc(sBus,'triangle',mtof(76+s),t+.34+i*.07,.9,.07,.004));osc(sBus,'sine',mtof(100),t+.62,1.6,.025,.002)} // lamps come on
    else{osc(sBus,'square',98,t+.36,.4,.05,.01);osc(sBus,'square',92.5,t+.36,.4,.045,.01)}},         // buzzer
  spark(){const t=AC.currentTime;for(let i=0;i<7;i++)noise(sBus,t+i*.028+Math.random()*.02,.025,.45,'highpass',2800+Math.random()*3500,1);osc(sBus,'sawtooth',55,t,.35,.07)},
  badge(){const t=AC.currentTime;[84,88,91,96].forEach((m,i)=>osc(sBus,'triangle',mtof(m),t+i*.055,.55,.05,.003))},
  rank(){const t=AC.currentTime;[60,64,67,72,76].forEach((m,i)=>osc(sBus,'triangle',mtof(m),t+i*.08,1,.06,.004));osc(sBus,'sine',mtof(48),t,1.4,.08,.01)},
  ui(){const t=AC.currentTime;noise(sBus,t,.012,.22,'bandpass',3600,3)},
  qok(){const t=AC.currentTime;osc(sBus,'triangle',mtof(79),t,.25,.07);osc(sBus,'triangle',mtof(84),t+.07,.35,.07)},
  qbad(){const t=AC.currentTime;osc(sBus,'square',196,t,.18,.04,.005,150)}
};
function sfx(name,a){if(!AC||!settings.sfxVol||!SND[name])return;try{SND[name](a)}catch(e){}}
// Bit's voice: short filtered square blips, pitch follows mood and the letter
function bitVoice(ch,mood){
  if(!AC||!(settings.voiceVol==null?70:settings.voiceVol)||!/[a-zа-яё0-9]/i.test(ch))return;
  const t=AC.currentTime,base={happy:430,smug:250,sad:190,shock:520,think:300}[mood]||290,f=base*(1+(ch.toLowerCase().charCodeAt(0)*7%12)/36);
  const o=AC.createOscillator(),g=AC.createGain(),bp=AC.createBiquadFilter();o.type='square';o.frequency.setValueAtTime(f,t);o.frequency.exponentialRampToValueAtTime(f*.92,t+.05);
  bp.type='bandpass';bp.frequency.value=f*2.6;bp.Q.value=3;env(g,t,.004,.09,.05);o.connect(bp);bp.connect(g);g.connect(vBus);o.start(t);o.stop(t+.08);
}

/* ----- music: mains hum + generative theme; key, mode and tempo depend on the chapter ----- */
const SCALES={dor:[0,2,3,5,7,9,10],lyd:[0,2,4,6,7,9,11],min:[0,2,3,5,7,8,10],mix:[0,2,4,5,7,9,10],maj:[0,2,4,5,7,9,11]};
const CHM={1:[57,'dor',84],2:[50,'dor',80],3:[48,'lyd',90],4:[52,'min',74],5:[53,'lyd',88],6:[55,'mix',96],7:[46,'maj',86],8:[48,'min',100],9:[54,'min',70],10:[57,'maj',92]};
const PROG=[0,5,3,4];
const mus={ch:1,step:0,next:0,dens:.55};
function musicChapter(ch,calm){mus.ch=CHM[ch]?ch:1;mus.dens=calm?.25:.55}
const deg=(sc,root,d)=>{const s=SCALES[sc],o=Math.floor(d/7);return root+s[((d%7)+7)%7]+12*o};
function pad(f,t,dur,v){[-4,4].forEach(dt=>{const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type='sawtooth';o.frequency.value=f;o.detune.value=dt;lp.type='lowpass';lp.frequency.value=700;
  g.gain.setValueAtTime(.0001,t);g.gain.linearRampToValueAtTime(v,t+1.4);g.gain.setValueAtTime(v,t+dur-1.2);g.gain.linearRampToValueAtTime(.0001,t+dur);o.connect(lp);lp.connect(g);g.connect(mBus);o.start(t);o.stop(t+dur+.05)})}
function pluck(f,t,dur,v,type){const o=AC.createOscillator(),g=AC.createGain(),lp=AC.createBiquadFilter();o.type=type;o.frequency.value=f;lp.type='lowpass';lp.frequency.setValueAtTime(f*6,t);lp.frequency.exponentialRampToValueAtTime(f*1.2,t+dur);env(g,t,.004,v,dur);o.connect(lp);lp.connect(g);g.connect(mBus);o.start(t);o.stop(t+dur+.05)}
function hum(){[[50,.010],[100,.006],[150,.003]].forEach(([f,v])=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(mBus);o.start()})}
function playStep(st,t,root,sc,sp){
  const bar=Math.floor(st/16),cd=PROG[bar%4],s=st%16;
  if(s===0){[0,2,4].forEach(k=>pad(mtof(deg(sc,root,cd+k)),t,sp*16+.6,.012));pluck(mtof(deg(sc,root-12,cd)),t,.9,.07,'sine')}
  if(s===8)pluck(mtof(deg(sc,root-12,cd+4)),t,.6,.045,'sine');
  const pat=[1,0,.35,0,.7,0,.3,.15,.85,0,.4,0,.6,.2,.3,0];
  if(Math.random()<pat[s]*mus.dens){const k=[0,2,4,7,9][Math.floor(Math.random()*5)];pluck(mtof(deg(sc,root+12,cd+k)),t,.4,.035,'triangle')}
  if(s%4===0){const n=AC.createBufferSource();n.buffer=noiseBuf;const f=AC.createBiquadFilter();f.type='highpass';f.frequency.value=6000;const g=AC.createGain();env(g,t,.001,.02,.02);n.connect(f);f.connect(g);g.connect(mBus);n.start(t,Math.random()*.5);n.stop(t+.04)}
}
function startMusic(){
  hum();mus.next=AC.currentTime+.3;
  musicT=setInterval(()=>{if(!AC||AC.state!=='running')return;const [root,sc,bpm]=CHM[mus.ch],sp=60/bpm/4;
    if(mus.next<AC.currentTime)mus.next=AC.currentTime+.05;
    while(mus.next<AC.currentTime+.3){playStep(mus.step,mus.next,root,sc,sp);mus.next+=sp;mus.step=(mus.step+1)%64}},100);
}

function giveHint(){

  if(!hintUsed){hintUsed=true;prog.st.hints=(prog.st.hints||0)+1;save()}

/* ========== fx ========== */
const NS='http://www.w3.org/2000/svg';
function fxRing(x,y,r=14,grey){if(settings.calm)return;const c=document.createElementNS(NS,'circle');c.setAttribute('cx',x);c.setAttribute('cy',y);c.setAttribute('r',r);c.setAttribute('class','fx-ring'+(grey?' g':''));fxG.appendChild(c);setTimeout(()=>c.remove(),650)}
function fxBits(x,y){if(settings.calm)return;for(let i=0;i<7;i++){const e=document.createElementNS(NS,'text');e.textContent=Math.random()<.65?'1':'0';e.setAttribute('x',x-5+(Math.random()-.5)*20);e.setAttribute('y',y+5);e.setAttribute('class','fx-bit');e.style.setProperty('--dx',((Math.random()-.5)*70)+'px');e.style.animationDelay=(i*.07)+'s';fxG.appendChild(e);setTimeout(()=>e.remove(),1700+i*70)}}

/* ========== progress: stars, points, clearance ========== */
// Stars per level (bit mask): 1 solved, 2 solved without a hint, 4 solved with ≤ par gates.
function starsHTML(s){return [1,2,4].map(b=>`<span class="st${s&b?' on':''}">${s&b?'★':'☆'}</span>`).join('')}
const lvPts=s=>s?100+(s&2?50:0)+(s&4?50:0):0;
const quizPts=q=>q&&q.pass?q.best*20+(q.best===5?50:0):0;
function points(){let p=0;for(const id in prog.lv)p+=lvPts(prog.lv[id].s);for(const c in prog.quiz)p+=quizPts(prog.quiz[c]);return p}
function rankIdx(p=points()){let r=0;RANKS.forEach((x,i)=>{if(p>=x[0])r=i});return r}
const quizPassed=ch=>!!(prog.quiz[ch]&&prog.quiz[ch].pass);
const available=l=>l.req.every(r=>typeof r==='string'?quizPassed(+r.slice(1)):done.has(r));
const chapterDone=ch=>LV.filter(l=>l.ch===ch).every(l=>done.has(l.id));
function updHud(){const p=points();$('#hud').innerHTML=`<span class="hr">${tx(RANKS[rankIdx(p)][1])}</span><span class="hp">${num(p)}</span>`}
function savedPing(){const el=$('#saved');if(!el)return;el.classList.add('on');clearTimeout(savedPing.t);savedPing.t=setTimeout(()=>el.classList.remove('on'),1400)}

function onSolved(){
  const id=level.id,first=!done.has(id),prevRank=rankIdx(),old=prog.lv[id]||{s:0,g:999};
  const bits=1|(hintUsed?0:2)|(C.gates.length<=level.par?4:0);
  const ns=old.s|bits,gain=lvPts(ns)-lvPts(old.s);
  prog.lv[id]={s:ns,g:Math.min(old.g,C.gates.length)};
  done.add(id);save();updHud();$('#lvStars').innerHTML=starsHTML(ns);
  const chDone=first&&chapterDone(level.ch);
  const nx=nextLevel();
  const btns=[{t:ui('stay')},{t:ui('levels'),f:()=>openMenu('levels')}];
  if(chapterDone(level.ch)&&!quizPassed(level.ch))btns.push({t:ui('toQuiz'),p:1,f:()=>openQuiz(level.ch)});
  else if(nx)btns.push({t:ui('next'),p:1,f:()=>loadLevel(nx)});
  const crit=[[ui('cSolved'),''],[ui('cNoHint'),ui('whyHint')],[ui('cPar',{p:level.par}),ui('whyPar',{n:C.gates.length})]];
  showCard(true,ui('correct'),
    `<div class="rcrit">${[1,2,4].map((b,i)=>`<div class="rc${bits&b?' on':''}"><i>${bits&b?'✓':''}</i><span>${crit[i][0]}</span><em>${bits&b?'':crit[i][1]}</em></div>`).join('')}</div>
     <div class="rmet"><div><b class="${C.gates.length<=level.par?'hl':''}">${C.gates.length}</b><span>${ui('mGates')}</span></div><div><b>${level.par}</b><span>${ui('mPar')}</span></div><div><b class="hl">+${gain}</b><span>${ui('points').toLowerCase()}</span></div></div>`,btns);
  const lines=[{t:pick(bits===7?STORY.win3:STORY.win),m:bits===7?'smug':'happy'}];
  if(chDone){if(level.ch===10)lines.push(...STORY.final);else lines.push({t:STORY.chDone[level.ch],m:'happy'})}
  say(lines);
  badge('FIRST_LEVEL');
  if(chDone)badge('CH_'+level.ch);
  if(chapterDone(level.ch)&&LV.filter(l=>l.ch===level.ch).every(l=>(prog.lv[l.id]||{}).s&2))badge('NO_HINTS');
  const three=Object.values(prog.lv).filter(x=>x.s===7).length;
  if(three>=10)badge('OPTIMAL_10');if(three>=LV.length)badge('STARS_ALL');
  if(new Date().getHours()<5)badge('NIGHT');
  if(C.gates.length>=3&&Date.now()-levelStart<60000)badge('FAST');
  checkRank(prevRank);
}
function onFailed(f,n){
  showCard(false,ui('mismatch'),`<div class="rmet"><div><b class="hl" style="color:var(--coral)">${f}</b><span>${ui('mRowsBad')}</span></div><div><b>${n-f}</b><span>${ui('mRowsOk')}</span></div><div><b>${n}</b><span>${ui('mRows')}</span></div></div>`,[{t:ui('fix'),p:1}]);
  say([{t:pick(STORY.fail),m:'sad',ch:[{t:hintUsed?UIS.cHintFree:UIS.cHelp,f:giveHint},{t:UIS.cSelf,r:{t:UIS.selfR,m:'smug'}}]}]);
}
function nextLevel(){return LV.find(l=>l.id>level.id&&available(l)&&!done.has(l.id))||LV.find(l=>available(l)&&!done.has(l.id))}
function showCard(ok,title,html,btns){

  st.innerHTML=`<span>${title}<small>${tx(level.t)}${level.sandbox?'':', '+(LANG==='en'?'level ':'уровень ')+level.id}</small></span>`;$('#resSub').innerHTML=html;

function checkRank(prev){const r=rankIdx();if(r>prev){toast(ui('rankToast',{r:tx(RANKS[r][1])}));setTimeout(()=>sfx('rank'),900);sayMore([{t:fmt(tx(STORY.rankUp),{r:tx(RANKS[r][1])}),m:'happy',wave:1}]);if(r===RANKS.length-1)badge('RANK_MAX')}}

let QZ=null;
function openQuiz(ch){
  if(!chapterDone(ch)){toast(ui('qLocked'));return}
  const qs=QUIZ[ch].slice().sort(()=>Math.random()-.5).slice(0,5).map(q=>({q,order:q.a.map((_,i)=>i).sort(()=>Math.random()-.5)}));
  QZ={ch,qs,i:0,score:0,answered:false};

}
function figSVG(f){
  const P=gPins(f.g);
  let s=`<svg class="qfig" viewBox="-74 -8 196 56">`;
  P.i.forEach((y,i)=>{s+=`<text x="-14" y="${y+5}" text-anchor="end" class="qv">${'AB'[i]} = ${f.v[i]}</text><path d="M-10,${y}H0" class="gst"/>`});
  s+=gateSVG(f.g,settings.gost)+`<path d="M60,20H72" class="gst"/><text x="78" y="26" class="qv">Y = ?</text></svg>`;
  return s;
}
function drawQuiz(){
  const z=QZ,el=$('#quizBox');
  if(z.i>=z.qs.length){
    const old=prog.quiz[z.ch]||{best:0,pass:false},prevRank=rankIdx(),pass=z.score>=4;
    const before=quizPts(old);prog.quiz[z.ch]={best:Math.max(old.best,z.score),pass:old.pass||pass};
    const gain=quizPts(prog.quiz[z.ch])-before;save();updHud();
    el.innerHTML=`<div class="qh">${ui('quizTitle',{n:z.ch})}</div><div class="qres ${pass?'ok':'bad'}">${pass?ui('qPass'):ui('qFail')}</div>
      <div class="qscore">${ui('qScore',{s:z.score,n:z.qs.length})}</div><div class="rpts">${gain?ui('pts',{p:gain}):''}</div>
      <div class="qact"><button class="mi" id="qRetry">${ui('qRetry')}</button><button class="mi" id="qBack">${ui('levels')}</button></div>`;
    $('#qRetry').onclick=()=>openQuiz(z.ch);$('#qBack').onclick=()=>openMenu('levels');
    if(pass){badge('QUIZ_FIRST');if(z.score===5)badge('QUIZ_PERFECT');if(CHAPTERS.every((_,i)=>quizPassed(i+1)))badge('QUIZ_ALL')}
    say([{t:pass?(z.score===5?STORY.quizPerfect:STORY.quizPass):STORY.quizFail,m:pass?'happy':'sad'}],{u:1});
    checkRank(prevRank);
    return;
  }
  const {q,order}=z.qs[z.i];z.answered=false;
  el.innerHTML=`<div class="qh">${ui('quizTitle',{n:z.ch})}. ${tx(CHAPTERS[z.ch-1])}</div><div class="qp">${ui('qOf',{i:z.i+1,n:z.qs.length})}</div>
    <div class="qq">${mathHTML(tx(q.q))}</div>${q.fig?figSVG(q.fig):''}
    <div class="qa">${order.map(k=>`<button class="qb" data-k="${k}">${mathHTML(tx(q.a[k]))}</button>`).join('')}</div><div class="qnext"></div>`;
}
$('#quizBox').addEventListener('click',e=>{
  const b=e.target.closest('.qb');if(!b||!QZ||QZ.answered)return;
  const {q}=QZ.qs[QZ.i],k=+b.dataset.k,ok=k===q.c;QZ.answered=true;
  $$('.qb').forEach(x=>{if(+x.dataset.k===q.c)x.classList.add('ok');else if(x===b)x.classList.add('bad');x.disabled=true});
  if(ok)QZ.score++;
  sfx(ok?'qok':'qbad');
  say([{t:pick(ok?STORY.quizRight:STORY.quizWrong),m:ok?'smug':'sad'}],{u:1});
  $('.qnext').innerHTML=`<button class="tbtn primary" id="qNext">${QZ.i+1<QZ.qs.length?ui('qNext'):ui('qDone')}</button>`;
  $('#qNext').onclick=()=>{QZ.i++;drawQuiz()};
});

/* ========== level tree ========== */
function drawTree(){
  const sv=$('#tree'),CW=138,RH=78,PX=6,PY=62,CHG=64,LX=380;
  const yOf=l=>PY+l.pos[1]*RH+(l.ch-1)*CHG, xOf=l=>PX+LX+l.pos[0]*CW;
  const qPos=ch=>{const ls=LV.filter(l=>l.ch===ch),c=Math.max(...ls.map(l=>l.pos[0]))+1,f=ls[0];return{x:PX+LX+c*CW,y:yOf(f)}};
  const W=PX+LX+7*CW+40,H=yOf(LV[LV.length-1])+60;
  sv.setAttribute('viewBox',`0 0 ${W} ${H}`);sv.setAttribute('width',W);sv.style.width='min(100%,'+W+'px)';
  let s='';
  const elbow=(x1,y1,x2,y2,col)=>{if(y1===y2){s+=`<path d="M${x1},${y1}H${x2}" stroke="${col}" stroke-width="2" fill="none"/>`;return}
    const mx=x2-26,dy=y2>y1?12:-12;s+=`<path d="M${x1},${y1}H${mx-12}Q${mx},${y1} ${mx},${y1+dy}V${y2-dy}Q${mx},${y2} ${mx+12},${y2}H${x2}" stroke="${col}" stroke-width="2" fill="none"/>`};
  CHAPTERS.forEach((c,i)=>{const l=LV.find(x=>x.ch===i+1),y=yOf(l),ls=LV.filter(x=>x.ch===i+1),dn=ls.filter(x=>done.has(x.id)).length;
    const yb=y-46,hb=(Math.max(...ls.map(x=>x.pos[1]))-l.pos[1])*RH+100;
    s+=`<rect x="${PX}" y="${yb}" width="${W-PX-10}" height="${hb}" rx="24" fill="rgba(250,250,247,.55)"/>`;
    s+=`<text x="${PX+30}" y="${y+14}" font-size="44" font-weight="600" letter-spacing="-1.5" fill="${dn?'var(--ink)':'var(--grid2)'}" font-family="var(--font)">${i+1}</text>`;
    s+=`<text x="${PX+(i+1>9?96:84)}" y="${y-2}" font-size="16" font-weight="600" fill="var(--ink)" font-family="var(--font)">${tx(c)}</text>`;
    s+=`<text x="${PX+(i+1>9?96:84)}" y="${y+16}" font-size="12.5" font-weight="500" fill="var(--mute)" font-family="var(--font)">${ui('mmDone',{n:dn,N:ls.length})}</text>`;});
  LV.forEach(l=>l.req.forEach(r=>{
    const x2=xOf(l)-17,y2=yOf(l);
    if(typeof r==='string'){const on=quizPassed(+r.slice(1));
      s+=`<path d="M${x2-34},${y2}H${x2}" stroke="${on?'var(--ink)':'var(--grid2)'}" stroke-width="2"/><circle cx="${x2-38}" cy="${y2}" r="4" fill="${on?'var(--acc)':'var(--grid2)'}" stroke="var(--ink)" stroke-width="${on?1.2:0}"/>`;return}
    const a=LV[r-1];elbow(xOf(a)+17,yOf(a),x2,y2,done.has(r)?'var(--ink)':'var(--grid2)');
  }));
  CHAPTERS.forEach((_,i)=>{const ch=i+1,q=qPos(ch),row0=LV.find(x=>x.ch===ch).pos[1],last=LV.filter(l=>l.ch===ch&&l.pos[1]===row0).pop();
    const av=chapterDone(ch),ps=quizPassed(ch);
    s+=`<path d="M${xOf(last)+17},${q.y}H${q.x-30}" stroke="${av?'var(--ink)':'var(--grid2)'}" stroke-width="2"/>`;
    s+=`<g class="node${av?'':' lock'}" data-q="${ch}"><rect x="${q.x-30}" y="${q.y-17}" width="60" height="34" rx="17" fill="${ps?'var(--acc)':av?'var(--ink)':'var(--paper)'}" stroke="${av||ps?'none':'var(--grid2)'}"/>
      <text x="${q.x}" y="${q.y+1}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" font-family="var(--font)" fill="${ps?'var(--ink)':av?'#fff':'var(--mute)'}">${ps?prog.quiz[ch].best+'/5':(LANG==='en'?'test':'тест')}</text>
      <rect x="${q.x-46}" y="${q.y-24}" width="92" height="62" fill="transparent"/></g>`;});
  LV.forEach(l=>{
    const x=xOf(l),y=yOf(l),dn=done.has(l.id),av=available(l),st=(prog.lv[l.id]||{}).s||0,nm=tx(l.t);
    s+=`<g class="node${av?'':' lock'}" data-l="${l.id}">`;
    s+=`<circle cx="${x}" cy="${y}" r="17" fill="${dn?'var(--ink)':av?'var(--acc)':'var(--paper)'}" stroke="${dn||av?'none':'var(--grid2)'}" stroke-width="1.5"/>`;
    s+=`<text x="${x}" y="${y+1}" text-anchor="middle" dominant-baseline="central" font-size="13" font-weight="600" font-family="var(--font)" fill="${dn?'#fff':av?'var(--ink)':'var(--mute)'}">${l.id}</text>`;
    if(dn)[1,2,4].forEach((b,i)=>s+=`<circle cx="${x-9+i*9}" cy="${y+25}" r="3" fill="${st&b?'var(--ink)':'var(--line)'}"/>`);
    s+=`<text x="${x}" y="${y+(dn?42:34)}" text-anchor="middle" font-size="12" font-weight="500" font-family="var(--font)" fill="${av?'var(--ink2)':'var(--mute)'}">${nm.length>15?nm.slice(0,14)+'…':nm}</text>`;
    s+=`<rect x="${x-52}" y="${y-24}" width="104" height="70" fill="transparent"/></g>`;
  });
  sv.innerHTML=s;
  sv.querySelectorAll('[data-l]').forEach(n=>{const l=LV[n.dataset.l-1];
    n.onmouseenter=()=>$('#treeTip').innerHTML=`<b>${l.id}. ${tx(l.t)}</b><span class="tm">&ensp;${available(l)?`<span class="math">${mathHTML(tx(l.f))}</span>`:ui('unlocksAfter',{r:l.req.map(r=>typeof r==='string'?ui('testN',{n:r.slice(1)}):r).join(', ')})}</span>`;
    n.onclick=()=>{if(!available(l))return;sfx('ui');loadLevel(l);closeMenu()}});
  sv.querySelectorAll('[data-q]').forEach(n=>{const ch=+n.dataset.q;
    n.onmouseenter=()=>$('#treeTip').innerHTML=`<b>${ui('quizNode')}. ${tx(CHAPTERS[ch-1])}</b><span class="tm">&ensp;${chapterDone(ch)?(quizPassed(ch)?ui('qScore',{s:prog.quiz[ch].best,n:5}):ui('qReady')):ui('qLocked')}</span>`;
    n.onclick=()=>{if(chapterDone(ch))openQuiz(ch)}});
}

function topChapter(){let c=1;CHAPTERS.forEach((_,i)=>{if(LV.some(l=>l.ch===i+1&&done.has(l.id)))c=i+1});return c}
function drawMachine(){
  const sv=$('#machine');if(!sv)return;
  const on=CHAPTERS.map((_,i)=>chapterDone(i+1)),part=CHAPTERS.map((_,i)=>LV.filter(l=>l.ch===i+1&&done.has(l.id)).length/LV.filter(l=>l.ch===i+1).length);
