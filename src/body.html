<svg id="board" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="0" cy="0" r="1.1" fill="var(--grid)"/>
    </pattern>
  </defs>
  <rect id="gridRect" x="0" y="0" width="100%" height="100%" fill="url(#grid)"/>
  <g id="world"></g>
  <g id="fx"></g>
</svg>

<div id="frame"></div>

<header id="top" class="zz">
  <div class="tb"><button class="tbtn" id="btnMenu" data-t="menu"></button><div class="tgrp" id="tools" role="toolbar">
    <button class="ib" id="undo" data-tl="undo"><svg viewBox="0 0 24 24"><path d="M9 14L4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg></button>
    <button class="ib" id="redo" data-tl="redo"><svg viewBox="0 0 24 24"><path d="M15 14l5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg></button>
    <i class="tsep"></i>
    <button class="ib" id="knifeBtn" data-tl="knife" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.12 15.88"/><path d="M14.47 14.48L20 20"/><path d="M8.12 8.12L12 12"/></svg></button>
  </div></div>
  <div class="tb r"><button class="tbtn" id="hud"></button><button class="tbtn" id="btnClear" data-t="clear"></button><button class="tbtn primary" id="verify" data-t="verify"></button></div>
</header>

<div id="taskCard" class="zz"><div id="formula" class="math"></div><div id="ttWrap"></div></div>

<aside id="palette" class="zz"></aside>
<div id="zoom" class="zz"><button class="tbtn" id="zOut">−</button><button class="tbtn" id="zFit" data-t="fit"></button><button class="tbtn" id="zIn">+</button></div>

<section id="sheet" class="zz">
  <div id="grip"><span id="lvNum"></span><span id="lvTitle"></span><span id="lvStars"></span><span id="saved" data-t="saved"></span><button id="hintBtn"></button><button id="sheetTog" aria-label="−"><svg viewBox="0 0 12 12"><path d="M2.5 4.5L6 8L9.5 4.5"/></svg></button></div>
  <div id="sheetBody">
    <div id="task"><div id="taskText"></div><div id="hint"></div></div>
    <div id="stampTbl"></div>
  </div>
</section>

<div id="toast" class="zz"></div>
<button id="selPop" data-t="delete"></button>
<div id="loupe"><svg width="132" height="132"><rect width="132" height="132" fill="var(--bg)"/><g id="loupeG"><use data-href="#gridRect"/><use data-href="#world"/></g><circle cx="66" cy="66" r="3" fill="none" stroke="var(--coral)" stroke-width="1.5"/></svg></div>
<div id="result"><div id="resCard" class="zz"><div id="resTitle"></div><div id="resSub"></div><div id="resBtns"></div></div></div>

<div id="ov" class="on">
  <div id="ovBg" aria-hidden="true"></div>
  <div class="scr on zz" id="scrMain">
   <div class="mcol">
    <div class="brand">Logic Lab</div>
    <div class="brand-sub" data-t="brandSub"></div>
    <div class="mlist">
      <button class="mi" data-go="continue"><span data-t="cont"></span><span class="mm" id="mmCont"></span></button>
      <button class="mi" data-go="levels"><span data-t="levels"></span><span class="mm" id="mmLevels"></span></button>
      <button class="mi" data-go="profile"><span data-t="profile"></span><span class="mm" id="mmProfile"></span></button>
      <button class="mi" data-go="shop"><span data-t="shop"></span><span class="mm" id="mmShop"></span></button>
      <button class="mi" data-go="sandbox"><span data-t="sandbox"></span></button>
      <button class="mi" data-go="settings"><span data-t="settings"></span></button>
      <button class="mi" data-go="about"><span data-t="about"></span></button>
      <button class="mi" data-go="quit" id="quitBtn"><span data-t="quit"></span></button>
    </div>
   </div>
   <div class="mcol"><svg id="machine" viewBox="0 0 640 470" role="img"></svg><div id="machineCap"></div></div>
  </div>
  <div class="scr zz" id="scrLevels">
    <h2 data-t="levels"></h2>
    <svg id="tree"></svg>
    <div id="treeList"></div>
    <div id="treeTip"></div>
    <button class="mi small" data-go="main" data-t="back"></button>
  </div>
  <div class="scr zz" id="scrProfile">
    <h2 data-t="profile"></h2>
    <div id="profBox"></div>
    <button class="mi small" data-go="main" data-t="back"></button>
  </div>
  <div class="scr zz" id="scrShop">
    <h2 data-t="shop"></h2>
    <div id="shopBox"></div>
    <button class="mi small" data-go="main" data-t="back"></button>
  </div>
  <div class="scr zz" id="scrQuiz">
    <div id="quizBox"></div>
    <button class="mi small" data-go="levels" data-t="back"></button>
  </div>
  <div class="scr zz" id="scrSettings">
    <h2 data-t="settings"></h2>
    <div id="setList"></div>
    <button class="mi small" id="setReset" data-t="reset"></button>
    <button class="mi small" data-go="main" data-t="back" style="margin-top:6px"></button>
  </div>
  <div class="scr zz" id="scrAbout">
    <h2 data-t="about"></h2>
    <div class="about">
      <p data-t="aboutT1"></p>
      <p style="margin-top:14px" data-t="aboutT2"></p>
    </div>
    <button class="mi small" data-go="main" data-t="back"></button>
  </div>
</div>

<div id="bitDock" class="zz" aria-hidden="true"></div>
<div id="mascot" class="zz">
  <button id="bitTab" aria-label="Bit"><svg id="bitMini" viewBox="8 -2 64 80"></svg></button>
  <div id="chat" role="log" aria-live="polite">
    <div id="bitStage"><svg id="bit" viewBox="0 0 80 100" aria-label="Bit"></svg></div>
    <div id="chatMain">
      <div class="chd"><button id="chatX" data-tl="close"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button><span class="cn" data-t="bitName"></span><span class="cs" data-t="chan"></span><button id="chatLogBtn" data-t="log"></button></div>
      <div id="chatBody"><div id="chatText"></div><div id="chatCh"></div><div id="chatMore"></div></div>
      <div id="chatLog"></div>
    </div>
  </div>
</div>
